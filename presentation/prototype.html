<title>MGS Document Center</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  /* ============================================================
     MGS Document Center — ระบบสีและรูปทรง
     ทองจากโลโก้บริษัทเป็นแกน แต่ไล่เฉดตามหน้าที่ ไม่ใช่ทองเข้มสีเดียว:
       เฉดสว่าง = พื้น/โลหะ   เฉดเข้ม = ตัวอักษร
     ทุกสีที่ใช้กับตัวอักษรผ่าน WCAG AA (4.5:1) ทั้งโหมดสว่างและมืด
     ============================================================ */
  :root{
    /* ทอง — ไล่เฉดจากพื้นถึงตัวอักษร */
    --gold-50:#FBF7EC; --gold-100:#F5EBD2; --gold-200:#EBD9A8;
    --gold-400:#D4AF37;                     /* ทองโลหะจากโลโก้ — พื้นปุ่ม/แถบ ใช้ตัวอักษรเข้มทับ */
    --gold-500:#B99326;
    --gold:#8A6819;                          /* ทองสำหรับตัวอักษรบนพื้นอ่อน */
    --gold-800:#6B520F;
    --gold-bg:var(--gold-50);

    /* พื้นและตัวอักษร — งาช้างอุ่น ให้ทองไม่ลอย */
    --paper:#fff; --surface:#FAF8F3; --surface-2:#F2EEE4; --shade:#1E1B16;
    --ink:#1E1B16; --ink-2:#5A5348; --ink-3:#767065;
    --line:#EAE4D8; --line-2:#D9D1C0;

    /* สีบอกลำดับความสำคัญ — ใช้ความหมายเดียวกันทั้งระบบ */
    --go:#2F6B45;   --go-bg:#E8F1EA;     /* เสร็จแล้ว ผ่าน */
    --warn:#9A5A1B; --warn-bg:#FBF0E2;   /* ใกล้ครบกำหนด ต้องดู */
    --stop:#A33025; --stop-bg:#FBEAE7;   /* เลยกำหนด ติดปัญหา */
    --cold:#38598F; --cold-bg:#E9EEF7;   /* ข้อมูล อ้างอิง */

    /* สีประจำแผนก — ทองเป็นแกน สีเสริมตัดกันให้แยกออกจากกันได้ในพริบตา */
    --sr:#8A6819;  --sr-soft:#F7F0DC;
    --qc:#146B5C;  --qc-soft:#E4F1EE;
    --ls:#38598F;  --ls-soft:#E9EEF7;
    --wh:#5E6B3E;  --wh-soft:#EDF0E4;
    --ac:#A0522D;  --ac-soft:#F8EBE3;
  --ac_fn:#8C4526; --ac_fn-soft:#F7E9E1;
  --ac_th:#8A5E28; --ac_th-soft:#F8F0DF;
    --ach:#6B3F6E; --ach-soft:#F2E9F3;
    --gm:#414A45;  --gm-soft:#EBEDEB;
  --it:#55606B;  --it-soft:#EAEDF0;

    --display:"Anuphan","IBM Plex Sans Thai","Leelawadee UI","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
    --sans:"IBM Plex Sans Thai","Leelawadee UI","Noto Sans Thai","Sarabun","Thonburi",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;

    --r-sm:8px; --r-md:14px; --r-lg:20px;
    --sh-1:0 1px 2px rgba(62,50,26,.05), 0 1px 3px rgba(62,50,26,.04);
    --sh-2:0 10px 30px rgba(62,50,26,.10), 0 2px 8px rgba(62,50,26,.05);
    --sh-3:0 24px 60px rgba(30,27,22,.22), 0 6px 18px rgba(30,27,22,.12);
    --ease:180ms cubic-bezier(.2,.7,.3,1);
    --rc:var(--sr); --rc-soft:var(--sr-soft);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --gold-50:#241D0F; --gold-100:#2E2513; --gold-200:#4A3B18;
    --gold-400:#D4AF37; --gold-500:#C9A231;
    --gold:#E0BC55; --gold-800:#F0D68F;
    --gold-bg:var(--gold-50);

    --paper:#1E1A14; --surface:#16130E; --surface-2:#2A251C; --shade:#0F0D09;
    --ink:#F2EDE3; --ink-2:#BDB4A5; --ink-3:#948B7C;
    --line:#332D23; --line-2:#463E31;

    --go:#5FC28A;   --go-bg:#152618;
    --warn:#E0A25C; --warn-bg:#2B1F11;
    --stop:#EE8B80; --stop-bg:#2E1815;
    --cold:#7793C4; --cold-bg:#161E2C;

    --sr:#C69A38;  --sr-soft:#2A2113;
    --qc:#3FBFA8;  --qc-soft:#0F2621;
    --ls:#7793C4;  --ls-soft:#161E2C;
    --wh:#8B9A66;  --wh-soft:#1C2115;
    --ac:#C97E58;  --ac-soft:#2A1A12;
  --ac_fn:#D08C63; --ac_fn-soft:#2A1811;
  --ac_th:#D3A566; --ac_th-soft:#2A2113;
    --ach:#B183B4; --ach-soft:#251A26;
    --gm:#8B978F;  --gm-soft:#1D211E;
  --it:#9AA7B4;  --it-soft:#191D21;

    --sh-1:0 1px 2px rgba(0,0,0,.34), 0 1px 3px rgba(0,0,0,.26);
    --sh-2:0 10px 30px rgba(0,0,0,.46), 0 2px 8px rgba(0,0,0,.34);
    --sh-3:0 24px 60px rgba(0,0,0,.60), 0 6px 18px rgba(0,0,0,.44);
  }}
  :root[data-theme="dark"]{
    --gold-50:#241D0F; --gold-100:#2E2513; --gold-200:#4A3B18;
    --gold-400:#D4AF37; --gold-500:#C9A231;
    --gold:#E0BC55; --gold-800:#F0D68F;
    --gold-bg:var(--gold-50);

    --paper:#1E1A14; --surface:#16130E; --surface-2:#2A251C; --shade:#0F0D09;
    --ink:#F2EDE3; --ink-2:#BDB4A5; --ink-3:#948B7C;
    --line:#332D23; --line-2:#463E31;

    --go:#5FC28A;   --go-bg:#152618;
    --warn:#E0A25C; --warn-bg:#2B1F11;
    --stop:#EE8B80; --stop-bg:#2E1815;
    --cold:#7793C4; --cold-bg:#161E2C;

    --sr:#C69A38;  --sr-soft:#2A2113;
    --qc:#3FBFA8;  --qc-soft:#0F2621;
    --ls:#7793C4;  --ls-soft:#161E2C;
    --wh:#8B9A66;  --wh-soft:#1C2115;
    --ac:#C97E58;  --ac-soft:#2A1A12;
  --ac_fn:#D08C63; --ac_fn-soft:#2A1811;
  --ac_th:#D3A566; --ac_th-soft:#2A2113;
    --ach:#B183B4; --ach-soft:#251A26;
    --gm:#8B978F;  --gm-soft:#1D211E;
  --it:#9AA7B4;  --it-soft:#191D21;

    --sh-1:0 1px 2px rgba(0,0,0,.34), 0 1px 3px rgba(0,0,0,.26);
    --sh-2:0 10px 30px rgba(0,0,0,.46), 0 2px 8px rgba(0,0,0,.34);
    --sh-3:0 24px 60px rgba(0,0,0,.60), 0 6px 18px rgba(0,0,0,.44);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55;
    -webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  h1,h2,h3{text-wrap:balance;font-family:var(--display);letter-spacing:-.015em}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){*{transition-duration:0ms!important;animation-duration:0ms!important}}
  :focus-visible{outline:2px solid var(--rc);outline-offset:2px;border-radius:var(--r-sm)}

  .demo{background:var(--gold-50);color:var(--gold-800);padding:8px 20px;font-size:12.5px;text-align:center;
    border-bottom:1px solid var(--gold-200)}
  .demo b{color:var(--gold-800);font-weight:600}

  /* ---------- แถบบน: โลโก้ + เมนู + เครื่องมือ + ผู้ใช้ ---------- */
  .app{min-height:100vh;display:flex;flex-direction:column}
  .topnav{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:18px;padding:11px 24px;box-shadow:var(--sh-1)}
  .brand{display:flex;align-items:center;gap:11px;flex:none;text-decoration:none;color:inherit;
    background:none;border:0;padding:0;border-radius:var(--r-sm)}
  .brand .mk{width:34px;height:34px;flex:none;display:block}
  .brand .tx b{display:block;font-family:var(--display);font-size:16px;font-weight:600;line-height:1.15;letter-spacing:-.02em}
  .brand .tx span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
    font-family:var(--mono);margin-top:1px}
  nav.mainnav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
  nav.mainnav::-webkit-scrollbar{display:none}
  nav.mainnav button{background:none;border:0;padding:8px 15px;border-radius:999px;color:var(--ink-2);
    font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:7px;
    transition:background var(--ease),color var(--ease)}
  nav.mainnav button:hover{background:var(--surface-2);color:var(--ink)}
  nav.mainnav button[aria-current="page"]{background:var(--rc-soft);color:var(--rc);font-weight:600}
  nav.mainnav .cnt{font-family:var(--mono);font-size:10.5px;font-weight:600;background:var(--surface-2);
    color:var(--ink-2);padding:1px 7px;border-radius:999px;line-height:1.5}
  nav.mainnav button[aria-current="page"] .cnt{background:var(--rc);color:var(--paper)}
  nav.mainnav button:hover .cnt{background:var(--line-2);color:var(--ink)}

  .subbar{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 24px;
    display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;position:sticky;top:57px;z-index:25}
  .rolepick{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .rolepick .lb{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em}
  .rolepick button{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 9px;
    font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--ink-2);
    transition:border-color var(--ease),color var(--ease),background var(--ease)}
  .rolepick button:hover{border-color:var(--rc);color:var(--ink)}
  .rolepick button i{width:8px;height:8px;border-radius:50%;background:var(--rc);display:block;flex:none}
  .rolepick button[aria-pressed="true"]{border-color:var(--rc);background:var(--rc-soft);color:var(--rc);font-weight:600}
  .topbar .sp,.subbar .sp{flex:1}
  .user{display:flex;align-items:center;gap:9px;font-size:12.5px;white-space:nowrap;flex:none}
  .user .av{width:32px;height:32px;border-radius:50%;background:var(--rc);color:var(--paper);display:grid;place-items:center;
    font-family:var(--mono);font-size:11px;font-weight:600;flex:none}

  main{padding:24px;min-width:0;width:100%;max-width:1320px;margin:0 auto;flex:1}
  .sitefoot{padding:18px 24px 40px;color:var(--ink-3);font-size:11.5px;text-align:center;line-height:1.7}

  .ph{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:18px}
  .ph h1{margin:0;font-size:27px;font-weight:600;letter-spacing:-.025em}
  .ph .d{color:var(--ink-3);font-size:13px}

  /* ---------- แท็บสถานะ ---------- */
  .stabs{display:flex;gap:4px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .stabs::-webkit-scrollbar{display:none}
  .stabs button{background:none;border:0;padding:7px 14px;color:var(--ink-2);border-radius:999px;
    font-size:13.5px;white-space:nowrap;transition:background var(--ease),color var(--ease)}
  .stabs button:hover{background:var(--surface-2);color:var(--ink)}
  .stabs button[aria-current="true"]{color:var(--rc);background:var(--rc-soft);font-weight:600}
  .stabs .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:5px}
  .stabs button[aria-current="true"] .n{color:var(--rc)}

  /* ---------- ไทล์สรุป — สีบอกลำดับความสำคัญ ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:var(--paper);padding:16px 18px 15px;border-radius:var(--r-md);box-shadow:var(--sh-1)}
  .kpi .n{font-family:var(--display);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;
    line-height:1.05;letter-spacing:-.03em}
  .kpi .k{font-size:12.5px;color:var(--ink-2);margin-top:5px}
  .kpi.a{background:var(--gold-50)}   .kpi.a .n{color:var(--gold)}
  .kpi.r{background:var(--stop-bg)}   .kpi.r .n{color:var(--stop)}
  .kpi.g{background:var(--go-bg)}     .kpi.g .n{color:var(--go)}
  .kpi.b{background:var(--cold-bg)}   .kpi.b .n{color:var(--cold)}

  /* ---------- การ์ด ---------- */
  .card{background:var(--paper);margin-bottom:18px;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-1)}
  .card>h3{margin:0;padding:14px 18px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;gap:10px;align-items:center;font-family:var(--display)}
  .card>h3 .c{font-family:var(--sans);font-size:11.5px;color:var(--ink-3);font-weight:400;letter-spacing:0}

  /* ---------- แถบเครื่องมือ / ค้นหา ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:var(--paper);
    border-radius:var(--r-md);margin-bottom:16px;align-items:center;box-shadow:var(--sh-1)}
  .toolbar input[type=search],.toolbar select{border:1px solid var(--line-2);background:var(--paper);padding:8px 12px;
    font-size:14px;min-width:0;border-radius:999px}
  .toolbar input[type=search]{flex:1;min-width:180px}
  .toolbar label{font-size:12.5px;color:var(--ink-3)}

  /* ---------- ตาราง ---------- */
  .tw{overflow-x:auto;background:var(--paper);border-radius:var(--r-md);box-shadow:var(--sh-1)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px}
  th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  thead th{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
    font-weight:500;background:var(--surface);white-space:nowrap;position:sticky;top:0}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.click{cursor:pointer;transition:background var(--ease)}
  tbody tr.click:hover{background:var(--surface)}
  td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .pono{font-family:var(--mono);font-weight:600;color:var(--ink);white-space:nowrap}
  .sub{font-size:11.5px;color:var(--ink-3)}

  /* ---------- ป้ายสถานะ ---------- */
  .pill{display:inline-block;font-size:11px;padding:3px 10px;white-space:nowrap;font-family:var(--mono);border-radius:999px}
  .pill.ok{color:var(--go);background:var(--go-bg)}
  .pill.wait{color:var(--ink-3);background:var(--surface-2)}
  .pill.late{color:var(--stop);background:var(--stop-bg);font-weight:600}
  .pill.due{color:var(--warn);background:var(--warn-bg)}
  .pill.info{color:var(--cold);background:var(--cold-bg)}
  .dept{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;white-space:nowrap;
    border-radius:999px;background:var(--surface-2)}

  /* ---------- แถบเฟส ---------- */
  .phases{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 18px}
  .pz{border-radius:var(--r-sm);padding:11px 13px;background:var(--surface)}
  .pz .t{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .pz .m{font-size:11.5px;color:var(--ink-3);margin-top:3px}
  .pz .tr{height:5px;background:var(--surface-2);margin-top:9px;border-radius:999px;overflow:hidden}
  .pz .fl{height:5px;background:var(--line-2);border-radius:999px;transition:width var(--ease)}
  .pz.done{background:var(--go-bg)} .pz.done .fl{background:var(--go)} .pz.done .t{color:var(--go)}
  .pz.now{background:var(--gold-50)} .pz.now .fl{background:var(--gold-400)} .pz.now .t{color:var(--gold)}

  /* ---------- หัวเอกสาร ---------- */
  .dh{background:var(--paper);margin-bottom:18px;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-1)}
  .dh .top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;padding:18px 18px 14px}
  .dh .top .n{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  .dh .top .t{font-size:17px;font-weight:600;font-family:var(--display)}
  .dh .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    border-top:1px solid var(--line);background:var(--paper)}
  .dh .f{background:var(--paper);padding:11px 18px;border-right:1px solid var(--line);
    border-bottom:1px solid var(--line)}
  .dh .f .k{font-size:10px;color:var(--ink-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
  .dh .f .v{font-size:13.5px;margin-top:2px}

  .rowline{display:flex;gap:12px;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--line);
    font-size:13.5px;align-items:flex-start}
  .rowline:last-of-type{border-bottom:0}
  .rowline .nm{color:var(--ink-3);flex:none;min-width:140px}
  .rowline.miss{background:var(--stop-bg)}

  /* ---------- กล่องข้อความ — ความหมายมาจากสีพื้น ไม่ใช่ไอคอน ---------- */
  .note{display:flex;gap:10px;padding:12px 16px;font-size:13px;background:var(--cold-bg);color:var(--ink-2);
    border-radius:var(--r-sm);line-height:1.6}
  .note b{color:var(--ink)}
  .note.warn{background:var(--warn-bg);border-left:3px solid var(--warn)}
  .note.bad{background:var(--stop-bg);border-left:3px solid var(--stop)}
  .note.good{background:var(--go-bg)}
  .note.info{background:var(--cold-bg)}

  .actions{display:flex;flex-wrap:wrap;gap:9px;padding:14px 18px;align-items:center}
  .actions .hint{font-size:12px;color:var(--ink-3)}
  .btn{background:var(--paper);border:1px solid var(--line-2);padding:8px 16px;font-size:13.5px;border-radius:999px;
    color:var(--ink);transition:background var(--ease),border-color var(--ease),transform var(--ease)}
  .btn:hover{background:var(--surface-2);border-color:var(--line-2)}
  .btn:active{transform:translateY(1px)}
  .btn.pri{background:var(--gold-400);border-color:var(--gold-400);color:#1E1B16;font-weight:600}
  .btn.pri:hover{background:var(--gold-500);border-color:var(--gold-500)}
  .btn.ok{background:var(--go);border-color:var(--go);color:#fff;font-weight:600}
  .btn.bad{background:var(--stop);border-color:var(--stop);color:#fff;font-weight:600}
  .back{background:none;border:0;color:var(--ink-3);font-size:13px;padding:6px 0;margin-bottom:10px;
    display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-sm)}
  .back:hover{color:var(--ink)}

  .tl{padding:10px 18px;max-height:300px;overflow-y:auto}
  .tl .e{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .tl .e:last-child{border-bottom:0}
  .tl .e time{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

  .steps{padding:6px 18px 14px}
  .step{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:flex-start}
  .step:last-child{border-bottom:0}
  .step .i{width:24px;height:24px;flex:none;border-radius:50%;background:var(--surface-2);color:var(--ink-3);
    display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600}
  .step.done .i{background:var(--go-bg);color:var(--go)}
  .step.done .nm{color:var(--ink-2)}
  .step.now .i{background:var(--gold-400);color:#1E1B16}
  .step.now{font-weight:600}
  .step.skip{opacity:.5}

  .bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding:16px 18px}
  .bar .tr{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:7px}
  .bar .fl{height:8px;background:var(--gold-400);border-radius:999px;transition:width var(--ease)}
  .bar.r .fl{background:var(--stop)}
  .bar .v{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:5px}
  .empty{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:13px}

  /* ---------- ปุ่มเครื่องมือบนแถบบน ---------- */
  .iconbtn{background:var(--paper);border:1px solid var(--line);padding:6px 13px;font-size:12.5px;border-radius:999px;
    display:flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink-2);
    transition:border-color var(--ease),color var(--ease),background var(--ease)}
  .iconbtn:hover{border-color:var(--line-2);background:var(--surface);color:var(--ink)}
  .iconbtn .bdg{font-family:var(--mono);font-size:10px;font-weight:600;background:var(--stop);color:#fff;
    padding:0 6px;border-radius:999px}
  .iconbtn.on{border-color:var(--rc);background:var(--rc-soft);color:var(--rc);font-weight:600}

  /* ---------- รายการแจ้งเตือน ---------- */
  .nlist .n1{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:12px 18px;
    border-bottom:1px solid var(--line);align-items:start;font-size:13.5px;cursor:pointer;transition:background var(--ease)}
  .nlist .n1:last-child{border-bottom:0}
  .nlist .n1:hover{background:var(--surface)}
  .nlist .n1.unread{background:var(--cold-bg)}
  .nlist .n1 .ic{align-self:stretch;border-radius:999px;background:var(--line-2);min-height:26px;font-size:0}
  .nlist .n1 .b{color:var(--ink-2);font-size:12.5px;margin-top:2px}
  .nlist .n1 time{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
  .nlist .n1.act .ic{background:var(--gold-400)}
  .nlist .n1.warn .ic{background:var(--stop)}
  .nlist .n1.info .ic{background:var(--cold)}

  /* ---------- ผลตรวจก่อนบันทึก ---------- */
  .chk{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:9px 18px;
    border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
  .chk:last-child{border-bottom:0}
  .chk .m{font-family:var(--mono);font-weight:600;text-align:center}
  .chk.pass .m{color:var(--go)} .chk.warn .m{color:var(--warn)} .chk.block .m{color:var(--stop)}
  .chk.block{background:var(--stop-bg)} .chk.warn{background:var(--warn-bg)}
  .chk .who{font-size:11.5px;color:var(--ink-3);white-space:nowrap}

  /* ---------- ป๊อปอัป ---------- */
  .bugwrap{position:fixed;inset:0;background:rgba(30,27,22,.44);z-index:55;backdrop-filter:blur(2px)}
  .bugpanel{position:fixed;right:16px;bottom:16px;width:min(400px,calc(100vw - 32px));max-height:calc(100vh - 32px);
    overflow-y:auto;background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--sh-3);z-index:56}
  .bugpanel h3{margin:0;padding:14px 18px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;font-family:var(--display)}
  .bugpanel h3 button{background:none;border:0;color:var(--ink-3);font-size:18px;line-height:1;padding:2px 6px;
    border-radius:999px}
  .bugpanel h3 button:hover{background:var(--surface-2);color:var(--ink)}
  .bugbody{padding:15px 18px 18px;display:flex;flex-direction:column;gap:12px}
  .bugbody textarea{border:1px solid var(--line-2);background:var(--paper);padding:9px 12px;font:inherit;
    font-size:13.5px;min-height:74px;resize:vertical;width:100%;border-radius:var(--r-sm)}
  .bugbody .fl2{display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .ctxbox{background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;font-size:11.5px;
    font-family:var(--mono);color:var(--ink-2);line-height:1.7}
  .ctxbox b{color:var(--ink)}
  .bugpanel.wide{width:min(560px,calc(100vw - 32px))}

  .chips2{display:flex;gap:6px;flex-wrap:wrap}
  .chips2 .chip2{background:var(--paper);border:1px solid var(--line);border-radius:999px;
    padding:5px 13px;font-size:12.5px;color:var(--ink-2)}
  .chips2 .chip2 .c{font-family:var(--mono);color:var(--ink-3);margin-left:6px;font-size:11px}
  .chips2 .chip2:hover{border-color:var(--line-2);background:var(--surface)}
  .chips2 .chip2.on{background:var(--rc);border-color:var(--rc);color:var(--paper);font-weight:600}
  .chips2 .chip2.on .c{color:var(--paper);opacity:.75}
  a.btn.qcapp{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    background:var(--gold-50);border-color:var(--gold-200);color:var(--gold);font-weight:600}
  a.btn.qcapp:hover{background:var(--gold-400);border-color:var(--gold-400);color:#1E1B16}

  .prtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
  .prtabs .prtab{flex:1 1 190px;text-align:left;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-md);padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:var(--ease)}
  .prtabs .prtab .s{display:block;font-weight:400;font-size:11px;color:var(--ink-3);margin-top:2px}
  .prtabs .prtab:hover{border-color:var(--line-2);background:var(--paper)}
  .prtabs .prtab.on{background:var(--paper);border-color:var(--gold-400);color:var(--ink);box-shadow:var(--sh-1)}
  .prtabs .prtab.on .s{color:var(--gold)}

  .sev{display:flex;flex-direction:column;gap:6px}
  .sev label{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-sm);
    padding:9px 12px;font-size:13px;cursor:pointer;transition:border-color var(--ease),background var(--ease)}
  .sev label:has(input:checked){border-color:var(--gold-400);background:var(--gold-50)}
  .sev label .s{font-size:11.5px;color:var(--ink-3);display:block}

  .lbl{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fld{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fld input,.fld select{border:1px solid var(--line-2);background:var(--paper);padding:8px 11px;font:inherit;
    font-size:13.5px;width:100%;border-radius:var(--r-sm)}
  .fld input[readonly]{background:var(--surface);color:var(--ink-2)}
  .fld .req{color:var(--stop)}
  .calcbox{background:var(--surface);border-radius:var(--r-sm);padding:11px 14px;font-size:13px}
  .calcbox .cl{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font-variant-numeric:tabular-nums}
  .calcbox .cl.tot{border-top:1px solid var(--line-2);margin-top:6px;padding-top:7px;font-weight:600}
  .calcbox .cl span:last-child{font-family:var(--mono)}
  .errbox{font-size:12.5px;display:flex;flex-direction:column;gap:5px}
  .errbox .e1{color:var(--stop);background:var(--stop-bg);border-left:3px solid var(--stop);
    border-radius:var(--r-sm);padding:6px 11px}
  .errbox .w1{color:var(--warn);background:var(--warn-bg);border-left:3px solid var(--warn);
    border-radius:var(--r-sm);padding:6px 11px}
  .chkline{display:flex;gap:8px;align-items:center;font-size:13.5px}

  /* ---------- กล่อง "ตอนนี้ต้องทำอะไร" ---------- */
  .todo{background:var(--paper);margin-bottom:18px;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-2)}
  .todo>h3{margin:0;padding:12px 18px;font-size:13.5px;font-weight:600;background:var(--gold-400);color:#1E1B16;
    display:flex;justify-content:space-between;gap:10px;align-items:center;font-family:var(--display)}
  .todo.calm>h3{background:var(--surface);color:var(--ink-2);border-bottom:1px solid var(--line)}
  .todo .big{padding:16px 18px;font-size:15.5px;font-weight:600}
  .todo .then{padding:0 18px 15px;font-size:12.5px;color:var(--ink-3)}

  /* ---------- บล็อกพับเก็บ ---------- */
  details.blk{background:var(--paper);margin-bottom:18px;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-1)}
  details.blk>summary{padding:13px 18px;font-size:13.5px;font-weight:600;cursor:pointer;list-style:none;
    display:flex;justify-content:space-between;gap:10px;align-items:center;font-family:var(--display)}
  details.blk>summary::-webkit-details-marker{display:none}
  details.blk>summary::after{content:"▾";color:var(--ink-3);font-size:11px;font-family:var(--sans)}
  details.blk[open]>summary{border-bottom:1px solid var(--line)}
  details.blk[open]>summary::after{content:"▴"}
  details.blk>summary .c{font-family:var(--sans);font-size:11.5px;color:var(--ink-3);font-weight:400}

  .src{font-family:var(--mono);font-size:9px;letter-spacing:.06em;border-radius:999px;padding:1px 6px;
    color:var(--cold);background:var(--cold-bg);margin-left:5px;vertical-align:middle;white-space:nowrap}
  .src.man{color:var(--ink-3);background:var(--surface-2)}
  .synced{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:11px 18px;border-radius:var(--r-md);
    background:var(--cold-bg);color:var(--cold);font-size:12.5px;margin-bottom:18px}
  .synced.stale{background:var(--warn-bg);color:var(--warn)}
  .synced .sp2{flex:1}

  .qrow.sel{background:var(--go-bg)}
  .qrow.sel td:first-child{box-shadow:inset 3px 0 0 var(--go)}
  .etype{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.05em;padding:2px 7px;
    border-radius:999px;white-space:nowrap;margin-left:6px;background:var(--surface-2);color:var(--ink-3)}
  .etype.cash{color:var(--gold);background:var(--gold-100)}

  /* ---------- ตัวอย่างข้อความที่จะพิมพ์ลงเอกสาร ---------- */
  .prev{border-radius:var(--r-sm);background:var(--surface);padding:0;overflow:hidden}
  .prev .pt{background:var(--surface-2);padding:7px 13px;font-size:11px;font-family:var(--mono);letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .prev .sheet{padding:15px 17px;min-height:96px;font-size:13px;line-height:1.75;white-space:pre-wrap;
    border:0;width:100%;resize:vertical;font-family:var(--sans);background:var(--paper);color:var(--ink)}
  .prev.off{opacity:.45}

  /* ---------- ตัวอย่างเอกสารจริง + บล็อกข้อความที่ลากวางได้
     ตำแหน่งเก็บเป็น 0–100 ของ "พื้นที่ว่าง" แล้วใช้ left:X% คู่กับ translateX(-X%)
     ทำให้ 0 = ชิดซ้าย · 50 = กึ่งกลาง · 100 = ชิดขวา โดยไม่ต้องวัดขนาดกล่องตอนวาด ---------- */
  .docprev{border-radius:var(--r-md);background:var(--surface-2);overflow:hidden}
  .docprev.off{opacity:.4;filter:grayscale(1)}
  .docprev .pt{background:var(--surface);padding:7px 13px;font-size:11px;font-family:var(--mono);letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .docprev .stage{padding:18px;display:flex;justify-content:center}
  .docprev .fb{background:var(--surface);padding:8px 13px;font-size:11.5px;color:var(--ink-2);
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .docprev .fb b{font-family:var(--mono);color:var(--ink)}
  /* หน้ากระดาษเป็นสีขาวเสมอทั้งโหมดสว่างและมืด — เอกสารจริงที่พิมพ์ออกมาก็เป็นกระดาษขาว */
  .page{position:relative;width:100%;max-width:340px;aspect-ratio:1/1.414;background:#fff;color:#1a1a1a;
    box-shadow:var(--sh-2);border-radius:3px;padding:16px 15px;font-size:7px;line-height:1.6;
    touch-action:none;user-select:none;overflow:hidden}
  .page .ph{display:flex;gap:8px;align-items:flex-start;border-bottom:1.5px solid #1a1a1a;padding-bottom:7px;margin-bottom:0}
  .page .lg{width:22px;height:22px;flex:0 0 auto}
  .page .ti{flex:1}
  .page .ti b{display:block;font-size:10px;letter-spacing:.02em}
  .page .ti span{color:#666}
  .page .mt{text-align:right;color:#444;white-space:nowrap}
  .page .rows{margin-top:9px}
  .page .r{display:flex;justify-content:space-between;gap:6px;padding:3.5px 0;border-bottom:1px solid #e6e6e6}
  .page .r i{font-style:normal;color:#555}
  .page .bar{height:4px;background:#ededed;border-radius:2px;margin:3px 0}
  .page .bar.s{width:62%} .page .bar.m{width:84%}
  .page .tot{margin-top:9px;display:flex;justify-content:space-between;font-weight:700;font-size:9px;
    border-top:1.5px solid #1a1a1a;padding-top:6px}
  .page .sign{position:absolute;left:15px;bottom:14px;right:15px;display:flex;justify-content:space-between;
    color:#999;font-size:6px}
  /* width:max-content จำเป็น — กล่อง absolute ที่ left ใกล้ขอบขวาจะถูกบีบให้แคบตามที่เหลือ
     ทำให้ข้อความตกบรรทัดทีละ 2–3 ตัวอักษร · max-width คิดจากความกว้างหน้ากระดาษ ไม่ใช่ที่เหลือ */
  .stampbox{position:absolute;cursor:grab;touch-action:none;white-space:pre-wrap;line-height:1.5;padding:4px 6px;
    border:1px dashed transparent;border-radius:3px;width:max-content;max-width:58%;transition:border-color 120ms}
  .stampbox:hover{border-color:rgba(0,0,0,.28)}
  .stampbox.grab{cursor:grabbing;border-color:#B99326;background:rgba(212,175,55,.14)}
  .stampbox .gr{position:absolute;top:-9px;left:-1px;font-size:6px;letter-spacing:.05em;color:#8A6819;
    opacity:0;transition:opacity 120ms;font-family:var(--mono)}
  .stampbox:hover .gr,.stampbox.grab .gr{opacity:1}

  .bundle{background:var(--go-bg);border-radius:var(--r-md);padding:13px 18px;margin-bottom:18px;
    display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;color:var(--go);font-size:13px}
  .bundle .sp2{flex:1}
  .bundle .fn{font-family:var(--mono);font-size:12px;font-weight:600}
  .droot{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border-radius:999px;
    padding:2px 9px;color:var(--ink-2);white-space:nowrap}

  /* ---------- ใบส่งงาน — สิ่งที่แผนกก่อนหน้าส่งมาให้ ---------- */
  .hoff{border-left:3px solid var(--rc);border-radius:var(--r-md);background:var(--rc-soft);
    padding:13px 18px 11px;margin-bottom:16px}
  .hoff>.ht{font-size:11px;font-family:var(--mono);letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hoff .grp{margin-bottom:10px}
  .hoff .grp:last-child{margin-bottom:0}
  .hoff .gh{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px;display:flex;gap:7px;align-items:center}
  .hoff .kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:2px 14px;font-size:13px}
  .hoff .kv dt{color:var(--ink-3)}
  .hoff .kv dd{margin:0;font-weight:600;color:var(--ink)}
  .hoff .kv dd.mono{font-family:var(--mono);font-size:12.5px}
  .hoff .none{font-size:13px;color:var(--ink-3);font-style:italic}

  /* ---------- ใบขออนุมัติทำจ่าย ---------- */
  .apv{border-radius:var(--r-md);background:var(--paper);margin-bottom:18px;overflow:hidden;box-shadow:var(--sh-2)}
  .apv>.ah{background:var(--gold-100);padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .apv>.ah .rno{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--gold-800)}
  .apv>.ah .sp2{flex:1}
  .apv .ab{padding:16px 18px 18px}
  .apv .amt{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
  .apv .amt small{display:block;font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink-3);
    letter-spacing:0;margin-top:3px}
  .apv .who{font-size:13px;color:var(--ink-2);margin-bottom:14px}
  .apv .who b{color:var(--ink)}
  .apv .sec{font-size:11px;font-family:var(--mono);letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-3);margin:16px 0 7px}
  .apv .stamp{border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:11px 15px;font-size:13px;
    line-height:1.7;white-space:pre-wrap;background:var(--surface);color:var(--ink)}
  .apv .dl{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
  .apv .dl:last-child{border-bottom:0}
  .apv .dl .fn{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-align:right}
  .apv .ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:3px 0}
  .apv .ck .m{font-weight:600;width:14px;flex:none}
  .apv .ck.ok .m{color:var(--go)} .apv .ck.no .m{color:var(--stop)} .apv .ck.wn .m{color:var(--warn)}
  .apv .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}
  .apv .seg{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  .jsonbox{font-family:var(--mono);font-size:11.5px;line-height:1.75;background:var(--shade);
    color:#D8CFBE;border-radius:var(--r-md);padding:15px 17px;overflow-x:auto;margin:0 0 12px;
    white-space:pre;-webkit-overflow-scrolling:touch}
  .miss1{background:var(--stop-bg);border-left:3px solid var(--stop);border-radius:var(--r-md);
    padding:11px 16px;margin-bottom:16px;font-size:13px;color:var(--stop);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .miss1 .sp2{flex:1;min-width:180px}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--shade);
    color:#F2EDE3;padding:11px 20px;font-size:13.5px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:60;max-width:92vw;text-align:center;box-shadow:var(--sh-3)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){#toast{transition:none}}

  /* ---------- จอแคบ ---------- */
  @media (max-width:900px){
    .topnav{padding:10px 14px;gap:12px}
    .subbar{padding:8px 14px;top:55px}
    main{padding:16px 14px 40px}
    .brand .tx{display:none}
  }
  /* จอมือถือ: เมนูลงมาอยู่แถวของตัวเองแล้วเลื่อนแนวนอน
     ชื่อผู้ใช้ยาวไม่เท่ากันในแต่ละแผนก ("คุณประเสริฐ" ยาวสุด) ถ้าดันอยู่แถวเดียวกับเมนู
     หน้าจะล้นออกไปทางขวาเป็นสิบพิกเซล เหลือไว้แค่วงกลมย่อชื่อซึ่งบอกแผนกด้วยสีอยู่แล้ว */
  @media (max-width:760px){
    .topnav{flex-wrap:wrap;row-gap:9px;padding-bottom:9px}
    nav.mainnav{order:3;flex:1 0 100%;margin:0 -14px;padding:0 14px}
    .user>span:not(.av){display:none}
    .subbar{top:auto;position:static}
  }
  @media (max-width:820px){
    .phases{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:640px){
    .apv .seg{grid-template-columns:1fr}
    .hoff .kv{grid-template-columns:1fr;gap:0}
    .hoff .kv dt{margin-top:5px;font-size:12px}
    .bars{grid-template-columns:1fr}
    .ph h1{font-size:22px}
  }

<script>
(function () {
  "use strict";

  /* ================= ข้อมูลตัวอย่าง ================= */

  /* โครงสร้างองค์กร: ทุกแผนกมี "พนักงาน" กับ "ผู้จัดการ"
     lvl = staff | mgr   ·   mgr = ผู้จัดการของบทบาทนี้ (ใช้เป็นสายอนุมัติ)
     กติกาที่ทีมยืนยัน: งานที่ต้องอนุมัติ ต้องผ่านผู้จัดการ "ทุกยอด" ไม่มีเกณฑ์วงเงินยกเว้น */
  const ROLES = {
    SR:{name:"จัดซื้อ", en:"Sourcing",   person:"คุณสมชาย",   init:"สช", money:true,  v:"--sr",
        lvl:"staff", mgr:"GM"},
    QC:{name:"QC",      en:"Quality",    person:"คุณสมหญิง",  init:"สญ", money:false, v:"--qc",
        lvl:"staff", mgr:"GM"},
    LS:{name:"โลจิสติกส์",en:"Logistics", person:"คุณอนุชา",   init:"อช", money:false, v:"--ls",
        lvl:"staff", mgr:"GM"},
    WH:{name:"คลังสินค้า",en:"Warehouse", person:"คุณประเสริฐ",init:"ปส", money:false, v:"--wh",
        lvl:"staff", mgr:"GM"},
    AC:{name:"บัญชี",   en:"Accounting", person:"คุณวิภา",    init:"วภ", money:true,  v:"--ac",
        lvl:"staff", mgr:"ACH"},
    // หัวหน้าบัญชี = ผู้จัดการฝ่ายบัญชี · คนละคนกับผู้บันทึกจ่าย · อนุมัติอย่างเดียว ไม่ถือขั้นตอนไหน
    ACH:{name:"หัวหน้าบัญชี", en:"AC Head", person:"คุณอารีย์", init:"อร", money:true, v:"--ach",
        lvl:"mgr"},
    GM:{name:"ผู้บริหาร",en:"GM",        person:"คุณผู้จัดการ",init:"GM", money:true,  v:"--gm",
        lvl:"mgr"}
  };
  // ผู้จัดการที่อนุมัติเรื่องเงินทั้งหมด — ทุกยอดผ่านคนนี้ ไม่มีเกณฑ์วงเงิน
  const PAY_APPROVER = "ACH";

  // 4 เฟส ครอบ 17 ขั้น — ผู้ใช้เห็นเฟสก่อน ค่อยเจาะดูขั้นย่อย
  const PHASES = [
    { code:"BUY",  name:"จัดซื้อ",   from:0,  to:8  },
    { code:"RECV", name:"รับของ",    from:9,  to:11 },
    { code:"AP",   name:"ตั้งหนี้",  from:12, to:13 },
    { code:"PAY",  name:"จ่าย / ปิด", from:14, to:16 }
  ];

  const STAGES = [
    {c:"PRICE_REQUEST",    n:"เช็คราคา",           o:"SR", sla:24},
    {c:"SAMPLE_CHECK",     n:"ตรวจตัวอย่าง",       o:"QC", sla:48},
    {c:"GM_DECISION",      n:"ผู้บริหารตัดสินใจ",  o:"GM", sla:24},
    {c:"ORDER_CONFIRM",    n:"คอนเฟิร์มออเดอร์",   o:"SR", sla:24},
    {c:"PI_RECEIVED",      n:"รับ PI จากผู้ขาย",   o:"SR", sla:48},
    {c:"ITEM_CODE",        n:"เปิดรหัสสินค้า",     o:"LS", sla:24},
    {c:"PO_CREATED",       n:"ผูกกับ PO ใน B1",     o:"SR", sla:24},
    {c:"INTERNAL_APPROVAL",n:"อนุมัติภายใน",       o:"GM", sla:24},
    {c:"SUPPLIER_SIGN",    n:"ผู้ขายเซ็น PO กลับ", o:"SR", sla:72},
    {c:"DELIVERY_BOOKING", n:"จองรถรับของ",        o:"LS", sla:24},
    {c:"QC_INCOMING",      n:"QC ตรวจรับ",         o:"QC", sla:24},
    {c:"GR",               n:"รับเข้าคลัง + GR",   o:"WH", sla:24},
    {c:"INVOICE_RECEIVED", n:"รับใบแจ้งหนี้",      o:"AC", sla:72},
    {c:"DOC_HANDOVER",     n:"ส่งมอบเอกสาร",       o:"SR", sla:24},
    {c:"PAYMENT",          n:"ทำจ่าย",             o:"AC", sla:48},
    {c:"RECEIPT_ORIGINAL", n:"ใบเสร็จตัวจริง",     o:"AC", sla:336},
    {c:"AC_CLOSE",         n:"ตรวจ 3 ทาง + ปิด",   o:"AC", sla:48}
  ];

  // เอกสาร (สลิปไม่อยู่ตรงนี้ เพราะผูกกับ "งวดจ่าย" ไม่ใช่ผูกกับ PO)
  const DOCS = [
    {c:"PI",        n:"PI จากผู้ขาย",       o:"SR", at:4,  req:true},
    {c:"PO_SIGNED", n:"PO ที่เซ็นครบแล้ว",  o:"SR", at:8,  req:true},
    {c:"QC_RC",     n:"ผลตรวจรับ / RC",     o:"QC", at:10, req:true},
    {c:"GR",        n:"ใบรับสินค้า (GRPO)",         o:"WH", at:11, req:true},
    {c:"INVOICE",   n:"ใบแจ้งหนี้",         o:"AC", at:12, req:true},
    {c:"RECEIPT",   n:"ใบเสร็จตัวจริง",     o:"AC", at:15, req:true}
  ];

  /* สายสินค้า — ใบตรวจรับของ QC คนละแบบกันจริง ๆ (ดูใบตรวจตัวอย่างใน docs/16)
     Food  : Temp. / Weight / Label / Physical / Quantity + Goods-Lot + Data Logger
     Mech  : Con. Condition / Packing / Physical / Quantity  (ไม่มีล็อต ไม่มีวันหมดอายุ)
     เพิ่มสายใหม่ = เพิ่มแถวที่นี่ + แถวใน HAND[..].byMod ไม่ต้องแก้หน้าจอ */
  const MODULES = {
    FOOD:  {n:"อาหาร", pfx:"F", place:"ห้องเย็น / คลังผู้ให้บริการ"},
    MECH:  {n:"เครื่องจักร & โซลาร์", pfx:"M", place:"คลังบริษัท"},
    // เจอในรายงาน Costing จริง — ค่าเดินทาง ค่าบริการ ไม่ใช่ของซื้อเข้าคลัง
    // ไม่มีของให้ตรวจและไม่มีของให้รับเข้า จึงข้ามขั้น QC กับคลัง แต่ยังต้องแนบเอกสารและผ่านสายอนุมัติจ่ายเหมือนกัน
    OTHER: {n:"ค่าใช้จ่ายอื่น", pfx:"O", place:"— (ไม่มีของเข้าคลัง)", noGoods:true}
  };
  // เลข PO จาก SAP เชื่อถือได้กว่าค่าที่คนกรอก — ดูเลขก่อน แล้วค่อยดูค่าที่ตั้งไว้ในรายการ
  const PFX_MOD = {M:"MECH", F:"FOOD", O:"OTHER"};
  function modOf(p) {
    const m = String(p && p.no || "").toUpperCase().match(/^PO-([A-Z])/);
    if (m && PFX_MOD[m[1]]) return PFX_MOD[m[1]];
    return MODULES[p && p.mod] ? p.mod : "FOOD";
  }
  // ขั้นที่รายการค่าใช้จ่ายไม่ต้องเดินผ่าน — QC ตรวจรับ (10) และรับเข้าคลัง (11)
  const NOGOODS_SKIP = [10, 11];

  /* ============ สัญญาระหว่างขั้น (Stage Contract) ============
     ปัญหาที่แก้: แผนกถัดไปเปิดหน้าจอแล้วไม่รู้ว่าแผนกก่อนหน้าทำอะไรไว้ ต้องไปถามในไลน์
     วิธีแก้: แต่ละขั้น "ประกาศ" ว่าต้องส่งมอบข้อมูลอะไรบ้าง เก็บเป็นข้อมูลเหมือน Stage_Templates
       f     = ช่องที่ทุกสายสินค้าต้องกรอกก่อนส่งต่อ (ขึ้นในป๊อปอัปของขั้นนั้นเอง)
       byMod = ช่องเพิ่มเฉพาะสายสินค้านั้น — ใบตรวจ Food กับ Mech ไม่เหมือนกัน
       to    = ใครเอาไปใช้ต่อ — ใช้บอกผู้กรอกว่า "กรอกให้ใคร" ไม่ใช่กรอกให้ระบบ
     เพิ่มช่องใหม่ = เพิ่มบรรทัดในตารางนี้ ไม่ต้องแก้หน้าจอ */
  const HAND = {
    SUPPLIER_SIGN: {to:"โลจิสติกส์", f:[
      {k:"shipDate", lb:"ผู้ขายนัดส่งของวันที่", t:"date", req:true}]},
    DELIVERY_BOOKING: {to:"QC และคลังสินค้า", f:[
      {k:"eta",     lb:"ของถึงห้องเย็นวันที่", t:"date", req:true},
      {k:"etaTime", lb:"เวลาโดยประมาณ",       t:"time", req:true},
      {k:"truck",   lb:"ทะเบียนรถ / ผู้ขนส่ง", t:"text", req:false}]},
    /* QC ตรวจในแอป Incoming Inspection ที่มีอยู่แล้ว — ที่นี่ไม่มีฟอร์มตรวจซ้ำ
       ช่องด้านล่างคัดมาจากหัวใบตรวจจริงเฉพาะตัวที่คลัง/บัญชี/จัดซื้อ ต้องใช้ต่อ */
    QC_INCOMING: {to:"คลังสินค้า และบัญชี", app:"QCAPP", f:[
      {k:"qcRef",   lb:"เลขที่ใบตรวจ (Report No.)",       t:"text", req:true},
      {k:"qcPoRef", lb:"PO Ref No. ที่พิมพ์บนใบตรวจ",      t:"text", req:true},
      {k:"qcDate",  lb:"วันที่ตรวจจริง (Inspection Date)", t:"date", req:true},
      {k:"qcPlace", lb:"สถานที่ตรวจ / ของอยู่ที่ไหน",      t:"text", req:true},
      {k:"invQty",  lb:"จำนวนตามใบแจ้งหนี้ (INV QTY)",     t:"text", req:true},
      {k:"qtyOk",   lb:"จำนวนที่ตรวจนับได้จริง (Actual QTY)", t:"text", req:true},
      {k:"qcResult",lb:"ผลรวม (Result)", t:"sel", req:true, o:["ผ่าน (Pass)", "ไม่ผ่าน (Fail)"]},
      {k:"qtyBad",  lb:"จำนวนที่ตีกลับ (ถ้ามี)", t:"text", req:false}],
      byMod:{
        FOOD:[{k:"temp",    lb:"อุณหภูมิที่วัดได้ (°C)", t:"num",  req:true},
              {k:"lot",     lb:"เลขล็อต (Lot)",          t:"text", req:true},
              {k:"expDate", lb:"วันหมดอายุ (Expiration)", t:"text", req:true},
              {k:"grade",   lb:"เกรดที่ QC ให้ (QC Grade)", t:"sel", req:true, o:["A", "B", "C"]}],
        MECH:[{k:"conCond", lb:"สภาพตู้/หีบห่อ (Con. Condition)", t:"sel", req:true,
               o:["ผ่าน (Pass)", "ไม่ผ่าน (Fail)"]}]
      }},
    GR: {to:"บัญชี", f:[
      {k:"qtyIn", lb:"จำนวนที่รับเข้าคลังจริง", t:"text", req:true},
      {k:"grNo",  lb:"เลข GRPO ใน B1",          t:"text", req:true}]},
    INVOICE_RECEIVED: {to:"จัดซื้อ และบัญชี", f:[
      {k:"invNo",  lb:"เลขใบแจ้งหนี้ของผู้ขาย", t:"text", req:true},
      // money:true = บทบาทที่ไม่มีสิทธิ์เห็นเงินจะไม่เห็นช่องนี้เลย (ดู handoffCard)
      // ประกาศไว้ตรงนี้แทนการเดาจากชื่อฟิลด์ — ตั้งชื่อใหม่เมื่อไหร่ก็ยังไม่หลุด
      {k:"invAmt", lb:"ยอดในใบแจ้งหนี้ (บาท)",  t:"num",  req:true, money:true}]},
    RECEIPT_ORIGINAL: {to:"บัญชี", f:[
      {k:"rcvBy", lb:"ใครเป็นผู้รับเอกสารตัวจริง", t:"text", req:true}]}
  };

  // สัญญาของขั้นนี้สำหรับรายการนี้ — รวมช่องกลางกับช่องเฉพาะสายสินค้า
  function handOf(code, p) {
    const h = HAND[code];
    if (!h) return null;
    const ex = h.byMod ? (h.byMod[modOf(p)] || []) : [];
    return ex.length ? {to:h.to, app:h.app, f:h.f.concat(ex)} : h;
  }

  // ขั้นไหน "ต้องใช้" ข้อมูลที่ขั้นก่อนหน้าส่งมา — ถ้าไม่มี ระบบเตือนและให้ถามกลับได้ในคลิกเดียว
  const NEEDS = {
    DELIVERY_BOOKING: ["shipDate"],
    QC_INCOMING:      ["eta"],
    GR:               ["qtyOk", "qcResult", "qcPlace"],
    INVOICE_RECEIVED: ["qtyIn"],
    DOC_HANDOVER:     ["invNo", "invAmt"],
    PAYMENT:          ["invNo", "invAmt"],
    AC_CLOSE:         ["qcRef", "qtyOk", "qtyIn", "invAmt"]
  };
  // ข้อมูลที่ต้องใช้เพิ่มเฉพาะสายสินค้า — ของแช่แข็งไม่มีอุณหภูมิถือว่าใช้ไม่ได้ แต่อินเวอร์เตอร์ไม่ต้องมี
  const NEEDS_MOD = {FOOD:{GR:["temp"], AC_CLOSE:["lot"]}, MECH:{}};
  const needsOf = (code, p) =>
    (NEEDS[code] || []).concat(((NEEDS_MOD[modOf(p)] || {})[code]) || []);

  // ช่องไหนมาจากขั้นไหน (สร้างจาก HAND ไม่ต้องเขียนซ้ำ — รวมช่องเฉพาะสายสินค้าด้วย)
  const FIELD_AT = {};
  Object.keys(HAND).forEach(sc => {
    const h = HAND[sc];
    const all = h.f.concat.apply(h.f, Object.keys(h.byMod || {}).map(m => h.byMod[m]));
    all.forEach(f => { FIELD_AT[f.k] = {stage:sc, lb:f.lb}; });
  });

  // งวดจ่าย — PENDING → REQUESTED → APPROVED → PAID (ดู docs/08)
  const pay = (seq, type, pct, amt, due, st, paid, ext) => Object.assign({
    seq:seq, type:type, pct:pct, amount:amt, due:due, status:st,
    paidAt:paid || "", valueDate:paid || "", method:"", bank:"", ref:"",
    whtType:"GOODS", whtRate:0, wht:0, fee:0, feeBy:"OUR",
    paidAmt:st === "PAID" ? amt : 0, lateDays:0, note:"", slip:st === "PAID",
    paidBy:"", reqBy:"", apvBy:""
  }, ext || {});
  const BANKS = ["KBANK 123-4-56789-0 (บัญชีจ่าย)", "SCB 987-6-54321-0", "BBL 111-2-33333-4"];
  const WHT = {GOODS:{t:"ซื้อสินค้า", r:0}, FREIGHT:{t:"ค่าขนส่ง", r:1},
    SERVICE:{t:"ค่าบริการ / รับจ้างทำของ", r:3}, RENT:{t:"ค่าเช่า", r:5}, ADS:{t:"ค่าโฆษณา", r:2}};
  const PAY_ST = {
    PENDING:{t:"รอตั้งเรื่อง", cls:"wait"}, BLOCKED:{t:"ล็อก (เคลม)", cls:"late"},
    REQUESTED:{t:"รออนุมัติจ่าย", cls:"due"}, APPROVED:{t:"อนุมัติแล้ว รอทำจ่าย", cls:"info"},
    PAID:{t:"จ่ายแล้ว", cls:"ok"}, FAILED:{t:"ธนาคารตีกลับ", cls:"late"},
    VOID:{t:"กลับรายการ", cls:"wait"}, CANCELLED:{t:"ยกเลิก", cls:"wait"},
    // งวดที่ชำระผ่านเลตเตอร์ออฟเครดิต — ธนาคารจ่ายตามเอกสาร ไม่ต้องตั้งเบิกในระบบนี้
    // แต่ยังอยู่ในรายการเพื่อให้ยอดรวมงวดเท่ามูลค่า PO และตามเอกสารได้
    LC:{t:"จ่ายผ่าน LC (ธนาคาร)", cls:"info"}
  };

  /* ============ เงื่อนไขจ่ายจาก SAP → งวดจ่าย ============
     รายงาน Costing ที่ออกจาก SAP ส่ง PO Payment Term มาเป็นข้อความ 13 แบบ
     ของเดิมต้นแบบตั้งเป็น "เครดิต 30 วัน" 1 งวดเสมอ ซึ่งไม่ตรงกับของจริงเลย
     ตารางนี้แปลงข้อความเป็นงวดจ่ายจริง — เจอเงื่อนไขใหม่ = เพิ่มแถว ไม่ต้องแก้ฟังก์ชัน
       lc:true  = งวดนี้ธนาคารจ่ายตาม LC ไม่ต้องตั้งเบิก
       due      = ฐานวันครบกำหนด · SAP ส่ง Due Date มาให้อยู่แล้วจึงใช้เป็นหลัก */
  /* ลำดับสำคัญ — เงื่อนไขที่ "แบ่งงวด" ต้องอยู่ก่อนเงื่อนไขงวดเดียวที่กว้างกว่า
     ไม่งั้น "90% after delivery at site and 10% after commissioning" จะไปเข้าแถวเครดิตหลังรับของ

  const PAY_TERMS = [

  function qcAppUrl(p) {
    const m = modOf(p);
    const base = QCAPP.url[m];
    if (!base) return "";
    const q = "po=" + encodeURIComponent(p.sap || p.no) +
      "&ref=" + encodeURIComponent(p.no) +
      "&supplier=" + encodeURIComponent(p.sup || "") +
      "&item=" + encodeURIComponent(p.item || "") +
      "&qty=" + encodeURIComponent(p.qty || "") +
      "&module=" + m;
    return base + (base.indexOf("?") >= 0 ? "&" : "?") + q;
  }
  function qcAppBtn(p, label) {
    const u = qcAppUrl(p);
    if (!u) return "";
    return '<a class="btn qcapp" href="' + esc(u) + '" target="_blank" rel="noopener">' +
