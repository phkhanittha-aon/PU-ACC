      '<button class="btn bad" data-cf="yes">' + esc(c.ok) + "</button></div></div></div>";
  }

  /* ================= การกระทำ ================= */
  function advance(p, note) {
    p.tl.push(["วันนี้", ROLES[role].person, note]);
    let n = p.stage + 1;
    while (n < STAGES.length && p.skip.indexOf(n) >= 0) n++;
    p.stage = n; p.age = 0;
    if (p.stage >= STAGES.length) {
      p.stage = STAGES.length; p.status = "COMPLETED";
      p.bundle = mergeDocs(p);   // รวมเอกสารทั้งชุดเป็นไฟล์เดียวอัตโนมัติ
      p.tl.push(["วันนี้","ระบบ","ปิดรายการ — ย้ายไปแท็บเสร็จสิ้น"]);
      p.tl.push(["วันนี้","ระบบ","รวมเอกสาร " + p.bundle.parts.length + " ใบเป็นไฟล์เดียว " +
        p.bundle.name + " (" + p.bundle.pages + " หน้า) เก็บที่ " + DRIVE.folderOf(p)]);
      toast(p.no + " ปิดรายการแล้ว — รวมเอกสาร " + p.bundle.parts.length + " ใบเป็นไฟล์เดียวให้แล้ว");
    } else {
      toast("ส่งต่อให้ " + ROLES[STAGES[p.stage].o].name + " แล้ว — ระบบแจ้งเตือนให้เอง");
    }
  }

  let confirmedOnce = null;
  function runAct(act, seq) {
    confirmedOnce = act;
    onClick({ target: { closest(sel) {
      if (sel === "[data-payact]" && act === "void") return {dataset:{payact:"void", seq:seq}};
      if (sel === "[data-act]" && act !== "void") return {dataset:{act:act}};
      return null;
    } } });
    confirmedOnce = null;
  }

  document.addEventListener("click", onClick);
  function onClick(ev) {
    const rb = ev.target.closest("[data-role]");
    if (rb) { role = rb.dataset.role; render(); return; }
    const nb = ev.target.closest("[data-page]");
    if (nb) { page = nb.dataset.page; openPo = null; openClaim = null; openIC = null; openPR = null;
      upOpen = null; payReqOpen = null; payOpen = null;
      subtab = SUB0[page] || "ACTIVE"; render(); return; }

    const bg = ev.target.closest("[data-bug]");
    if (bg) {
      const a = bg.dataset.bug;
      if (a === "open")  { bugOpen = true;  bugPanel(); return; }
      if (a === "close") { bugOpen = false; bugPanel(); return; }
      if (a === "send") {
        const ta = document.getElementById("bugtext");
        const txt = ta ? ta.value.trim() : "";
        if (!txt) { toast("กรุณาเล่าสั้น ๆ ว่าเกิดอะไรขึ้น"); if (ta) ta.focus(); return; }
        const sv = document.querySelector('input[name="bugsev"]:checked');
        bugSev = sv ? sv.value : "WRONG";
        const id = "BUG-26-00" + (32 + ISSUES.length - 3);
        ISSUES.unshift({id:id, sev:bugSev, t:txt.slice(0, 70),
          page:PAGENAME[page] || page, ref:(page === "detail" ? openPo : openClaim) || "—",
          by:ROLES[role].person, role:role, tm:"เมื่อสักครู่", status:"NEW", n:1, note:""});
        bugOpen = false;
        toast(bugSev === "BLOCKER" ? id + " ส่งแล้ว — แจ้งกลุ่ม Lark ของ IT ทันที"
                                   : id + " ส่งแล้ว — ติดตามสถานะได้ที่ ตั้งค่าระบบ");
        bugPanel(); render(); return;
      }
      return;
    }

    const cf = ev.target.closest("[data-cf]");
    if (cf) {
      if (cf.dataset.cf === "no") { pendingAct = null; confirmPanel(); return; }
      const a = pendingAct; pendingAct = null; confirmPanel();
      if (a) runAct(a.act, a.seq, true);
      return;
    }

    const sn = ev.target.closest("[data-act]");
    if (sn && sn.dataset.act === "sapnow") {
      SAP.at = "เมื่อสักครู่"; SAP.ok = true;
      SAP.objs.forEach(o => { o.st = "OK"; o.last = "เมื่อสักครู่"; });
      toast("ดึงข้อมูลจาก B1 ใหม่แล้ว — ปกติทำอัตโนมัติทุก 30 นาที ไม่ต้องกดเอง");
      render(); return;
    }

    const nt = ev.target.closest("[data-notif]");
    if (nt) {
      const n = NOTIFS.filter(x => String(x.id) === nt.dataset.notif)[0];
      if (n) {
        n.read = true;
        if (n.ref && POS.some(p => p.no === n.ref)) { openPo = n.ref; page = "detail"; }
        else if (n.ref) { page = "req"; subtab = "CLAIM"; openClaim = n.ref; }
      }
      render(); return;
    }
    /* ผูกใบตรวจที่แอป QC ส่งมากับรายการ — จุดที่การเชื่อมสองระบบให้ผลจริง
       ผูกแล้วช่องทั้งหมดลงให้เอง QC ไม่ต้องพิมพ์ซ้ำ และข้อค้างท้ายใบกลายเป็นข้อค้างในระบบทันที */
    const qm = ev.target.closest("[data-qcmatch]");
    if (qm) {
      const i = parseInt(qm.dataset.qcmatch, 10);
      const wait = QCIN.filter(x => !x.match), r = wait[i];
      if (!r) return;
      const no = valOf("qm_" + i);
      if (!no) { toast("เลือกรายการที่จะผูกก่อน — ระบบไม่เดาให้"); return; }
      const tp = POS.filter(x => x.no === no)[0];
      if (!tp) return;
      r.match = no;
      Object.assign(tp.hand, {
        qcRef:r.ref, qcPoRef:r.poRef, qcDate:r.date, qcPlace:r.place,
        invQty:r.invQty, qtyOk:r.qtyOk, qcResult:r.result
      });
      if (r.mod === "FOOD")
        Object.assign(tp.hand, {temp:r.temp, lot:r.lot, expDate:r.expDate, grade:r.grade});
      else if (r.conCond) tp.hand.conCond = r.conCond;
      // ข้อค้างท้ายใบตรวจตามมาด้วย — ของที่ล็อกเงินก็ล็อกให้เลย
      (r.defects || []).forEach(dfx => {
        if ((tp.qcOpen || []).some(y => y.t === dfx.t)) return;
        tp.qcOpen.push({t:dfx.t, blocks:!!dfx.blocks, st:"OPEN",
          by:"แอปตรวจรับ " + r.ref, at:"วันนี้", closeBy:"", closeWhy:""});
      });
      const hold = qcPayHold(tp);
      if (hold.length) tp.payments.forEach(x => { if (x.status === "PENDING") x.status = "BLOCKED"; });
      tp.tl.push(["วันนี้", ROLES[role].person,
        "ผูกใบตรวจ " + r.ref + " จากแอปตรวจรับเข้ากับรายการนี้ — ข้อมูลลงให้อัตโนมัติ ไม่ได้พิมพ์ซ้ำ"]);
      // จำการจับคู่ไว้ ครั้งหน้าเลขชุดเดียวกันจับได้เอง
      tp.qcPoMap = r.poRef;
      notify("WH", "info", tp.no, "ผลตรวจเข้าระบบแล้ว " + r.ref,
        tp.no + " " + tp.sup + " — " + r.result + " · " + r.qtyOk + " · ตรวจที่ " + r.place);
      toast("ผูกใบ " + r.ref + " แล้ว — ช่องทั้งหมดลงให้เอง" +
        (hold.length ? " และล็อกการจ่ายเพราะมีข้อค้าง " + hold.length + " ข้อ" : ""));
      render(); return;
    }

    // ชิปกรองสายสินค้าในคิวตั้งเบิกทำจ่าย
    const pq2 = ev.target.closest("[data-payq]");
    if (pq2) { payQ = pq2.dataset.payq; renderMain(); return; }

    const sb = ev.target.closest("[data-sub]");
    if (sb) { subtab = sb.dataset.sub; openClaim = null; openIC = null; openPR = null; render(); return; }
    const bk = ev.target.closest("[data-back]");
    if (bk) {
      if (bk.dataset.back === "req") { openClaim = null; openIC = null; openPR = null; page = "req"; }
      else { openPo = null; page = "po"; subtab = "ACTIVE"; }
      render(); return;
    }
    if (ev.target.closest("[data-clear]")) { q = ""; fDept = ""; render(); return; }

    // รายการซื้อเงินสด — ไม่ผูกกับ PO ที่เปิดอยู่ จึงต้องอยู่ก่อนด่านตรวจ openPo
    const cs = ev.target.closest("[data-cash]");
    if (cs) {
      const act = cs.dataset.cash;
      if (act === "open") { cashOpen = true; modals(); return; }
      if (act === "close") { cashOpen = false; modals(); return; }
      if (act === "save") {
        if (cashCalc().length) { toast("บันทึกไม่ได้ — แก้ข้อที่ติดก่อน"); return; }
        const by = !!(document.getElementById("cs_bypass") || {}).checked;
        const nums = POS.map(x => parseInt(String(x.no).split("-")[2], 10)).filter(v => !isNaN(v));
        const no = "CS-26-" + String((nums.length ? Math.max.apply(null, nums) : 0) + 1).padStart(4, "0");
        const amt = numOf("cs_amt"), d = valOf("cs_date");
        const FROM = {PETTY:"เงินสดย่อย (petty cash)", OWN:"ผู้ซื้อสำรองจ่าย — ขอเบิกคืน",
                      TRANSFER:"โอนจากบัญชีบริษัท"};
        const p2 = {
          no:no, sap:"", entry:"CASH", sup:valOf("cs_sup").trim(), item:valOf("cs_item").trim(),
          qty:valOf("cs_qty").trim(), amt:amt, cur:"THB", term:"เงินสด — จ่ายหน้างาน",
          stage:by ? 11 : 10, age:0, owner:ROLES[role].person, status:"ACTIVE", claim:false,
          skip:cashSkip(by), date:isoToTH(d), files:{}, bundle:null, hand:{},
          spec:"ซื้อหน้างาน — ตรวจด้วยสายตาตอนรับของ",
          cashWhy:valOf("cs_why").trim(),
          qcBypass:by, qcBypassBy:by ? ROLES[role].person : "", qcBypassWhy:by ? valOf("cs_bywhy").trim() : "",
          payments:[pay(1, "จ่ายสดหน้างาน", 100, amt, isoToTH(d), "PAID", isoToTH(d),
            {method:"CASH", bank:FROM[valOf("cs_from")] || FROM.PETTY,
             ref:"CS" + String(d).replace(/-/g, "").slice(2) + String(nums.length + 1).padStart(3, "0"),
             fee:0, paidAmt:amt, paidBy:ROLES[role].person, reqBy:ROLES[role].person, apvBy:"—"})],
          tl:[["วันนี้", ROLES[role].person, "เพิ่มรายการซื้อเงินสด " + bahtIn(amt) +
                " — ไม่ได้เปิด PO (" + valOf("cs_why").trim() + ")"]]
        };
        if (by) p2.tl.push(["วันนี้", "ระบบ",
          "ข้าม QC ตามที่ระบุ: " + valOf("cs_bywhy").trim() + " — บันทึกถาวรและขึ้นในรายงานหัวหน้า QC"]);
        POS.unshift(p2);
        cashOpen = false; openPo = no; page = "detail";
        toast(no + " บันทึกแล้ว" + (by ? " · ข้าม QC — แจ้งหัวหน้า QC ให้รับทราบแล้ว" : " · เข้าคิว QC ตรวจรับ"));
        render(); return;
      }
      return;
    }

    const pr = ev.target.closest("[data-po]");
    if (pr) {
      if (upOpen && upOpen.po !== pr.dataset.po) upOpen = null;          // ป๊อปอัปของรายการเก่า
      if (payReqOpen && payReqOpen.po !== pr.dataset.po) payReqOpen = null;
      if (payOpen && payOpen.po !== pr.dataset.po) payOpen = null;
      openPo = pr.dataset.po; page = "detail"; render(); return;
    }
    const cr = ev.target.closest("[data-claim]");
    if (cr) { openClaim = cr.dataset.claim; page = "req"; subtab = "CLAIM"; render(); return; }

    const ic = ev.target.closest("[data-ic]");
    if (ic) {
      const r = ITEMREQS.filter(x => x.id === ic.dataset.id)[0]; if (!r) return;
      if (ic.dataset.ic === "approve") { r.status = "WAIT_LS"; toast("อนุมัติแล้ว — เข้าคิว LS อัตโนมัติ ไม่ต้องเดินเอกสาร"); }
      if (ic.dataset.ic === "sap") {
        r.status = "DONE"; r.sap = "FG-" + Math.floor(1000 + Math.random()*8999);
        const p = POS.filter(x => x.no === r.po)[0];
        if (p && p.stage === 5) { p.stage = 6; p.tl.push(["วันนี้","ระบบ","ได้รหัส " + r.sap + " — PO เดินต่อได้"]); }
        toast("บันทึกรหัส " + r.sap + " แล้ว — " + (r.po || "") + " เดินต่อได้");
      }
      render(); return;
    }

    // ต้องอยู่หลัง [data-ic] เพราะปุ่มอนุมัติอยู่ในแถวที่กดเปิดได้
    const io = ev.target.closest("[data-icopen]");
    if (io) { openIC = io.dataset.icopen; page = "req"; subtab = "ITEM"; render(); return; }

    const po2 = ev.target.closest("[data-propen]");
    if (po2) { openPR = po2.dataset.propen; page = "req"; subtab = "PRICE"; render(); return; }

    const qa = ev.target.closest("[data-qact]");
    if (qa) {
      const act = qa.dataset.qact;
      if (act === "cancel") { quoteOpen = null; modals(); return; }
      if (act === "save") {
        if (!quoteOpen) return;
        if (quoteCalc().length) { toast("บันทึกไม่ได้ — แก้ข้อที่ติดก่อน"); return; }
        const r = PRICEREQS.filter(x => x.id === quoteOpen.reqId)[0]; if (!r) return;
        const nums = QUOTES.map(x => parseInt(x.id.split("-")[2], 10)).filter(n => !isNaN(n));
        const newId = "QT-26-" + String((nums.length ? Math.max.apply(null, nums) : 0) + 1).padStart(4, "0");
        QUOTES.push({
          id:newId, reqId:r.id, supplier:valOf("q_supplier").trim(), unitPrice:numOf("q_price"),
          qty:parseFloat(r.qty) || 0, cur:"THB", leadTime:valOf("q_lead") || "—",
          validUntil:isoToTH(valOf("q_valid") || todayISO()), by:person(role) || "-", date:"วันนี้", selected:false
        });
        if (r.status === "NEW") r.status = "QUOTING";
        quoteOpen = null; modals();
        toast(newId + " บันทึกแล้ว — เทียบกับใบอื่นได้ทันที");
        render(); return;
      }
      const r = PRICEREQS.filter(x => x.id === openPR)[0]; if (!r) return;
      if (act === "add") { quoteOpen = {reqId: r.id}; modals(); return; }
      if (act === "pick") {
        quotesOf(r.id).forEach(q => { q.selected = (q.id === qa.dataset.id); });
        if (r.status === "NEW") r.status = "QUOTING";
        toast("เลือกใบเสนอราคานี้แล้ว — เปิด PO ต่อได้เมื่อพร้อม");
        render(); return;
      }
      if (act === "topo") {
        const sel = quotesOf(r.id).filter(x => x.selected)[0]; if (!sel) return;
        const nums = POS.map(p => parseInt(p.no.split("-")[2], 10)).filter(n => !isNaN(n));
        const newNo = "PO-26-" + String((nums.length ? Math.max.apply(null, nums) : 0) + 1).padStart(4, "0");
        const total = sel.unitPrice * sel.qty;
        POS.unshift({
          no:newNo, sap:"", sup:sel.supplier, item:r.item, qty:r.qty,
          amt:total, cur:sel.cur, term:"รอกำหนดตอนผูกกับ B1", stage:3, age:0, owner:person(role) || "คุณสมชาย",
          status:"ACTIVE", claim:false, skip:[1,2,5], date:"05/08/2026",
          entry:"PO", files:{}, bundle:null, hand:{}, spec:r.spec, needBy:r.needBy,
          fromQuote:sel.id, fromReq:r.id,
          payments:[pay(1, "ชำระเต็ม", 100, total, "—", "PENDING")],
          tl:[["วันนี้", "ระบบ", "เปิด PO จากใบเสนอราคา " + sel.id + " (" + sel.supplier + ") — " +
            "ดึงสินค้า จำนวน และราคามาให้ ไม่ต้องพิมพ์ซ้ำ"]]
        });
        sel.po = newNo;
        r.status = "CONVERTED";
        openPR = null; page = "detail"; openPo = newNo;
        toast(newNo + " เปิดแล้วจากใบเสนอราคา " + sel.id);
        render(); return;
      }
      return;
    }

    const cl = ev.target.closest("[data-cl]");
    if (cl) {
      const c = CLAIMS.filter(x => x.id === openClaim)[0]; if (!c) return;
      if (cl.dataset.cl === "report") toast("สร้าง Inspection Report จากข้อมูลในระบบแล้ว — ไม่ต้องพิมพ์ซ้ำ");
      if (cl.dataset.cl === "send") toast("ส่งใบเคลมพร้อมรูปหลักฐานให้ผู้ขายแล้ว");
      if (cl.dataset.cl === "cn") {
        c.cn = "CN-26-00" + (CLAIMS.indexOf(c) + 1);
        const p = POS.filter(x => x.no === c.po)[0];
        if (p) {
          p.claim = false;
          // ปลดล็อกได้ต่อเมื่อไม่มีข้อค้างจากใบตรวจที่ล็อกไว้ด้วย — ไม่งั้นปลดข้างเดียวแล้วหลุด
          const hold = qcPayHold(p);
          if (!hold.length) {
            p.payments.forEach(x => { if (x.status === "BLOCKED") x.status = "PENDING"; });
            p.tl.push(["วันนี้","ระบบ","ได้รับใบลดหนี้ " + c.cn + " — ปลดล็อกงวดจ่าย"]);
          } else
            p.tl.push(["วันนี้","ระบบ","ได้รับใบลดหนี้ " + c.cn + " แต่ยังล็อกจ่ายอยู่ — " +
              "ข้อค้างจากใบตรวจยังไม่สรุป " + hold.length + " ข้อ"]);
        }
        toast(p && qcPayHold(p).length
          ? "บันทึกใบลดหนี้ " + c.cn + " แล้ว — แต่ยังล็อกจ่ายอยู่เพราะข้อค้างจากใบตรวจยังไม่สรุป"
          : "บันทึกใบลดหนี้ " + c.cn + " — ปลดล็อกการจ่ายเงินอัตโนมัติ");
      }
      render(); return;
    }

    const p = POS.filter(x => x.no === openPo)[0];
    if (!p) return;
    const s = st(p) || {c:"", n:"", o:"", sla:0};

    const rj = ev.target.closest("[data-rej]");
    if (rj) {
      const act = rj.dataset.rej;
      if (act === "close") { rejOpen = null; modals(); return; }
      if (act === "send") {
        const why = valOf("rj_why"), note = valOf("rj_note").trim();
        if (!why) {
          const eb = document.getElementById("rj_err");
          if (eb) eb.innerHTML = '<div class="e1">ต้องเลือกเหตุผล — ผู้ขอต้องรู้ว่าต้องแก้อะไร</div>';
          toast("ตีกลับไม่ได้ — ต้องระบุเหตุผล"); return;
        }
        const y = p.payments.filter(z => z.seq === rejOpen.seq)[0];
        if (!y) { rejOpen = null; modals(); return; }
        y.status = "PENDING"; y.reqSt = "REJECTED";
        y.rejBy = ROLES[role].person; y.rejAt = "วันนี้";
        y.rejWhy = why + (note ? " — " + note : "");
        p.tl.push(["วันนี้", ROLES[role].person,
          "ตีกลับ " + (y.reqNo || "คำขอจ่าย") + " งวดที่ " + y.seq + " · เหตุผล: " + y.rejWhy]);
        p.tl.push(["วันนี้", "ระบบ", "แจ้ง " + esc(y.reqBy || "ผู้ขอ") + " ทาง Lark พร้อมเหตุผลที่ตีกลับ"]);
        notify(y.reqRole || "SR", "warn", p.no, "คำขอจ่ายถูกตีกลับ",
          (y.reqNo || "คำขอจ่าย") + " " + p.no + " — " + y.rejWhy +
          " · ตีกลับโดย " + ROLES[role].person);
        rejOpen = null; modals();
        toast("ตีกลับให้ " + (y.reqBy || "ผู้ขอ") + " แล้ว พร้อมเหตุผล");
        render(); return;
      }
      return;
    }

    const pa = ev.target.closest("[data-payact]");
    if (pa) {
      const act = pa.dataset.payact;
      if (act === "close") { payOpen = null; modals(); return; }

      if (act === "save") {
        const t = payTarget(); if (!t) return;
        if (payCalc().length) { toast("บันทึกไม่ได้ — แก้ข้อที่ติดก่อน"); return; }
        const x = t.x, d = valOf("py_date");
        x.status = "PAID";
        x.paidAt = isoToTH(d);
        x.valueDate = isoToTH(valOf("py_value") || d);
        x.method = valOf("py_method");
        x.bank = valOf("py_bank");
        x.ref = valOf("py_ref").trim();
        x.whtType = valOf("py_whttype");
        x.whtRate = (WHT[x.whtType] || WHT.GOODS).r;
        x.wht = numOf("py_wht");
        x.fee = numOf("py_fee");
        x.feeBy = valOf("py_feeby");
        x.paidAmt = numOf("py_amt");
        x.note = valOf("py_note");
        x.slip = true;
        x.paidBy = ROLES[role].person;
        x.lateDays = x.due ? dayDiff(d, thToISO(x.due)) : 0;
        t.p.tl.push(["วันนี้", ROLES[role].person,
          "บันทึกจ่ายงวดที่ " + x.seq + " " + bahtIn(x.paidAmt) + " · อ้างอิง " + x.ref]);
        t.p.tl.push(["วันนี้", "ระบบ", "แจ้งผู้ขายพร้อมสลิปทางอีเมล และแจ้งจัดซื้อใน Lark"]);
        payOpen = null; modals();
        toast(unpaid(t.p).length
          ? "บันทึกแล้ว — เหลืออีก " + unpaid(t.p).length + " งวด · ส่งสลิปให้ผู้ขายอัตโนมัติ"
          : "จ่ายครบทุกงวดแล้ว · ส่งสลิปให้ผู้ขายอัตโนมัติ");
        render(); return;
      }

      if (act === "void" && confirmedOnce !== "void") {
        pendingAct = {act:"void", seq:pa.dataset.seq}; confirmPanel(); return;
      }
      const x = p.payments.filter(y => String(y.seq) === pa.dataset.seq)[0];
      if (!x) return;
      if (act === "form") { payOpen = {po:p.no, seq:x.seq}; modals(); return; }
      if (act === "req") {
        // บัญชีตั้งเรื่องเองก็ต้องผ่านฟอร์มเดียวกัน — ทุกงวดต้องมีเอกสารเรียกเก็บผูกอยู่
        payReqOpen = {po:p.no, seq:x.seq}; modals(); return;
      }
      if (act === "apv") {
        // ผู้อนุมัติต้องไม่ใช่ผู้ขอ — กันเซ็นอนุมัติงานของตัวเอง
        if (x.reqBy && x.reqBy === ROLES[role].person) {
          toast("อนุมัติคำขอของตัวเองไม่ได้ — ต้องให้คนอื่นอนุมัติ"); render(); return;
        }
        x.status = "APPROVED"; x.apvBy = ROLES[role].person;
        x.reqSt = "APPROVED"; x.apvAt = "วันนี้";
        p.tl.push(["วันนี้", ROLES[role].person,
          "อนุมัติ " + (x.reqNo || "คำขอจ่าย") + " งวดที่ " + x.seq + " " + bahtIn(x.amount) +
          " · มีผล " + esc(x.due || "—")]);
        notify("AC", "act", p.no, "อนุมัติแล้ว — บันทึกการจ่ายได้",
          (x.reqNo || "คำขอจ่าย") + " " + p.no + " " + baht(x.amount) +
          " · อนุมัติโดย " + ROLES[role].person + " · ต้องจ่ายภายใน " + (x.due || "—"));
        toast("อนุมัติแล้ว — บัญชีบันทึกการจ่ายได้ (คนละคนกับผู้อนุมัติ)");
      }
      if (act === "rej") {
        // ตีกลับต้องมีเหตุผล ไม่งั้นผู้ขอไม่รู้ว่าต้องแก้อะไร
        rejOpen = {po:p.no, seq:x.seq}; modals(); return;
      }
      if (act === "void") {
        // ไม่ลบ — ปิดรายการเดิมเป็น VOID แล้วเปิดงวดใหม่ให้ตั้งเรื่องอีกครั้ง
        x.status = "VOID";
        const seq = Math.max.apply(null, p.payments.map(y => y.seq)) + 1;
        p.payments.push(pay(seq, x.type + " (ทำจ่ายใหม่)", x.pct, x.amount, x.due, "PENDING", "",
          {note:"แทนงวดที่ " + x.seq + " ที่กลับรายการ"}));
        p.tl.push(["วันนี้", ROLES[role].person,
          "กลับรายการจ่ายงวดที่ " + x.seq + " — เปิดงวดที่ " + seq + " แทน (ของเดิมไม่ถูกลบ)"]);
        toast("กลับรายการแล้ว — ของเดิมยังอยู่เป็นหลักฐาน และเปิดงวดใหม่ให้ตั้งเรื่องอีกครั้ง");
      }
      render(); return;
    }
    // ป๊อปอัปแนบเอกสารประจำขั้น
    const ua = ev.target.closest("[data-uact]");
    if (ua) {
      const act = ua.dataset.uact;
      if (act === "close") { upOpen = null; modals(); return; }
      if (act === "save") {
        const tp = upTarget(); if (!tp) return;
        if (upCalc().length) { toast("ส่งต่อไม่ได้ — แก้ข้อที่ติดก่อน"); return; }
        const d = upOpen.doc ? DOCS.filter(x => x.c === upOpen.doc)[0] : null;
        const code = d ? d.c : "STEP_" + upOpen.step;
        const file = valOf("up_file").trim(), note = valOf("up_note").trim();
        // เก็บข้อมูลตามสัญญาส่งมอบของขั้นนี้ — ไปโผล่บนใบส่งงานของแผนกถัดไป
        const hc2 = handOf(upOpen.step, tp);
        if (hc2) hc2.f.forEach(x => {
          const v = String(valOf("hf_" + x.k)).trim();
          if (v !== "") tp.hand[x.k] = x.t === "num" ? parseFloat(v) : v;
        });
        if (upOpen.step === "QC_INCOMING") {
          saveQcOpen(tp);
          const hold = qcPayHold(tp);
          if (hold.length) {
            tp.payments.forEach(x => { if (x.status === "PENDING") x.status = "BLOCKED"; });
            tp.tl.push(["วันนี้", ROLES[role].person,
              "บันทึกข้อค้างจากใบตรวจ " + hold.length + " ข้อ — ล็อกการจ่ายไว้จนกว่าจะสรุป"]);
            notify("SR", "act", tp.no, "ใบตรวจผ่านแต่มีข้อค้าง " + hold.length + " ข้อ",
              tp.no + " " + tp.sup + " — " + hold[0].t + " · ต้องสรุปกับผู้ขายก่อนจ่ายเงิน");
          }
        }
        if (file) tp.files[code] = {n:DRIVE.fileName(tp, code, file), orig:file, note:note,
          by:ROLES[role].person, at:"วันนี้", step:upOpen.step};
        const sg = STAGES.filter(x => x.c === upOpen.step)[0];
        if (file) tp.tl.push(["วันนี้", ROLES[role].person,
          "แนบ " + (d ? d.n : "เอกสารขั้น " + (sg ? sg.n : "")) + " → " + DRIVE.folderOf(tp) +
          "/" + DRIVE.fileName(tp, code, file)]);
        if (note) tp.tl.push(["วันนี้", ROLES[role].person, "หมายเหตุ: " + note]);
        const doneNote = upOpen.note || ("ทำ “" + (sg ? sg.n : "") + "” เสร็จ");
        const mode = upOpen.mode;
        upOpen = null; modals();

        if (mode === "qcfail") { openClaimFor(tp); render(); return; }
        advance(tp, doneNote);
        render(); return;
      }
      return;
    }

    // ขออนุมัติทำจ่าย (SR ขั้นส่งมอบเอกสาร)
    const pq = ev.target.closest("[data-pract]");
    if (pq) {
      const act = pq.dataset.pract;
      if (act === "close") { payReqOpen = null; prPos = null; prDrag = null; modals(); return; }
      // สลับงวด = เริ่มวางตำแหน่งใหม่ เพราะเอกสารคนละใบกัน
      if (act === "tab") { payReqOpen.seq = pq.dataset.prseq; prPos = null; prDrag = null;
        modals(); return; }
      if (act === "send") {
        const t = prTarget(); if (!t || !t.x) return;
        if (prCalc().length) { toast("ส่งไม่ได้ — แก้ข้อที่ติดก่อน"); return; }
        const amt = numOf("pr_amt"), eff = valOf("pr_eff");
        const stamp = !!(document.getElementById("pr_stamp") || {}).checked;
        const txt = valOf("pr_text").trim();
        const x = t.x;
        // เอกสารเรียกเก็บของงวดนี้ — เก็บเข้าไดรฟ์กลางเหมือนเอกสารขั้นอื่น แล้วผูกกับงวด
        const bkind = valOf("pr_bkind") || billKind(x);
        const bfile = valOf("pr_bfile").trim(), bcode = payDocCode(x);
        x.billKind = bkind; x.billNo = valOf("pr_bno").trim(); x.billAmt = numOf("pr_bamt");
        x.billFile = {n:DRIVE.fileName(t.p, bcode, bfile), orig:bfile,
          by:ROLES[role].person, at:"วันนี้"};
        t.p.files[bcode] = {n:x.billFile.n, orig:bfile, note:BILLDOC[bkind].n + " งวดที่ " + x.seq,
          by:ROLES[role].person, at:"วันนี้", step:"PAYMENT"};
        t.p.tl.push(["วันนี้", ROLES[role].person,
          "แนบ " + BILLDOC[bkind].n + " เลขที่ " + x.billNo + " สำหรับงวดที่ " + x.seq +
          " → " + DRIVE.folderOf(t.p) + "/" + x.billFile.n]);
        const dc = valOf("pr_doc") === bcode ? {n:BILLDOC[bkind].n + " (งวดที่ " + x.seq + ")"}
                                             : DOCS.filter(y => y.c === valOf("pr_doc"))[0];
        // บันทึกคำขอให้ครบ เพื่อให้ผู้อนุมัติมีอะไรอ้างอิงตอนกด ไม่ใช่กดลอย ๆ
        const rnums = POS.reduce((a, q) => a.concat(q.payments.map(y =>
          parseInt(String(y.reqNo || "").split("-")[2], 10)).filter(n => !isNaN(n))), []);
        x.reqNo = "PRQ-26-" + String((rnums.length ? Math.max.apply(null, rnums) : 0) + 1).padStart(4, "0");
        x.amount = amt; x.due = isoToTH(eff); x.status = "REQUESTED";
        x.reqBy = ROLES[role].person; x.reqRole = role; x.reqAt = "วันนี้";
        x.reqTo = PAY_APPROVER;   // ทุกยอดผ่านผู้จัดการ ไม่มีเกณฑ์วงเงิน
        x.reqDocs = reqDocs(t.p, x);
        x.stampOn = stamp && dc ? dc.n : "";
        x.stampPos = stamp ? {x:prPosNow().x, y:prPosNow().y} : null;   // ตำแหน่งที่ผู้ขอวางไว้เอง
        x.reqSt = "PENDING"; x.rejWhy = ""; x.rejBy = ""; x.apvAt = "";
        x.effNote = txt;
        t.p.tl.push(["วันนี้", ROLES[role].person,
          "ขออนุมัติทำจ่าย " + bahtIn(amt) + " · มีผลวันที่ " + isoToTH(eff)]);
        if (stamp) t.p.tl.push(["วันนี้", "ระบบ",
          "ประทับข้อความลงบน " + (dc ? dc.n : "เอกสารที่แนบ") + " (" +
          (valOf("pr_size") || "13") + "pt · ตำแหน่ง " + Math.round(prPosNow().x) + "/" +
          Math.round(prPosNow().y) + " ตามที่ผู้ขอวางไว้) แล้วเก็บเป็นเวอร์ชันใหม่ — ต้นฉบับยังอยู่"]);
        t.p.tl.push(["วันนี้", "ระบบ", "แนบเอกสารทั้งชุดจากไดรฟ์กลางไปกับคำขอ และแจ้ง " +
          esc(ROLES[PAY_APPROVER].name) + " ทาง Lark"]);
        notify(PAY_APPROVER, "act", t.p.no,
          "รออนุมัติจ่าย " + x.reqNo,
          t.p.no + " " + t.p.sup + " — " + baht(amt) + " มีผล " + isoToTH(eff) +
          " · ขอโดย " + ROLES[role].person + " · เอกสารแนบ " + x.reqDocs.length + " ใบ");
        payReqOpen = null; prPos = null; prDrag = null; modals();
        // เดินขั้นตอนเฉพาะตอนที่จัดซื้อยิงคำขอจากขั้น "ส่งมอบเอกสาร"
        // บัญชีตั้งเรื่องจากตารางงวดไม่ใช่การจบขั้นตอนของ PO — เดินขั้นให้จะข้ามงานคนอื่น
        if ((st(t.p) || {}).c === "DOC_HANDOVER") advance(t.p, "ส่งมอบเอกสารครบชุด + ขออนุมัติทำจ่าย");
        else t.p.tl.push(["วันนี้", ROLES[role].person,
          "ตั้งเรื่องขอจ่ายงวดที่ " + x.seq + " " + bahtIn(amt) + " ตาม " + x.billNo]);
        toast("ส่งให้" + ROLES[PAY_APPROVER].name + "อนุมัติแล้ว — ทุกยอดต้องผ่านผู้จัดการ");
        render(); return;
      }
      return;
    }

    // ถามกลับไปแผนกก่อนหน้าเมื่อข้อมูลที่ต้องใช้ยังไม่มา — 1 คลิก ไม่ต้องเปิดไลน์
    const ak = ev.target.closest("[data-ask]");
    if (ak) {
      const sg = STAGES.filter(x => x.c === ak.dataset.ask)[0];
      const ms = missingIn(p).filter(k => FIELD_AT[k] && FIELD_AT[k].stage === ak.dataset.ask)
        .map(k => FIELD_AT[k].lb);
      p.tl.push(["วันนี้", ROLES[role].person,
        "ถามกลับไปที่ " + (sg ? ROLES[sg.o].name : "-") + " — ขอ " + ms.join(" · ")]);
      toast("ส่งคำถามถึง " + (sg ? person(sg.o) : "-") + " ทาง Lark แล้ว พร้อมบอกว่าขาดช่องไหน");
      render(); return;
    }

    // ปิดข้อค้างจากใบตรวจ — ต้องเขียนว่าสรุปว่าอย่างไร ไม่ใช่กดปิดเฉย ๆ
    const qd = ev.target.closest("[data-qcdone]");
    if (qd) {
      const i = parseInt(qd.dataset.qcdone, 10), it = (p.qcOpen || [])[i];
      if (!it) return;
      const why = valOf("qc_why_" + i).trim();
      if (!why) { toast("ต้องเขียนว่าสรุปว่าอย่างไร — ปลายทางต้องรู้ว่าจบยังไง"); return; }
      it.st = "CLOSED"; it.closeBy = ROLES[role].person; it.closeWhy = why;
      p.tl.push(["วันนี้", ROLES[role].person, "สรุปข้อค้างจากใบตรวจ: " + it.t + " → " + why]);
      // ปลดล็อกงวดจ่ายเมื่อไม่เหลือข้อค้างที่ล็อกไว้ และไม่มีใบเคลมค้าง
      if (!qcPayHold(p).length && !p.claim) {
        let n = 0;
        p.payments.forEach(x => { if (x.status === "BLOCKED") { x.status = "PENDING"; n++; } });
        if (n) {
          p.tl.push(["วันนี้", "ระบบ", "สรุปข้อค้างครบแล้ว — ปลดล็อกงวดจ่าย " + n + " งวด"]);
          notify("AC", "info", p.no, "ปลดล็อกการจ่ายแล้ว",
            p.no + " " + p.sup + " — ข้อค้างจากใบตรวจสรุปครบแล้ว ตั้งเรื่องขอจ่ายได้");
        }
      }
      toast("บันทึกแล้ว — ขึ้นบนหน้าจอของคลังและบัญชีทันที");
      render(); return;
    }

    const up = ev.target.closest("[data-up]");
    if (up) {
      upOpen = {po:p.no, doc:up.dataset.up, step:(st(p) || {}).c,
        note:"อัพโหลด " + (DOCS.filter(d => d.c === up.dataset.up)[0] || {n:""}).n};
      modals(); return;
    }

    const ab = ev.target.closest("[data-act]");
    if (!ab) return;
    const a = ab.dataset.act;
    if (CONFIRM[a] && confirmedOnce !== a) { pendingAct = {act:a}; confirmPanel(); return; }
    if (a === "approve") { upOpen = {po:p.no, doc:null, step:s.c, note:"อนุมัติภายใน"}; modals(); return; }
    else if (a === "payreq") { payReqOpen = {po:p.no}; modals(); return; }
    else if (a === "cash") { cashOpen = true; modals(); return; }
    else if (a === "nudge") {
      p.tl.push(["วันนี้", ROLES[role].person, "เตือนงานไปที่ " + ROLES[ownerOf(p)].name]);
      toast("ส่งเตือนถึง " + person(ownerOf(p)) + " ทาง Lark แล้ว — บันทึกไว้ในประวัติด้วย");
    }
    else if (a === "sappull") {
      // ของจริงคือเรียกข้อมูล PO จาก B1 มาเติมให้ ไม่ให้คนพิมพ์เลขเอง
      p.sap = String(10250 + Math.floor(Math.random() * 40));   // DocNum ของ B1
      p.tl.push(["วันนี้", "ระบบ", "ดึง PO " + p.sap + " จาก B1 (OPOR/POR1) — ผู้ขาย จำนวน มูลค่า มาพร้อมกัน"]);
      /* เงื่อนไขชำระกับวันครบกำหนดมาจาก SAP อยู่แล้ว (PO Payment Term / Due Date ในรายงาน Costing)
         ของเดิมตั้งเป็น "เครดิต 30 วัน" 1 งวดเสมอ ซึ่งไม่ตรงกับของจริงสักเงื่อนไขเดียว
         ตอนนี้กางตาม PAY_TERMS — เงื่อนไขผสมได้หลายงวด และงวดที่ผ่าน LC ติดป้ายไว้ */
      if (!p.term || /^รอกำหนด/.test(p.term)) {
        p.term = p.sapTerm || "100% after received goods within 7 days";
        const dueTH = p.sapDue || isoToTH(new Date(Date.now() + 30*864e5).toISOString().slice(0,10));
        const tp = termPlan(p.term);
        p.payments = buildPayments(p.amt, p.term, dueTH);
        const nLC = p.payments.filter(isLC).length;
        p.tl.push(["วันนี้", "ระบบ",
          "อ่านเงื่อนไขชำระจาก SAP (PO Payment Term / OCTG) = “" + p.term + "” (" + tp.n + ") → สร้างงวดจ่าย " +
          p.payments.length + " งวด ครบกำหนด " + dueTH +
          (nLC ? " · " + nLC + " งวดชำระผ่าน LC ไม่ต้องตั้งเบิก" : "")]);
        if (tp.odd) p.tl.push(["วันนี้", "ระบบ",
          "เงื่อนไขชำระอ่านไม่ออกทั้งหมด — สร้างงวดเดียวไว้ก่อน ให้จัดซื้อยืนยันก่อนขออนุมัติจ่าย"]);
      } else {
        p.tl.push(["วันนี้", "ระบบ", "เงื่อนไขชำระตรงกับที่ SAP ส่งมาอยู่แล้ว — งวดจ่ายไม่เปลี่ยน"]);
      }
      advance(p, "ผูกกับ PO ใน B1");
    }
    else if (a === "reject") { p.tl.push(["วันนี้", ROLES[role].person, "ไม่อนุมัติ — ตีกลับพร้อมเหตุผล"]); toast("ตีกลับให้จัดซื้อแล้ว"); }
    else if (a === "qcpass") {
      upOpen = {po:p.no, doc:(docAtStage(p) || {}).c || null, step:s.c, note:"ตรวจรับผ่าน"};
      modals(); return;
    }
    else if (a === "goic") {
      // เดิมแค่พาไปหน้าใบขอรหัส แต่ไม่มีใบของ PO นี้ LS จึงเปิดไปเจอใบของคนอื่น
      let r = ITEMREQS.filter(x => x.po === p.no)[0];
      if (!r) {
        const nums = ITEMREQS.map(x => parseInt(x.id.split("-")[2], 10)).filter(n => !isNaN(n));
        // ต้องใช้ชื่อฟิลด์ชุดเดียวกับที่หน้าจอใบขอรหัสอ่าน (name/pack/sup/hs/storage/shelf)
        r = {id:"IC-26-" + String((nums.length ? Math.max.apply(null, nums) : 0) + 1).padStart(4, "0"),
             po:p.no, name:p.item, brand:"—", group:"Food",
             uom:(String(p.qty).split(" ")[1] || "KG"), pack:"—", sup:p.sup,
             hs:"—", storage:"—", shelf:"—",
             by:ROLES[role].person, date:"วันนี้", status:"WAIT_APPROVE", sap:"",
             note:"เปิดจาก " + p.no + " · สเปก: " + (p.spec || "—")};
        ITEMREQS.unshift(r);
        p.tl.push(["วันนี้", ROLES[role].person,
          "เปิดใบขอรหัสสินค้า " + r.id + " จาก PO นี้ — ชื่อสินค้า หน่วย และสเปกถูกดึงมาให้ ไม่ต้องพิมพ์ซ้ำ"]);
        toast("เปิดใบขอรหัส " + r.id + " ให้แล้ว — ข้อมูลดึงมาจาก PO ไม่ต้องกรอกใหม่");
      }
      openIC = r.id; page = "req"; subtab = "ITEM"; render(); return;
    }
    else if (a === "topay") {
      toast("เลื่อนลงไปที่ตารางการจ่ายเงินด้านล่าง — ปุ่มบันทึกการจ่ายอยู่ที่งวดนั้น");
      render(); return;
    }
    else if (a === "qcfail") {
      // ต้องบันทึกผลตรวจก่อน ไม่งั้นใบเคลมไม่มีตัวเลขให้ผู้ขายดู และบัญชีไม่รู้ว่าต้องได้คืนเท่าไหร่
      upOpen = {po:p.no, doc:(docAtStage(p) || {}).c || null, step:s.c, mode:"qcfail",
        note:"ตรวจรับไม่ผ่าน"};
      modals(); return;
    }
    else if (a === "done") {
      // ขั้นปิดบัญชีถูกกั้นด้วยกฎตรวจสอบ — บอกทุกข้อที่ติดพร้อมกัน ไม่ใช่ทีละข้อ
      const bl = s.c === "AC_CLOSE" ? blockedBy(p) : [];
      if (bl.length) { toast("ปิดไม่ได้ — ติด " + bl.length + " ข้อ: " + bl.map(c => c.t).join(" · ")); render(); return; }
      // ทุกขั้นเปิดป๊อปอัปให้แนบไฟล์ของขั้นนั้น + เขียนหมายเหตุ ก่อนส่งต่อ
      upOpen = {po:p.no, doc:(docAtStage(p) || {}).c || null, step:s.c,
        note:"ทำ “" + (s.n || "") + "” เสร็จ"};
      modals(); return;
    }
    render();
  }

  const PAYFIELDS = ["py_date","py_value","py_method","py_bank","py_ref","py_whttype",
    "py_wht","py_fee","py_feeby","py_amt","py_slip","py_reason","py_note"];
  const QFIELDS = ["q_supplier","q_price","q_lead","q_valid"];
  const UPFIELDS = ["up_file","up_note","up_none"];
  const CSFIELDS = ["cs_sup","cs_item","cs_qty","cs_amt","cs_date","cs_from","cs_why","cs_bypass","cs_bywhy"];
  const PRFIELDS = ["pr_amt","pr_eff","pr_stamp","pr_doc","pr_pos","pr_size","pr_color","pr_text",
                    "pr_bkind","pr_bno","pr_bamt","pr_bfile"];   // ช่องเอกสารเรียกเก็บก็ต้องอัปเดตตัวอย่างเอกสารด้วย
  function modalInput(id) {
    if (UPFIELDS.indexOf(id) >= 0 || String(id).indexOf("hf_") === 0) { upCalc(); return; }
    if (CSFIELDS.indexOf(id) >= 0) { cashCalc(); return; }
    if (PRFIELDS.indexOf(id) >= 0) { if (id === "pr_text") prTouched = true; prCalc(); }
  }

  document.addEventListener("input", function (ev) {
    if (ev.target.id === "payq") {
      payQKw = ev.target.value; const el0 = ev.target;
      renderMain();
      const n0 = document.getElementById("payq");
      if (n0 && n0.focus) { n0.focus(); if (n0.setSelectionRange) n0.setSelectionRange(el0.value.length, el0.value.length); }
      return;
    }
    if (ev.target.id === "q") { q = ev.target.value; const el = ev.target;
      renderMain(); const nq = document.getElementById("q");
      if (nq) { nq.focus(); nq.setSelectionRange(el.value.length, el.value.length); }
      return; }
    if (PAYFIELDS.indexOf(ev.target.id) >= 0) {
      if (ev.target.id === "py_amt") payTouched.amt = true;
      if (ev.target.id === "py_wht") payTouched.wht = true;
      payCalc();
    }
    if (QFIELDS.indexOf(ev.target.id) >= 0) quoteCalc();
    modalInput(ev.target.id);
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "fdept") { fDept = ev.target.value; renderMain(); return; }
    if (PAYFIELDS.indexOf(ev.target.id) >= 0) {
      if (ev.target.id === "py_whttype") payTouched.wht = false;
      payCalc();
    }
    if (QFIELDS.indexOf(ev.target.id) >= 0) quoteCalc();
    modalInput(ev.target.id);
  });

  function renderMain() {
    const m = $("#main");
    // กันทางอ้อม — สลับบทบาทแล้วค้างอยู่หน้าที่บทบาทใหม่ไม่มีสิทธิ์ ต้องเด้งกลับ ไม่ใช่วาดต่อ
    if (!canSee(page)) { page = "home"; subtab = ""; }
    if (page === "detail") m.innerHTML = pageDetail();
    else if (page === "po") m.innerHTML = pagePo();
    else if (page === "req") m.innerHTML = pageReq();
    else if (page === "inbox") m.innerHTML = pageInbox();
    else if (page === "admin") m.innerHTML = pageAdmin();
    else if (page === "report") m.innerHTML = pageReport();
    else m.innerHTML = pageHome();
  }
  function render() {
    chrome(); renderMain(); bugPanel(); modals(); confirmPanel();
    window.scrollTo({top:0, behavior:"instant"});
  }

  /* ============ ลิงก์ตรงถึงรายการ (#po/<เลขรายการ>) ============
     ใช้เปิดจากที่อื่นได้โดยไม่ต้องให้คนไล่หาเอง — Dashboard ตั้งเบิกทำจ่ายส่งลิงก์นี้มา
     เจอเลขที่ไม่มีในระบบก็บอกตรง ๆ ว่าไม่พบ ไม่ใช่เงียบแล้วเปิดหน้าแรก */
  function fromHash() {
    const h = String((typeof location !== "undefined" && location.hash) || "");
    const m = h.match(/^#po\/(.+)$/);
    if (!m) return false;
    const no = decodeURIComponent(m[1]).trim();
    if (POS.some(p => p.no === no)) { openPo = no; page = "detail"; return true; }
    // เลข PO ที่ระบบ Costing ส่งมาแต่ยังไม่มีรายการในระบบนี้ — ให้ค้นหาให้เลย
    page = "po"; subtab = "SEARCH"; q = no; openPo = null;
    pendingHashMiss = no;
    return true;
  }
  let pendingHashMiss = "";
  function goHash(first) {
    const hit = fromHash();
    if (!hit && !first) return;
    render();
    if (pendingHashMiss) {
      toast("ไม่พบรายการ " + pendingHashMiss + " ในระบบเอกสาร — ค้นหาให้แล้ว");
      pendingHashMiss = "";
    }
  }
  if (typeof window !== "undefined" && window.addEventListener)
    window.addEventListener("hashchange", () => goHash(false));
  goHash(true);
})();
</script>
