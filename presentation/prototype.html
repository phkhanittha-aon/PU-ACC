      {o:"ใบแจ้งหนี้ผู้ขาย", src:"OPCH / PCH1", n:395, every:"ทุก 30 นาที", last:"07:30", st:"ช้า 1 รอบ"},
      {o:"การจ่ายเงินออก", src:"OVPM / VPM2", n:301, every:"ทุก 30 นาที", last:"08:30", st:"OK"},
      {o:"เงื่อนไขชำระ", src:"OCTG", n:9, every:"ทุกคืน", last:"02:15", st:"OK"},
      // รายงานที่ทีมส่งมาจริง — เป็นที่มาของเงื่อนไขจ่าย วันครบกำหนด และต้นทุนนำเข้า
      {o:"รายงาน Costing (Mech / Food)", src:"รายงานจาก SAP · 51 คอลัมน์", n:231,
       every:"ทุกครั้งที่ออกรายงาน", last:"—", st:"ใช้อยู่"}
    ]
  };

  /* ================= สถานะหน้าจอ ================= */
  let role = "SR", page = "home", subtab = "ACTIVE", openPo = null, openClaim = null, q = "", fDept = "";
  let bugOpen = false, bugSev = "WRONG", openIC = null, openPR = null, quoteOpen = null, pendingAct = null;
  let payQ = "", payQKw = "";     // ตัวกรองของคิวตั้งเบิกทำจ่ายในหน้ารายงาน
  let upOpen = null, cashOpen = false, payReqOpen = null, rejOpen = null;   // ป๊อปอัปอัพโหลด / เงินสด / ขอทำจ่าย / ตีกลับ
  let payOpen = null, payTouched = {amt:false, wht:false}, prTouched = false;

  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const baht = n => "฿" + Number(n||0).toLocaleString("en-US");
  const money = () => ROLES[role].money;
  // ยอดเงินที่ต้องฝังกลางประโยคของบรรทัดประวัติ ให้ห่อด้วย bahtIn() เสมอ
  // ผู้วาด (tlText) จะตัดทั้งก้อนทิ้งเมื่อคนอ่านไม่มีสิทธิ์เห็นเงิน — ไม่ใช่ปิดตัวเลขไว้เฉย ๆ
  const MK = "\u2062";                                    // อักขระที่มองไม่เห็น ไม่มีทางโผล่ในข้อความจริง
  const bahtIn = n => MK + baht(n) + MK;
  const tlText = t => {
    const q = String(t == null ? "" : t).split(MK);
    return money() ? q.join("")
      : q.filter((x, i) => i % 2 === 0).join("").replace(/\s{2,}/g, " ").replace(/\s+·/g, " ·").trim();
  };
  const st = p => STAGES[p.stage] || null;
  const ownerOf = p => st(p) ? st(p).o : "—";
  const isActive = p => p.status === "ACTIVE";
  const ageTxt = h => h < 24 ? h + " ชม." : Math.floor(h/24) + " วัน";
  const dept = k => '<span class="dept" style="color:var(' + (ROLES[k]?ROLES[k].v:"--ink-3") + ')">' + esc(k) + "</span>";

  function statusPill(p) {
    if (p.status === "COMPLETED") return '<span class="pill ok">เสร็จสิ้น</span>';
    if (p.status === "CANCELLED") return '<span class="pill wait">ยกเลิก</span>';
    if (p.claim) return '<span class="pill late">มีเคลมค้าง</span>';
    const s = st(p);
    if (s && p.age > s.sla) return '<span class="pill late">เลยกำหนด</span>';
    return '<span class="pill info">กำลังดำเนินการ</span>';
  }
  function phaseOf(p){ for(const ph of PHASES) if(p.stage<=ph.to) return ph; return PHASES[3]; }
  function docState(p, d) {
    if (p.skip.indexOf(d.at) >= 0) return "na";
    if (p.stage > d.at) return "ok";
    if (p.stage === d.at) return "wait";
    return "pend";
  }
  const missing = p => DOCS.filter(d => d.req && docState(p,d) === "wait");
  // เอกสารที่ผูกกับขั้นตอนปัจจุบัน — ใช้ตัดสินว่าป๊อปอัปอัพโหลดต้องบังคับแนบไฟล์ไหม
  const docAtStage = p => DOCS.filter(d => d.at === p.stage && docState(p, d) !== "na")[0] || null;

  /* รวมเอกสารทั้งชุดเป็นไฟล์เดียวเมื่อปิดรายการ — ไม่ต้องไล่เปิดทีละใบตอนตรวจสอบย้อนหลัง */
  function mergeDocs(p) {
    const parts = [];
    DOCS.forEach(d => { if (docState(p, d) !== "na") parts.push(d.n); });
    Object.keys(p.files || {}).forEach(k => {
      if (k.indexOf("STEP_") === 0) {
        const sg = STAGES.filter(x => x.c === k.slice(5))[0];
        parts.push("บันทึกขั้น " + (sg ? sg.n : k.slice(5)));
      }
    });
    // เอกสารเรียกเก็บของแต่ละงวด + สลิปของงวดนั้น เรียงคู่กัน ตรวจย้อนหลังได้ทีละงวด
    p.payments.forEach(x => {
      if (x.billNo) parts.push(BILLDOC[billKind(x)].n + " งวดที่ " + x.seq + " (" + x.billNo + ")");
      if (x.status === "PAID") parts.push("สลิปงวดที่ " + x.seq);
    });
    if (p.qcBypass) parts.push("ใบอนุมัติข้าม QC");
    (p.qcOpen || []).forEach(x => parts.push("บันทึกสรุปข้อค้างจากใบตรวจ: " + x.t));
    return {name:p.no + "_ชุดเอกสารครบ.pdf", parts:parts, pages:parts.length * 2,
      mb:(parts.length * 0.32).toFixed(1), at:"วันนี้"};
  }
  POS.forEach(p => { if (p.status === "COMPLETED" && !p.bundle) p.bundle = mergeDocs(p); });
  // LC = ธนาคารจ่ายตามเอกสารแล้ว ไม่ใช่งวดที่ค้างรอเราตั้งเบิก จึงนับเป็นงวดที่จบทางฝั่งนี้
  const DONE_PAY = ["PAID", "CANCELLED", "VOID", "LC"];
  const unpaid = p => p.payments.filter(x => DONE_PAY.indexOf(x.status) < 0);
  function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");
    clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2600);}

  /* ================= โครง ================= */
  // 5 เมนู — หน้าจอเฉพาะแผนกถูกยุบเข้า "หน้าหลัก" ทั้งหมด (กรองตามบทบาทให้เอง)
  // ไอคอนเป็น inline SVG (stroke=currentColor) — ไม่ใช้ CDN ไม่ใช้อิโมจิเป็นตัวนำทาง
  /* เมนู — บางหน้าเปิดให้เฉพาะบทบาทที่เกี่ยว
     หน้าตั้งค่าระบบมีทะเบียนซื้อเงินสดพร้อมยอดเงินอยู่ข้างใน
     QC/โลจิสติกส์/คลัง ไม่มีสิทธิ์เห็นยอดเงินตามกติกา จึงไม่เปิดหน้านี้ให้ตั้งแต่แรก */
  const NAV = [
    {k:"home",   t:"หน้าหลัก"},
    {k:"po",     t:"ใบสั่งซื้อ (PO)"},
    {k:"req",    t:"ใบคำร้อง"},
    {k:"report", t:"รายงาน"},
    {k:"admin",  t:"ตั้งค่าระบบ", roles:["SR", "AC", "ACH", "GM"]}
  ];
  const canSee = k => {
    const n = NAV.filter(x => x.k === k)[0];
    return !n || !n.roles || n.roles.indexOf(role) >= 0;
  };
  const myNav = () => NAV.filter(n => canSee(n.k));
  const SUB0 = {po:"ACTIVE", req:"PRICE", admin:"ISSUES"};

  const myNotifs = () => NOTIFS.filter(n => n.to === role);
  const unread   = () => myNotifs().filter(n => !n.read).length;
  const openIssues = () => ISSUES.filter(i => i.status !== "CLOSED").length;

  function chrome() {
    const r = ROLES[role];
    document.documentElement.style.setProperty("--rc", "var(" + r.v + ")");
    document.documentElement.style.setProperty("--rc-soft", "var(" + r.v + "-soft)");
    const myQueue = POS.filter(p => isActive(p) && ownerOf(p) === role).length;
    const reqOpen = CLAIMS.filter(c=>!c.cn).length + ITEMREQS.filter(x=>x.status!=="DONE").length +
      PRICEREQS.filter(x=>x.status==="NEW").length;

    $("#nav").innerHTML = myNav().map(n => {
      const cur = n.k === page ? ' aria-current="page"' : "";
      let badge = "";
      if (n.k === "po" && myQueue) badge = '<span class="cnt">' + myQueue + "</span>";
      if (n.k === "req" && reqOpen) badge = '<span class="cnt">' + reqOpen + "</span>";
      if (n.k === "admin" && openIssues()) badge = '<span class="cnt">' + openIssues() + "</span>";
      return '<button data-page="' + n.k + '"' + cur + ">" + esc(n.t) + badge + "</button>";
    }).join("");

    $("#tools").innerHTML =
      '<button class="iconbtn' + (page==="inbox" ? " on" : "") + '" data-page="inbox">แจ้งเตือน' +
        (unread() ? '<span class="bdg">' + unread() + "</span>" : "") + "</button>" +
      '<button class="iconbtn" data-bug="open">แจ้งปัญหา</button>';

    $("#user").innerHTML = '<span class="av">' + esc(r.init) + "</span><span>" + esc(r.person) +
      '<br><span class="mono" style="font-size:10.5px;color:var(--ink-3)">' + esc(r.name) + "</span></span>";

    $("#roles").innerHTML = '<span class="lb">บทบาท</span>' + Object.keys(ROLES).map(k =>
      '<button data-role="' + k + '" aria-pressed="' + (k===role) + '" style="--rc:var(' + ROLES[k].v + ')">' +
      '<i></i>' + esc(ROLES[k].name) + "</button>").join("");
  }

  /* ================= หน้าหลัก ================= */
  // PO ที่กำลังจะถึงคิวของฉันใน 2 ขั้นถัดไป — ให้เตรียมตัวได้ ไม่ใช่รอให้เด้งมาแล้วค่อยรู้
  function comingToMe(p) {
    if (ownerOf(p) === role) return false;
    let n = p.stage + 1, hop = 0;
    while (n < STAGES.length && hop < 3) {
      if (p.skip.indexOf(n) < 0) { hop++; if (STAGES[n].o === role) return true; }
      n++;
    }
    return false;
  }

  function pageHome() {
    const act = POS.filter(isActive);
    const mine = act.filter(p => ownerOf(p) === role);
    const mineLate = mine.filter(p => st(p) && p.age > st(p).sla);
    const soon = act.filter(comingToMe);
    // คำขออนุมัติจ่ายไม่ได้ผูกกับ "เจ้าของขั้น" — ผู้อนุมัติจึงไม่เคยเห็นบนหน้าหลักมาก่อน
    const toApprove = act.filter(p => p.payments.some(x =>
      x.status === "REQUESTED" && x.reqBy !== ROLES[role].person &&
      role === (x.reqTo || PAY_APPROVER)));
    const others = act.filter(p => ownerOf(p) !== role && !comingToMe(p) && toApprove.indexOf(p) < 0);
    const duePay = act.reduce((n, p) => n + unpaid(p).length, 0);

    let h = '<div class="ph"><h1>สวัสดี ' + esc(ROLES[role].person) + '</h1><span class="d">' +
      esc(ROLES[role].name) + " · " +
      (mine.length || toApprove.length
        ? "มีงานรอคุณ " + (mine.length + toApprove.length) + " รายการ" +
          (toApprove.length ? " (รออนุมัติจ่าย " + toApprove.length + ")" : "")
        : "ไม่มีงานค้างที่คุณ") + "</span></div>";

    // แถบสรุปข้อมูล B1 — บอกเสมอว่าเลขที่เห็นสดแค่ไหน
    h += '<div class="synced' + (SAP.ok ? "" : " stale") + '">' +
      "<span>ข้อมูลจาก SAP B1 ล่าสุด <b>" + esc(SAP.at) + "</b> — เลข PO ผู้ขาย จำนวน เงื่อนไขชำระ และการรับของ " +
      "ดึงมาจาก B1 ไม่ได้พิมพ์เอง</span>" +
      '<span class="sp2"></span><button class="btn" data-act="sapnow">ดึงข้อมูลใหม่ตอนนี้</button></div>';

    h += '<div class="kpis">' +
      '<div class="kpi a"><div class="n">' + (mine.length + toApprove.length) + '</div><div class="k">ต้องทำวันนี้</div></div>' +
      (toApprove.length ? '<div class="kpi r"><div class="n">' + toApprove.length +
        '</div><div class="k">รออนุมัติจ่ายจากคุณ</div></div>' : "") +
      '<div class="kpi r"><div class="n">' + mineLate.length + '</div><div class="k">เลยกำหนดของคุณ</div></div>' +
      '<div class="kpi b"><div class="n">' + soon.length + '</div><div class="k">กำลังจะถึงคิวคุณ</div></div>' +
      (money() ? '<div class="kpi"><div class="n">' + duePay + '</div><div class="k">งวดที่ยังไม่จ่าย</div></div>' : "") +
      '<div class="kpi g"><div class="n">' + POS.filter(p => p.status === "COMPLETED").length + '</div><div class="k">ปิดแล้วเดือนนี้</div></div>' +
      "</div>";

    if (!mine.length && !toApprove.length)
      h += '<div class="note good" style="border:1px solid var(--go);margin-bottom:16px">' +
        '<span><b>ตอนนี้ไม่มีอะไรที่คุณต้องทำ</b> — ' +
        "ระบบจะแจ้งเตือนทาง Lark เมื่อถึงคิวคุณ ไม่ต้องเปิดมานั่งเช็คเอง</span></div>";

    // คำขออนุมัติจ่ายขึ้นก่อนงานอื่น เพราะปล่อยไว้แล้วผู้ขายไม่ได้เงินตามกำหนด
    if (toApprove.length) {
      h += '<div class="card" style="background:var(--gold-50)"><h3>รออนุมัติจ่ายจากคุณ' +
        '<span class="c">' + toApprove.length + " รายการ · กดเข้าไปดูใบขออนุมัติเต็ม</span></h3>" +
        '<div class="tw"><table><thead><tr><th>เลขที่คำขอ</th><th>รายการ / ผู้ขาย</th>' +
        '<th class="num">ยอดที่ขอ</th><th>มีผลวันที่</th><th>ผู้ขอ</th></tr></thead><tbody>';
      toApprove.forEach(p => {
        const x = p.payments.filter(y => y.status === "REQUESTED")[0] || {};
        h += '<tr class="click" data-po="' + esc(p.no) + '">' +
          '<td><span class="pono">' + esc(x.reqNo || "—") + '</span><div class="sub mono">' + esc(p.no) + "</div></td>" +
          "<td>" + esc(p.sup) + '<div class="sub">' + esc(p.item) + "</div></td>" +
          '<td class="num">' + baht(x.amount) + "</td>" +
          '<td><span class="mono">' + esc(x.due || "—") + "</span></td>" +
          "<td>" + esc(x.reqBy || "—") + '<div class="sub">' + esc(x.reqAt || "") + "</div></td></tr>";
      });
      h += "</tbody></table></div>" +
        '<div class="note info"><span>กดที่แถวเพื่อดู<b>ใบขออนุมัติเต็ม</b> — ' +
        "ยอด วันที่มีผล เอกสารประกอบทุกใบ และผลตรวจที่ระบบทำให้แล้ว ก่อนกดอนุมัติ</span></div></div>";
    }

    h += poTable("ต้องทำวันนี้", mine, "ไม่มีงานค้างที่คุณ");
    h += poTable("กำลังจะถึงคิวคุณ — เตรียมตัวได้", soon, "ยังไม่มีงานที่กำลังจะเข้ามา");
    h += '<details class="blk"><summary>งานของแผนกอื่น<span class="c">' + others.length +
      ' รายการ · เปิดดูเมื่ออยากรู้ภาพรวม</span></summary>';
    if (!others.length) h += '<div class="empty">—</div>';
    else {
      h += '<div class="tw"><table><thead><tr><th>เลข PO</th><th>ผู้ขาย / สินค้า</th><th>ค้างที่</th><th>สถานะ</th></tr></thead><tbody>';
      others.forEach(p => {
        const s = st(p);
        h += '<tr class="click" data-po="' + esc(p.no) + '">' +
          '<td><span class="pono">' + esc(p.no) + "</span></td>" +
          "<td>" + esc(p.sup) + '<div class="sub">' + esc(p.item) + "</div></td>" +
          "<td>" + (s ? dept(s.o) + " " + esc(person(s.o)) : "—") + "</td>" +
          "<td>" + statusPill(p) + "</td></tr>";
      });
      h += "</tbody></table></div>";
    }
    return h + "</details>";
  }

  // ป้ายบอกว่ารายการนี้มาจาก PO ปกติหรือเป็นการซื้อเงินสด
  const entryTag = p => p.entry === "CASH" ? '<span class="etype cash">CASH</span>' : "";

  /* ================= PO list / search ================= */
  function pagePo() {
    const act  = POS.filter(p => p.status === "ACTIVE");
    const done = POS.filter(p => p.status === "COMPLETED");
    const canc = POS.filter(p => p.status === "CANCELLED");

    let h = '<div class="ph"><h1>ใบสั่งซื้อ (PO)</h1><span class="d">1 PO = 1 รายการงาน ตั้งแต่เช็คราคาจนปิดบัญชี · ' +
      "รายการซื้อเงินสดที่ไม่ได้เปิด PO อยู่ในรายการเดียวกันนี้ ติดป้าย <b>CASH</b></span></div>";
    if (role === "SR" || role === "AC")
      h += '<div class="note info" style="border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:14px">' +
        '<span><b>ซื้อของเงินสดโดยไม่ได้เปิด PO?</b> ' +
        "บันทึกเข้าระบบได้ ไม่ต้องเก็บบิลไว้ในลิ้นชัก — ระบบออกเลข CS-26-xxxx และเก็บไฟล์ในไดรฟ์กลางที่เดียวกัน " +
        '<button class="btn pri" data-cash="open">เพิ่มรายการซื้อเงินสด</button></span></div>';
    h += '<div class="stabs">' +
      tabBtn("ACTIVE","กำลังดำเนินการ",act.length) +
      tabBtn("DONE","เสร็จสิ้น",done.length) +
      tabBtn("CANCELLED","ยกเลิก",canc.length) +
      tabBtn("SEARCH","ค้นหา","") + "</div>";

    if (subtab === "SEARCH") return h + searchPanel();
    const list = subtab === "DONE" ? done : subtab === "CANCELLED" ? canc : act;
    const title = subtab === "DONE" ? "PO ที่ปิดแล้ว" : subtab === "CANCELLED" ? "PO ที่ยกเลิก" : "PO ที่ยังไม่ปิด";
    return h + poTable(title, list, "ไม่มีรายการ");
  }
  function tabBtn(k, t, n) {
    return '<button data-sub="' + k + '" aria-current="' + (subtab===k) + '">' + esc(t) +
      (n !== "" ? '<span class="n">' + n + "</span>" : "") + "</button>";
  }

  function searchPanel() {
    let h = '<div class="toolbar">' +
      '<input type="search" id="q" placeholder="เลข PO · เลข B1 · ผู้ขาย · สินค้า · เลข Lot · เลขใบเคลม" value="' + esc(q) + '">' +
      '<label>ค้างที่</label><select id="fdept"><option value="">ทุกแผนก</option>' +
      Object.keys(ROLES).map(k => '<option value="' + k + '"' + (fDept===k?" selected":"") + ">" + esc(ROLES[k].name) + "</option>").join("") +
      "</select>" +
      '<button class="btn" data-clear="1">ล้าง</button></div>';

    if (!q && !fDept) {
      h += '<div class="note info"><span>พิมพ์อย่างน้อย 2 ตัวอักษร — ค้นได้ทั้งเลข PO, เลข B1, ชื่อผู้ขาย, ชื่อสินค้า, เลข Lot และเลขใบเคลม ' +
        "และค้นได้ทั้ง PO ที่ปิดแล้ว</span></div>";
      return h;
    }
    const needle = q.toLowerCase();
    const claimPo = {};
    CLAIMS.forEach(c => { if (c.po) claimPo[c.po] = c.id; });
    const res = POS.filter(p => {
      if (fDept && (!isActive(p) || ownerOf(p) !== fDept)) return false;
      if (!needle) return true;
      return [p.no, p.sap, p.sup, p.item, claimPo[p.no] || ""].join(" ").toLowerCase().indexOf(needle) >= 0;
    });
    h += poTable("ผลการค้นหา", res, "ไม่พบรายการที่ตรงกับ “" + q + "”", true);
    return h;
  }

  function poTable(title, list, emptyText, showStatus) {
    let h = '<div class="card"><h3>' + esc(title) + '<span class="c">' + list.length + " รายการ</span></h3>";
    if (!list.length) return h + '<div class="empty">' + esc(emptyText) + "</div></div>";
    h += '<div class="tw"><table><thead><tr><th>เลข PO</th><th>ผู้ขาย / สินค้า</th>' +
      (money() ? '<th class="num">มูลค่า</th><th>การจ่าย</th>' : "") +
      "<th>เฟส</th><th>ค้างที่</th><th>สถานะ</th></tr></thead><tbody>";
    list.forEach(p => {
      const s = st(p), ph = phaseOf(p);
      const paid = p.payments.filter(x => x.status === "PAID").length;
      h += '<tr class="click" data-po="' + esc(p.no) + '">' +
        '<td><span class="pono">' + esc(p.no) + "</span>" + entryTag(p) +
          '<div class="sub mono">' + esc(p.entry === "CASH" ? "ไม่มี PO ใน B1" : (p.sap || "รอผูกกับ B1")) + "</div></td>" +
        "<td>" + esc(p.sup) + '<div class="sub">' + esc(p.item) + " · " + esc(p.qty) + "</div></td>" +
        (money() ? '<td class="num">' + baht(p.amt) + "</td>" +
          "<td>" + (p.payments.length
            ? '<span class="mono" style="font-size:12px">' + paid + "/" + p.payments.length + " งวด</span>" +
              (p.payments.length > 1 ? '<div class="sub">' + esc(p.term) + "</div>" : "")
            : "—") + "</td>" : "") +
        '<td>' + esc(ph.name) + (isActive(p) && s ? '<div class="sub">' + esc(s.n) + "</div>" : "") + "</td>" +
        "<td>" + (isActive(p) && s ? dept(s.o) + '<div class="sub">' + ageTxt(p.age) + "</div>" : "—") + "</td>" +
        "<td>" + statusPill(p) + "</td></tr>";
    });
    return h + "</tbody></table></div></div>";
  }

  /* ================= PO detail ================= */
  // ขั้นถัดไปหลังจากขั้นปัจจุบัน (ข้ามขั้นที่ไม่ต้องทำ) — ใช้บอกล่วงหน้าว่างานจะไปหาใคร
  function nextStage(p) {
    let n = p.stage + 1;
    while (n < STAGES.length && p.skip.indexOf(n) >= 0) n++;
    return STAGES[n] || null;
  }
  const person = k => ROLES[k] ? ROLES[k].person : "";

  /* ============ ใบส่งงาน: "แผนกก่อนหน้าส่งอะไรมาให้" ============
     เดิมข้อมูลนี้กระจายอยู่ในประวัติ ในการ์ดเอกสาร และในหัวของผู้ทำ
     ตอนนี้รวมไว้เหนือปุ่มที่ต้องกด — เปิดหน้าจอแล้วเห็นเลย ไม่ต้องเลื่อน ไม่ต้องถามในไลน์ */
  const handFmt = (f, v) => {
    if (v === "" || v == null) return "—";
    if (f.t === "date") return isoToTH(String(v));
    if (f.t === "num") return f.money ? baht(v) : String(v);
    return String(v);
  };
  function handoffCard(p) {
    if (!isActive(p)) return "";
    // ขั้นที่ทำไปแล้วและมีสัญญาส่งมอบข้อมูล เรียงจากใหม่ไปเก่า เอา 3 ขั้นล่าสุดพอ
    const done = [];
    for (let i = p.stage - 1; i >= 0 && done.length < 3; i--) {
      if (p.skip.indexOf(i) >= 0) continue;
      const sg = STAGES[i], h = handOf(sg.c, p), f = p.files[sg.c] || p.files["STEP_" + sg.c];
      // ตัดช่องเงินทิ้งทั้งแถวสำหรับบทบาทที่ไม่มีสิทธิ์เห็น — ตามหลักเดียวกับหัวเอกสาร
      // ซ่อนไปเลยดีกว่าโชว์ว่า "ดูไม่ได้" · QC ต้องตรวจของโดยไม่รู้ว่าล็อตนี้มูลค่าเท่าไหร่
      const kv = h ? h.f.filter(x => (money() || !x.money) &&
        p.hand[x.k] !== undefined && p.hand[x.k] !== "") : [];
      if (!kv.length && !f) continue;
      done.push({sg:sg, kv:kv, file:f});
    }
    if (!done.length) return "";

    let h = '<div class="hoff"><div class="ht">แผนกก่อนหน้าส่งอะไรมาให้คุณ' +
      '<span class="droot">ไม่ต้องถามในไลน์</span></div>';
    done.forEach(d => {
      h += '<div class="grp"><div class="gh">' + dept(d.sg.o) + " " +
        esc(ROLES[d.sg.o] ? ROLES[d.sg.o].name : d.sg.o) + " · " + esc(d.sg.n) + "</div>";
      if (d.kv.length || d.file) {
        h += '<dl class="kv">';
        d.kv.forEach(x => { h += "<dt>" + esc(x.lb) + "</dt><dd>" + esc(handFmt(x, p.hand[x.k])) + "</dd>"; });
        if (d.file && d.file.note) h += "<dt>หมายเหตุที่เขียนไว้</dt><dd>" + esc(d.file.note) + "</dd>";
        if (d.file) h += "<dt>ไฟล์ที่แนบ</dt><dd class=\"mono\">" + esc(d.file.n) + "</dd>";
        h += "</dl>";
      } else h += '<div class="none">ไม่ได้ส่งข้อมูลอะไรมาเพิ่ม</div>';
      h += "</div>";
    });
    return h + "</div>";
  }

  /* ข้อค้างจากใบตรวจที่ยังไม่สรุป — เดิมอยู่แต่ในไฟล์ PDF ท้ายใบ ไม่มีใครเห็น
     ใครสรุปได้: จัดซื้อ (คุยกับผู้ขาย) · QC (เรื่องคุณภาพ) · ผู้จัดการ */
  const CAN_CLOSE_QC = ["SR", "QC", "GM", "ACH"];
  function qcOpenCard(p) {
    const items = p.qcOpen || [];
    if (!items.length) return "";
    const left = qcOpenLeft(p), hold = qcPayHold(p);
    let h = '<div class="hoff"><div class="ht">ข้อค้างจากใบตรวจ' + esc(p.hand.qcRef ? " " + p.hand.qcRef : "") +
      '<span class="droot">' + (left.length ? "ยังไม่สรุป " + left.length + " ข้อ" : "สรุปครบแล้ว") + "</span></div>";
    if (hold.length)
      h += '<div class="miss1"><span>!</span><span class="sp2"><b>ล็อกการจ่ายไว้ ' + hold.length +
        " ข้อ</b> — งวดที่ยังไม่จ่ายจะขออนุมัติไม่ได้จนกว่าจะสรุปเรื่องกับผู้ขาย</span></div>";
    items.forEach((x, i) => {
      const done = x.st !== "OPEN";
      h += '<div class="grp"><div class="gh">' +
        (done ? '<span class="pill ok">สรุปแล้ว</span>'
              : x.blocks ? '<span class="pill late">รอสรุป · ล็อกจ่าย</span>'
                         : '<span class="pill wait">รอสรุป · ไม่ล็อกจ่าย</span>') +
        " " + esc(x.t) + "</div>" +
        '<dl class="kv"><dt>ผู้บันทึก</dt><dd>' + esc(x.by) + " · " + esc(x.at) + "</dd>" +
        (done ? "<dt>สรุปว่า</dt><dd>" + esc(x.closeWhy || "—") + " · โดย " + esc(x.closeBy) + "</dd>" : "") +
        "</dl>" +
        (!done && CAN_CLOSE_QC.indexOf(role) >= 0 && isActive(p)
          ? '<div class="fl2" style="justify-content:flex-start;gap:8px">' +
            '<input type="text" id="qc_why_' + i + '" placeholder="สรุปว่าอย่างไร เช่น ผู้ขายยอมเปลี่ยนกล่องให้ล็อตหน้า">' +
            '<button class="btn ok" data-qcdone="' + i + '">บันทึกว่าสรุปแล้ว</button></div>'
          : "") +
        "</div>";
    });
    return h + "</div>";
  }

  // ข้อมูลที่ขั้นนี้ "ต้องใช้" แต่ขั้นก่อนหน้าไม่ได้ส่งมา
  function missingIn(p) {
    const s = st(p); if (!s || !isActive(p)) return [];
    return needsOf(s.c, p).filter(k => p.hand[k] === undefined || p.hand[k] === "");
  }
  function missingCard(p) {
    const ms = missingIn(p);
    if (!ms.length) return "";
    const byStage = {};
    ms.forEach(k => { const at = FIELD_AT[k]; if (!at) return;
      (byStage[at.stage] = byStage[at.stage] || []).push(at.lb); });
    return Object.keys(byStage).map(sc => {
      const sg = STAGES.filter(x => x.c === sc)[0] || {n:sc, o:"SR"};
      return '<div class="miss1"><span>!</span><span class="sp2"><b>ข้อมูลที่ควรได้จาก' +
        esc(ROLES[sg.o] ? ROLES[sg.o].name : sg.o) + "ยังไม่มี:</b> " + esc(byStage[sc].join(" · ")) +
        " — ทำต่อได้ แต่ปลายทางจะติด</span>" +
        '<button class="btn bad" data-ask="' + esc(sc) + '">ถามกลับไปที่ ' +
        esc(ROLES[sg.o] ? ROLES[sg.o].name : sg.o) + "</button></div>";
    }).join("");
  }

  // กล่องบนสุด: ตอบคำถามเดียว — "ตอนนี้ฉันต้องทำอะไร"
  function todoCard(p) {
    const s = st(p), nx = nextStage(p);
    const mine = isActive(p) && s && s.o === role;
    // บอกล่วงหน้าว่างานจะไปไหน — ถ้าขั้นถัดไปเป็นแผนกตัวเอง ต้องไม่พูดว่า "ส่งต่อ" เพราะไม่ได้ส่งไปไหน
    const then = !nx ? '<div class="then">กดแล้ว PO นี้จะปิดและย้ายไปแท็บเสร็จสิ้น</div>'
      : nx.o === (s ? s.o : "") ? '<div class="then">กดแล้ว<b>งานยังอยู่ที่คุณ</b> — ขั้นถัดไปคือ <b>' +
          esc(nx.n) + "</b> ไม่ได้ส่งไปแผนกอื่น</div>"
      : '<div class="then">กดแล้วงานจะไปที่ <b>' + esc(ROLES[nx.o].name) + " (" + esc(person(nx.o)) +
        ")</b> และระบบแจ้งเตือนให้เอง — ไม่ต้องบอกในไลน์" +
        (handOf(s.c, p) ? " · สิ่งที่คุณกรอกจะไปขึ้นบนหน้าจอของเขาเลย" : "") + "</div>";

    if (!isActive(p))
      return '<div class="todo calm"><h3>สถานะ</h3><div class="big">PO นี้' +
        (p.status === "COMPLETED" ? "ปิดเรียบร้อยแล้ว" : "ถูกยกเลิก") + " — เปิดดูย้อนหลังได้อย่างเดียว</div></div>";

    if (!mine) {
      const o = ownerOf(p);
      return '<div class="todo calm"><h3>ตอนนี้ไม่มีอะไรที่คุณต้องทำ</h3>' +
        '<div class="big">รออยู่ที่ <b>' + esc(ROLES[o] ? ROLES[o].name : "-") + " (" + esc(person(o)) + ")</b> — " +
        esc(s ? s.n : "") + " · ค้างมาแล้ว " + ageTxt(p.age) + "</div>" +
        '<div class="actions"><button class="btn" data-act="nudge">เตือนให้ทำ</button>' +
        '<span class="hint">ระบบเตือนอัตโนมัติอยู่แล้วเมื่อเลยกำหนด ปุ่มนี้ใช้เมื่อด่วนจริง</span></div></div>';
    }

    let btns = "";
    if (s.c === "INTERNAL_APPROVAL")
      btns = '<button class="btn ok" data-act="approve">อนุมัติ</button>' +
             '<button class="btn bad" data-act="reject">ไม่อนุมัติ</button>';
    else if (s.c === "QC_INCOMING")
      // ลำดับปุ่มตามลำดับงานจริง — ไปสร้างใบตรวจในแอปก่อน แล้วค่อยกลับมาบันทึกผลที่นี่
      btns = qcAppBtn(p, "สร้างใบตรวจในแอป " + MODULES[modOf(p)].n) +
             '<button class="btn ok" data-act="qcpass">ตรวจรับผ่าน</button>' +
             '<button class="btn bad" data-act="qcfail">ไม่ผ่าน → เปิดใบเคลม</button>';
    else if (s.c === "ITEM_CODE")
      btns = '<button class="btn pri" data-act="goic">ไปที่ใบขอเปิดรหัสสินค้า</button>';
    else if (s.c === "PO_CREATED")
      btns = '<button class="btn pri" data-act="sappull">ดึงข้อมูล PO จาก SAP B1</button>';
    else if (s.c === "DOC_HANDOVER") {
      // รายการที่จ่ายไปแล้ว (เช่นซื้อเงินสด) ไม่มีงวดให้ขออนุมัติ — ต้องมีทางไปต่อ ไม่ใช่ทางตัน
      btns = p.payments.some(x => x.status === "PENDING")
        ? '<button class="btn pri" data-act="payreq">ส่งเอกสาร + ขออนุมัติทำจ่าย</button>'
        : '<button class="btn pri" data-act="done">ส่งมอบเอกสารครบชุด' +
          (p.entry === "CASH" ? " (จ่ายสดไปแล้ว)" : " (จ่ายครบแล้ว)") + "</button>";
    }
    else if (s.c === "PAYMENT") {
      // ขั้นทำจ่ายต้องผูกกับการบันทึกจ่ายจริง ไม่ใช่ปุ่ม "เสร็จ" ลอย ๆ
      const left = unpaid(p).filter(x => x.status !== "BLOCKED");
      btns = left.length
        ? '<button class="btn pri" data-act="topay">ไปที่งวดที่ต้องจ่าย (' + left.length + ' งวด)</button>'
        : '<button class="btn ok" data-act="done">จ่ายครบแล้ว — ปิดขั้นทำจ่าย</button>';
    }
    else
      btns = '<button class="btn pri" data-act="done">ทำ “' + esc(s.n) + '” เสร็จ</button>';

    const over = p.age > s.sla;
    return '<div class="todo"><h3>งานนี้อยู่ที่คุณ<span>' +
      (over ? "เลยกำหนดแล้ว " + ageTxt(p.age - s.sla) : "เหลือเวลา " + ageTxt(Math.max(0, s.sla - p.age))) + "</span></h3>" +
      '<div class="big">' + esc(s.n) + "</div>" +
      '<div class="actions">' + btns + "</div>" + then + "</div>";
  }

  function pageDetail() {
    const p = POS.filter(x => x.no === openPo)[0];
    if (!p) return "<p>ไม่พบ PO</p>";
    const s = st(p), miss = missing(p);
    const bl = blockedBy(p);

    let h = '<button class="back" data-back="1">← กลับไปรายการ PO</button>';

    // 1) หัวเอกสาร — ซ่อนช่องเงินไปเลยสำหรับบทบาทที่ไม่มีสิทธิ์ (ดีกว่าโชว์ว่า "ดูไม่ได้")
    h += '<div class="dh"><div class="top"><span class="n">' + esc(p.no) + "</span>" + entryTag(p) +
      '<span class="t">' + esc(p.item) + "</span>" + statusPill(p) + "</div>" +
      '<div class="fields">' +
      (p.entry === "CASH"
        ? fld("ประเภทรายการ", "ซื้อเงินสด — ไม่ได้เปิด PO ใน B1")
        : fld("เลข PO ใน B1", p.sap || "ยังไม่ได้ดึงจาก B1", p.sap ? "B1" : "")) +
      fld("ผู้ขาย", p.sup, p.sap ? "B1" : "") +
      fld("จำนวน", p.qty, p.sap ? "B1" : "") +
      (money() ? fld("มูลค่า", baht(p.amt), p.sap ? "B1" : "") : "") +
      fld("เงื่อนไขจ่าย", p.term, p.sap ? "B1" : "") +
      fld("ผู้ดูแล", p.owner) + fld("วันที่เปิด", p.date) +
      // สายสินค้าเป็นตัวกำหนดว่าใบตรวจของ QC ใช้ชุดช่องไหน — ต้องเห็นบนหัวเอกสาร
      fld("สายสินค้า", MODULES[modOf(p)].n + " · ใบตรวจขึ้นต้น " + MODULES[modOf(p)].pfx + "-26xxxx") +
      // เกณฑ์ตรวจรับต้องเดินทางมาถึง QC ด้วย ไม่ใช่ค้างอยู่ในใบขอราคา
      (p.spec ? fld("เกณฑ์ตรวจรับ (สเปก)", p.spec, p.fromReq ? "ใบขอราคา" : "") : "") +
      "</div></div>";

    // รายการเงินสด — ต้องเห็นทันทีว่าทำไมถึงไม่มี PO และใครอนุมัติให้ข้าม QC
    if (p.entry === "CASH")
      h += '<div class="note warn" style="border:1px solid var(--gold);border-radius:var(--r-md);margin-bottom:16px">' +
        '<span><b>รายการซื้อเงินสด ไม่มี PO ใน B1</b> — ' +
        esc(p.cashWhy || "ไม่ได้ระบุเหตุผล") +
        (p.qcBypass
          ? "<br><b>ข้าม QC:</b> " + esc(p.qcBypassWhy || "—") + " · อนุมัติโดย <b>" +
            esc(p.qcBypassBy || "—") + "</b> — บันทึกถาวรและขึ้นในรายงานให้หัวหน้า QC เห็นทุกใบ"
          : "<br>ล็อตนี้ยัง<b>ต้องผ่าน QC ตามปกติ</b>") + "</span></div>";

    // ชุดเอกสารรวมเล่ม — สร้างอัตโนมัติเมื่อปิดรายการ
    if (p.bundle)
      h += '<div class="bundle"><div class="sp2"><b>ชุดเอกสารรวมเล่มพร้อมแล้ว</b> — ' +
        "รวม " + p.bundle.parts.length + " ใบเป็นไฟล์เดียว " + p.bundle.pages + " หน้า (~" +
        esc(p.bundle.mb) + " MB) เรียงตามลำดับขั้นตอน" +
        '<div class="fn">' + esc(DRIVE.folderOf(p)) + " / " + esc(p.bundle.name) + "</div>" +
        '<div class="sub">' + esc(p.bundle.parts.join(" · ")) + "</div>" +
        '<div class="sub">ต้นฉบับแต่ละใบยังอยู่ครบอีก ' + DRIVE.keepDays +
        " วัน แล้วระบบจะลบเฉพาะไฟล์ที่รวมเล่มไปแล้ว (ตั้งค่าได้ในหน้าตั้งค่า)</div></div>" +
        '<button class="btn ok">เปิดไฟล์รวม</button></div>';

    if (p.fromQuote)
      h += '<div class="note info" style="border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:16px">' +
        '<span>เปิดจากใบเสนอราคา <b><a href="#" data-propen="' + esc(p.fromReq) +
        '" style="color:inherit">' + esc(p.fromQuote) + "</a></b> — ราคาและจำนวนตรงกับที่เทียบไว้ ไม่ได้พิมพ์ใหม่</span></div>";

    // 2) ตอนนี้ต้องทำอะไร — อยู่บนสุดเสมอ ไม่ต้องเลื่อนหา
    //    นำหน้าด้วยใบส่งงานจากแผนกก่อนหน้า และคำเตือนเมื่อข้อมูลที่ต้องใช้ยังไม่มา
    // ลิงก์ใบตรวจ — QC เปิดจากที่นี่ได้ตลอด ไม่ต้องรอให้ถึงคิวตัวเอง
    if (role === "QC" && isActive(p) && qcAppUrl(p) && (st(p) || {}).c !== "QC_INCOMING")
      h += '<div class="note info" style="border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:16px">' +
        '<span>ต้องการเปิดใบตรวจของรายการนี้ไว้ก่อน — ' +
        qcAppBtn(p, "ไปที่แอปตรวจรับ " + MODULES[modOf(p)].n) + "</span></div>";

    h += handoffCard(p) + qcOpenCard(p) + missingCard(p) + todoCard(p);

    // 3) ความคืบหน้า
    h += '<div class="card"><h3>ความคืบหน้า<span class="c">' +
      (isActive(p) ? "ขั้นที่ " + (p.stage+1) + " จาก 17" : "จบแล้ว") + '</span></h3><div class="phases">';
    PHASES.forEach(ph => {
      const done = p.stage > ph.to || !isActive(p) && p.status === "COMPLETED";
      const now = isActive(p) && p.stage >= ph.from && p.stage <= ph.to;
      const total = ph.to - ph.from + 1;
      const prog = done ? 100 : now ? Math.round(((p.stage - ph.from + 1) / total) * 100) : 0;
      h += '<div class="pz ' + (done ? "done" : now ? "now" : "") + '">' +
        '<div class="t"><span>' + esc(ph.name) + "</span><span>" + (done ? "✓" : now ? prog + "%" : "") + "</span></div>" +
        '<div class="m">' + (now && s ? esc(s.n) : done ? "เสร็จแล้ว" : "ยังไม่ถึง") + "</div>" +
        '<div class="tr"><div class="fl" style="width:' + prog + '%"></div></div></div>';
    });
    h += "</div></div>";

    // 4) เอกสาร
    h += '<div class="card"><h3>เอกสาร<span class="c">' + (miss.length ? "ขาด " + miss.length + " ใบ" : "ครบ") + "</span></h3>";
    h += '<div class="rowline"><span class="nm">เก็บไว้ที่เดียว</span>' +
      '<span class="droot">' + esc(DRIVE.folderOf(p)) + "</span></div>";
    DOCS.forEach(d => {
      const stt = docState(p, d);
      if (stt === "na") return;
      const mine = d.o === role;
      const f = p.files[d.c];
      const badge = stt === "ok" ? '<span class="pill ok">มีแล้ว</span>'
        : stt === "wait" ? '<span class="pill ' + (mine ? "due" : "wait") + '">' +
            (mine ? "รอคุณอัพโหลด" : "รอ " + esc(ROLES[d.o] ? ROLES[d.o].name : d.o)) + "</span>"
        : '<span class="pill wait">ยังไม่ถึงคิว</span>';
      h += '<div class="rowline' + (stt === "wait" && d.req && mine ? " miss" : "") + '">' + dept(d.o) +
        '<span class="nm">' + esc(d.n) +
        (f ? '<div class="sub mono">' + esc(f.n) + "</div>" : "") +
        (f && f.note ? '<div class="sub">หมายเหตุ: ' + esc(f.note) + " — " + esc(f.by) + "</div>" : "") +
        "</span>" + badge +
        (stt === "wait" && mine && isActive(p) ? ' <button class="btn" data-up="' + esc(d.c) + '">อัพโหลด</button>' : "") + "</div>";
    });
    // หมายเหตุที่เขียนไว้ในป๊อปอัปของขั้นที่ไม่มีเอกสารบังคับ
    Object.keys(p.files).filter(k => k.indexOf("STEP_") === 0).forEach(k => {
      const f = p.files[k], sg = STAGES.filter(x => x.c === k.slice(5))[0];
      h += '<div class="rowline"><span class="nm">' + esc(sg ? sg.n : k.slice(5)) +
        '<div class="sub mono">' + esc(f.n) + "</div>" +
        (f.note ? '<div class="sub">หมายเหตุ: ' + esc(f.note) + " — " + esc(f.by) + "</div>" : "") +
        '</span><span class="pill ok">แนบแล้ว</span></div>';
    });
    h += '<div class="note info"><span>ทุกไฟล์ของทุกแผนกอยู่ใน<b>ไดรฟ์กลางที่เดียว</b> (' +
      esc(DRIVE.root) + ") — อัพจากหน้านี้ ระบบตั้งชื่อและวางโฟลเดอร์ให้เอง " +
      "ไม่ต้องเปิด Drive ไม่ต้องสร้างโฟลเดอร์ และไม่มีไฟล์ค้างอยู่ในเครื่องใคร" +
      (p.bundle ? "" : "<br>เมื่อทุกขั้นตอนเสร็จ ระบบจะ<b>รวมทุกใบเป็นไฟล์เดียว</b>ให้อัตโนมัติ") +
      "</span></div></div>";

    // 5) การจ่ายเงิน
    if (money()) h += payReqCard(p) + paymentCard(p);

    // 6) ตรวจสอบก่อนบันทึก — แสดงเต็มเฉพาะช่วงตั้งหนี้/จ่าย หรือเมื่อมีข้อติดจริง
    const nearClose = p.stage >= PHASES[2].from || !isActive(p);
    if (nearClose || bl.length) h += checksCard(p);
    else h += '<div class="note info" style="border:1px solid var(--line);margin-bottom:16px">' +
      '<span>ยังอยู่ช่วง' + esc(phaseOf(p).name) +
      " — ระบบจะตรวจครบทุกข้อให้อัตโนมัติเมื่อถึงขั้นตั้งหนี้ ตอนนี้ยังไม่ต้องสนใจ</span></div>";

    // 7-8) รายละเอียดที่เปิดดูเมื่อต้องการ
    h += '<details class="blk"><summary>17 ขั้นตอนโดยละเอียด<span class="c">เปิดเมื่ออยากดูทั้งกระบวนการ</span></summary><div class="steps">';
    STAGES.forEach((sg, i) => {
      const cls = p.skip.indexOf(i) >= 0 ? "skip" : i < p.stage ? "done" : i === p.stage && isActive(p) ? "now" : "";
      h += '<div class="step ' + cls + '"><span class="i">' + (i+1) + "</span>" +
        '<span class="nm">' + esc(sg.n) + "</span>" + dept(sg.o) + "</div>";
    });
    h += "</div></details>";

    h += '<details class="blk"><summary>ประวัติ<span class="c">' + p.tl.length + ' รายการ</span></summary><div class="tl">' +
      p.tl.slice().reverse().map(e => '<div class="e"><time>' + esc(e[0]) + "</time><div><b>" +
        esc(e[1]) + "</b> " + esc(tlText(e[2])) + "</div></div>").join("") + "</div></details>";
    return h;
  }
  function fld(k, v, src) {
    return '<div class="f"><div class="k">' + esc(k) +
      (src ? '<span class="src">' + esc(src) + "</span>" : "") +
      '</div><div class="v">' + esc(v) + "</div></div>";
  }

  function payButtons(p, x) {
    if (!isActive(p) && x.status !== "PAID") return "";
    // งวดที่ชำระผ่าน LC ไม่ผ่านมือเรา — ไม่ให้ตั้งเรื่อง ไม่ให้บันทึกจ่าย กันคนกดแล้วจ่ายซ้ำกับธนาคาร
    if (isLC(x))
      return '<span class="hint">ธนาคารจ่ายตามเอกสาร LC — ไม่ต้องตั้งเบิกที่นี่</span>';
    const b = (act, cls, t) => '<button class="btn ' + cls + '" data-payact="' + act + '" data-seq="' + x.seq + '">' + t + "</button>";
    if (role === "AC") {
      if (x.status === "PENDING")  return b("req", "pri", "ตั้งเรื่องขอจ่าย");
      if (x.status === "APPROVED") return b("form", "ok", "บันทึกการจ่าย");
      if (x.status === "FAILED")   return b("form", "ok", "ทำจ่ายใหม่");
      if (x.status === "PAID")     return b("void", "bad", "กลับรายการ");
    }
    // ผู้อนุมัติต้องไม่ใช่ผู้ตั้งเรื่อง — ในตัวอย่างนี้บัญชีตั้งเรื่อง ผู้บริหารอนุมัติ
    if (x.status === "REQUESTED") {
      const mineToApprove = role === (x.reqTo || PAY_APPROVER);
      if (!mineToApprove) return "";
      // ถ้ามีใบขออนุมัติเต็มอยู่ด้านบนแล้ว ไม่ให้กดอนุมัติจากแถวในตาราง — ต้องอ่านใบก่อน
      if (x.reqNo) return '<span class="hint">ดูใบขออนุมัติ ' + esc(x.reqNo) + " ด้านบน</span>";
      return b("apv", "ok", "อนุมัติจ่าย") + " " + b("rej", "bad", "ตีกลับ");
    }
    return "";
  }

  // สร้างแจ้งเตือนใหม่เข้ากล่อง — ใช้กับเรื่องที่ไม่ได้ผูกกับ "เจ้าของขั้น" เช่นคำขออนุมัติ
  function notify(to, lv, ref, t, b) {
    const now = new Date();
    NOTIFS.unshift({id:Math.max.apply(null, NOTIFS.map(n => n.id).concat([0])) + 1,
      to:to, lv:lv, ch:lv === "act" ? "Lark" : "Lark", read:false, ref:ref, t:t, b:b,
      tm:(now.getHours() < 10 ? "0" : "") + now.getHours() + ":" +
         (now.getMinutes() < 10 ? "0" : "") + now.getMinutes()});
  }

  /* ============ ใบขออนุมัติทำจ่าย ============
     ปัญหาที่แก้: ผู้อนุมัติเห็นแค่ปุ่ม "อนุมัติจ่าย" ในตาราง ไม่มีอะไรอ้างอิงเลย
     กดอนุมัติทั้งที่ไม่รู้ว่ากำลังอนุมัติอะไร ใครขอ เอกสารครบไหม
     ตอนนี้ทุกคำขอมีใบของตัวเอง เลขที่ ผู้ขอ ยอด วันที่มีผล เอกสารแนบ และผลตรวจที่ระบบทำให้แล้ว */
  const REQ_ST = {PENDING:{t:"รอคุณอนุมัติ", cls:"due"}, APPROVED:{t:"อนุมัติแล้ว", cls:"ok"},
                  REJECTED:{t:"ตีกลับแล้ว", cls:"late"}};

  // เอกสารที่แนบไปกับคำขอ — ดึงจากไดรฟ์กลางให้เอง ผู้ขอไม่ต้องแนบทีละใบ
  // เอกสารที่แนบไปกับคำขอ — เอกสารเรียกเก็บของงวดนั้นต้องอยู่บนสุดเสมอ ผู้อนุมัติจะได้เห็นก่อน
  function reqDocs(p, x) {
    const out = [];
    if (x && x.billFile)
      out.push({n:BILLDOC[billKind(x)].n + " เลขที่ " + x.billNo +
        " · " + baht(x.billAmt) + " (งวดที่ " + x.seq + ")", fn:x.billFile.n, by:x.billFile.by});
    DOCS.forEach(d => {
      if (docState(p, d) === "na") return;
      const f = p.files[d.c];
      if (f) out.push({n:d.n, fn:f.n, by:f.by});
      else if (docState(p, d) === "ok") out.push({n:d.n, fn:DRIVE.fileName(p, d.c, "scan.pdf"), by:"—"});
    });
    Object.keys(p.files).filter(k => k.indexOf("STEP_") === 0).forEach(k => {
      const sg = STAGES.filter(x => x.c === k.slice(5))[0];
      out.push({n:"บันทึกขั้น " + (sg ? sg.n : ""), fn:p.files[k].n, by:p.files[k].by});
    });
    return out;
  }

  function payReqCard(p) {
    const x = p.payments.filter(y => y.reqNo && ["REQUESTED","APPROVED"].indexOf(y.status) >= 0)[0] ||
              p.payments.filter(y => y.reqNo && y.reqSt === "REJECTED")[0];
    if (!x) return "";
    const stt = x.status === "REQUESTED" ? "PENDING" : x.reqSt === "REJECTED" ? "REJECTED" : "APPROVED";
    const s = REQ_ST[stt];
    const isApprover = role === (x.reqTo || PAY_APPROVER);
    const canAct = stt === "PENDING" && isApprover && x.reqBy !== ROLES[role].person;
    const docs = x.reqDocs || reqDocs(p, x);
    const cs = checksOf(p).filter(c => c.tag !== "paid" && (c.lv === "block" || !c.ok));

    let h = '<div class="apv"><div class="ah"><span class="rno">' + esc(x.reqNo) + "</span>" +
      '<span style="font-size:13px;font-weight:600">ใบขออนุมัติทำจ่าย</span>' +
      '<span class="sp2"></span><span class="pill ' + s.cls + '">' + esc(s.t) + "</span></div>" +
      '<div class="ab">' +
      '<div class="seg"><div>' +
        '<div class="amt">' + baht(x.amount) + "<small>ยอดที่ขออนุมัติ · งวดที่ " + x.seq + " " +
          esc(x.type) + "</small></div></div><div>" +
        '<div class="amt" style="font-size:18px">' + esc(x.due || "—") +
          "<small>Effective date — วันที่ต้องมีผลจ่าย</small></div></div></div>" +

      '<div class="who" style="margin-top:12px">ผู้ขอ <b>' + esc(x.reqBy || "—") + "</b> (" +
        esc(ROLES[x.reqRole] ? ROLES[x.reqRole].name : "จัดซื้อ") + ") · " + esc(x.reqAt || "—") +
        "<br>ส่งถึง <b>" + esc(ROLES[x.reqTo] ? ROLES[x.reqTo].name : "ผู้จัดการ") + " (" +
        esc(person(x.reqTo || PAY_APPROVER)) + ")</b> — ทุกยอดต้องผ่านผู้จัดการ ไม่มีเกณฑ์วงเงินยกเว้น" +
        "<br>ผู้บันทึกจ่ายจะเป็น <b>" + esc(person("AC")) +
        "</b> — คนละคนกับผู้อนุมัติ ตามหลักแยกหน้าที่</div>";

    // เอกสารเรียกเก็บของงวดนี้ — สิ่งแรกที่ผู้อนุมัติต้องเห็น ไม่ใช่ต้องไปหาในรายการเอกสาร
    if (x.billNo)
      h += '<div class="sec">งวดนี้เรียกเก็บด้วยเอกสารใบไหน</div>' +
        '<div class="dl"><span><b>' + esc(BILLDOC[billKind(x)].n) + "</b> เลขที่ " +
          esc(x.billNo) + " · ยอดตามใบ " + baht(x.billAmt) +
          (x.billAmt > x.amount + 1
            ? '<br><span class="sub">งวดนี้ขอจ่าย ' + baht(x.amount) + " จากยอดในใบ " + baht(x.billAmt) +
              " — ที่เหลือเรียกเก็บงวดถัดไป</span>" : "") + "</span>" +
        '<span class="fn">' + esc(x.billFile ? x.billFile.n : "—") + "</span></div>";
    else
      h += '<div class="sec">งวดนี้เรียกเก็บด้วยเอกสารใบไหน</div>' +
        '<div class="ck no"><span class="m">✕</span><span>ไม่มีเอกสารเรียกเก็บผูกกับงวดนี้ — ไม่ควรอนุมัติ</span></div>';

    if (x.effNote)
      h += '<div class="sec">ข้อความที่ผู้ขอประทับลงบน' + esc(x.stampOn || "เอกสารที่แนบ") +
        (x.stampPos ? " · ตำแหน่ง " + Math.round(x.stampPos.x) + "/" + Math.round(x.stampPos.y) +
          " ที่ผู้ขอวางเอง" : "") + "</div>" +
        '<div class="stamp">' + esc(x.effNote) + "</div>";

    h += '<div class="sec">เอกสารประกอบ ' + docs.length + " ใบ — ระบบแนบให้จากไดรฟ์กลาง</div>";
    if (!docs.length) h += '<div class="ck no"><span class="m">✕</span><span>ไม่มีเอกสารแนบ — ไม่ควรอนุมัติ</span></div>';
    else docs.forEach(d => {
      h += '<div class="dl"><span>' + esc(d.n) + "</span>" +
        '<span class="fn">' + esc(d.fn) + "</span></div>";
    });

    h += '<div class="sec">ระบบตรวจให้แล้วก่อนถึงคุณ</div>';
    cs.forEach(c => {
      const cls = c.ok ? "ok" : c.lv === "block" ? "no" : "wn";
      h += '<div class="ck ' + cls + '"><span class="m">' + (c.ok ? "✓" : c.lv === "block" ? "✕" : "!") +
        "</span><span>" + esc(c.t) + (c.who && !c.ok ? " — ต้องแก้ที่ " + esc(c.who) : "") + "</span></div>";
    });

    if (stt === "APPROVED")
      h += '<div class="ck ok" style="margin-top:12px"><span class="m">✓</span><span><b>อนุมัติโดย ' +
        esc(x.apvBy || "—") + "</b> " + esc(x.apvAt || "") + " — บัญชีบันทึกการจ่ายได้แล้ว</span></div>";
    if (stt === "REJECTED")
      h += '<div class="ck no" style="margin-top:12px"><span class="m">✕</span><span><b>ตีกลับโดย ' +
        esc(x.rejBy || "—") + "</b> " + esc(x.rejAt || "") + "<br>เหตุผล: " + esc(x.rejWhy || "—") +
        "</span></div>";

    if (canAct)
      h += '<div class="acts"><button class="btn ok" data-payact="apv" data-seq="' + x.seq + '">' +
        "อนุมัติจ่าย " + baht(x.amount) + "</button>" +
        '<button class="btn bad" data-payact="rej" data-seq="' + x.seq + '">ตีกลับพร้อมเหตุผล</button></div>';
    else if (stt === "PENDING")
      h += '<div class="acts"><span class="hint">รอ ' +
        esc(person(x.reqTo || PAY_APPROVER)) + " กดอนุมัติ — คุณดูได้แต่กดแทนไม่ได้</span></div>";

    return h + "</div></div>";
  }

  function paymentCard(p) {
    if (!p.payments.length) return "";
    const paidRows = p.payments.filter(x => x.status === "PAID");
    const paid = paidRows.reduce((s, x) => s + x.amount, 0);
    const late = unpaid(p).filter(x => x.status !== "BLOCKED").length;

    let h = '<div class="card"><h3>การจ่ายเงิน<span class="c">' + esc(p.term) +
      " · จ่ายแล้ว " + baht(paid) + " จาก " + baht(p.amt) + "</span></h3>" +
      '<div class="tw"><table><thead><tr><th>งวด</th><th>ประเภท</th>' +
      '<th class="num">จำนวนเงิน</th><th>เอกสารเรียกเก็บ</th><th>ครบกำหนด</th><th>วันที่จ่าย</th>' +
      "<th>อ้างอิงธนาคาร</th><th>สถานะ</th><th></th></tr></thead><tbody>";

    p.payments.forEach(x => {
      const s = PAY_ST[x.status] || PAY_ST.PENDING;
      const dueCell = '<span class="mono">' + esc(x.due) + "</span>" +
        (x.lateDays > 0 ? '<div class="sub" style="color:var(--stop)">จ่ายช้า ' + x.lateDays + " วัน</div>" : "");
      const payCell = x.paidAt
        ? '<span class="mono">' + esc(x.paidAt) + "</span>" +
          (x.valueDate && x.valueDate !== x.paidAt ? '<div class="sub">ตัดเงิน ' + esc(x.valueDate) + "</div>" : "")
        : '<span class="sub">—</span>';
      // แต่ละงวดต้องมีเอกสารเรียกเก็บของตัวเอง — งวดมัดจำใช้ PI งวดที่เหลือใช้ใบแจ้งหนี้
      const billCell = x.billNo
        ? '<span class="mono" style="font-size:12px">' + esc(x.billNo) + "</span>" +
          '<div class="sub">' + esc(BILLDOC[billKind(x)].n.split(" ")[0]) +
          (x.billAmt ? " · " + baht(x.billAmt) : "") + "</div>"
        : x.status === "PAID"

      h += '<div class="note warn"><span>ยังเหลือ ' + late +

  /* ================= รายงาน ================= */
  /* ============ คิวตั้งเบิกทำจ่าย ============
     ยกมาจาก Dashboard แยกที่เคยทำไว้ — ทีมยืนยันว่าต้องมีระบบเดียว จึงย้ายมาอยู่ในหน้ารายงาน
     อ่านจาก POS ที่มีอยู่ ไม่มีชุดข้อมูลของตัวเอง จึงไม่มีทางไม่ตรงกับหน้าอื่น
     งวดที่ชำระผ่าน LC ไม่อยู่ในคิวนี้ เพราะธนาคารจ่ายตามเอกสาร ไม่ต้องตั้งเบิก */
  function payDue() {
    const out = [];
    POS.filter(isActive).forEach(p => p.payments.forEach(x => {
      if (DONE_PAY.indexOf(x.status) >= 0) return;
      out.push({p:p, x:x, mod:modOf(p), iso:thToISO(x.due) || "9999-99-99"});
    }));
    return out.sort((a, b) => a.iso.localeCompare(b.iso));
  }
  function payQueueCard() {
    let list = payDue();
    if (payQ) list = list.filter(r => r.mod === payQ);
    const kw = String(payQKw || "").trim().toLowerCase();
    if (kw) list = list.filter(r =>
      (r.p.no + " " + r.p.sup + " " + r.p.term).toLowerCase().indexOf(kw) >= 0);

    const all = payDue(), cnt = m => all.filter(r => r.mod === m).length;
    const tot = {};
    list.forEach(r => { tot[r.p.cur] = (tot[r.p.cur] || 0) + r.x.amount; });
    const lc = [];
    POS.filter(isActive).forEach(p => p.payments.forEach(x => { if (isLC(x)) lc.push({p:p, x:x}); }));

    let h = '<div class="card"><h3>คิวตั้งเบิกทำจ่าย<span class="c">' + list.length + " งวด" +
      (money() && Object.keys(tot).length
        ? " · " + Object.keys(tot).sort().map(c => baht(tot[c]) + " " + c).join(" · ") : "") +
      "</span></h3>" +
      '<div class="toolbar"><input type="search" id="payq" placeholder="ค้นหาเลข PO · ผู้ขาย · เงื่อนไขจ่าย" value="' +
        esc(payQKw) + '">' +
      '<div class="chips2">' +

          "<td>" + esc(r.p.sup) + "</td>" +

            (/^UNKNOWN$/i.test(r.p.term) ? ' <span class="pill late">รอยืนยัน</span>' : "") + "</td>" +
          "<td>" + r.x.seq + " · " + esc(r.x.type) + "</td>" +
          (money() ? '<td class="num">' + baht(r.x.amount) + " " + esc(r.p.cur) + "</td>" : "") +
          '<td><span class="pill ' + s2.cls + '">' + esc(s2.t) + "</span></td></tr>";

    if (lc.length)
      h += '<div class="note info"><span><b>ไม่รวมงวดที่ชำระผ่าน LC ' +
        lc.length + " งวด</b> — ธนาคารจ่ายตามเอกสารเลตเตอร์ออฟเครดิต ไม่ต้องตั้งเบิกที่นี่ " +
        "แต่ยังอยู่ในรายการของ PO เพื่อให้ยอดรวมงวดเท่ามูลค่า PO</span></div>";
    return h + "</div>";
  }

  function pageReport() {
    const act = POS.filter(isActive);
    const agg = {};
    act.forEach(p => {
      const s = st(p); if (!s) return;
      (agg[s.c] = agg[s.c] || {n:s.n, o:s.o, cnt:0, sum:0, late:0, sla:s.sla});
      agg[s.c].cnt++; agg[s.c].sum += p.age;
      if (p.age > s.sla) agg[s.c].late++;
    });
    const rows = Object.keys(agg).map(k => {
      const a = agg[k]; a.avg = Math.round(a.sum / a.cnt); a.score = a.cnt * a.avg; return a;
    }).sort((x,y) => y.score - x.score);
    const max = rows.length ? rows[0].score : 1;

    let h = '<div class="ph"><h1>รายงาน</h1><span class="d">งานค้างอยู่ที่ขั้นตอนไหน — ข้อมูลที่ตอนนี้ยังไม่มีใครรู้</span></div>';
    h += payQueueCard();
    h += '<div class="card"><h3>อันดับคอขวด</h3><div class="bars">';
    rows.forEach(a => {
      h += '<div class="bar' + (a.late ? " r" : "") + '"><div>' + esc(a.n) + " " + dept(a.o) + "</div>" +
        '<div class="tr"><div class="fl" style="width:' + Math.round(a.score/max*100) + '%"></div></div>' +
        '<div class="v">' + a.cnt + " PO · " + a.avg + " ชม.</div></div>";
    });
    h += "</div></div>";

    if (money()) {
      const all = [];
      POS.forEach(p => p.payments.forEach(x => all.push({p:p, x:x})));
      const paid = all.filter(r => r.x.status === "PAID");
      const onTime = paid.filter(r => r.x.lateDays <= 0).length;
      const owed = all.filter(r => DONE_PAY.indexOf(r.x.status) < 0 && isActive(r.p));
      const owedSum = owed.reduce((s, r) => s + r.x.amount, 0);
      const blocked = owed.filter(r => r.x.status === "BLOCKED");
      const waitApv = owed.filter(r => r.x.status === "REQUESTED");

      h += '<div class="card"><h3>การจ่ายเงิน<span class="c">ได้มาจากวันที่ที่บันทึกไว้ ไม่ต้องกรอกเพิ่ม</span></h3>' +
        '<div class="kpis" style="margin:0;border:0">' +
        '<div class="kpi g"><div class="n">' + (paid.length ? Math.round(onTime / paid.length * 100) : 0) +
          '%</div><div class="k">จ่ายตรงเวลา (' + onTime + "/" + paid.length + " งวด)</div></div>" +
        '<div class="kpi a"><div class="n">' + owed.length + '</div><div class="k">งวดที่ยังไม่จ่าย</div></div>' +
        '<div class="kpi b"><div class="n">' + baht(owedSum).replace("฿","") + '</div><div class="k">ยอดค้างจ่าย</div></div>' +
        '<div class="kpi r"><div class="n">' + blocked.length + '</div><div class="k">ถูกล็อกจากเคลม</div></div>' +
        '<div class="kpi"><div class="n">' + waitApv.length + '</div><div class="k">รออนุมัติจ่าย</div></div></div>';
      if (blocked.length)
        h += '<div class="note bad"><span>ถูกล็อกจากเคลม ' +
          baht(blocked.reduce((s, r) => s + r.x.amount, 0)) + " — ปิดเคลมที่กระทบเงินมากสุดก่อน</span></div>";
      h += "</div>";
    }

    const done = POS.filter(p => p.status === "COMPLETED");
    h += '<div class="kpis">' +
      '<div class="kpi b"><div class="n">' + act.length + '</div><div class="k">กำลังดำเนินการ</div></div>' +
      '<div class="kpi g"><div class="n">' + done.length + '</div><div class="k">ปิดแล้ว</div></div>' +
      '<div class="kpi r"><div class="n">' + CLAIMS.filter(c=>!c.cn).length + '</div><div class="k">เคลมค้าง</div></div>' +
      (money() ? '<div class="kpi a"><div class="n">' + baht(act.reduce((s,p)=>s+p.amt,0)).replace("฿","") +
        '</div><div class="k">มูลค่า PO ที่ยังไม่ปิด</div></div>' : "") + "</div>";
    return h;
  }

  /* ================= ตรวจสอบก่อนบันทึก ================= */
  /* เทียบจำนวนแบบรู้หน่วย — ใบตรวจอาหารนับเป็น "2,600 CTNs" คลังอาจพิมพ์ "2600 CTN"
     เทียบด้วยข้อความตรง ๆ จะฟ้องผิดทุกครั้ง แต่ถ้าตัดหน่วยทิ้งก็จะปล่อย KG/CTN ผ่านไปได้ */
  const UNIT_ALIAS = {ctns:"ctn", cartons:"ctn", carton:"ctn", กล่อง:"ctn", kgs:"kg", กก:"kg",
    กิโลกรัม:"kg", pcs:"pc", pieces:"pc", piece:"pc", ชิ้น:"pc", ตัว:"pc"};
  function qtyParts(v) {
    const s = String(v == null ? "" : v).trim().toLowerCase().replace(/,/g, "");
    const m = s.match(/-?\d+(\.\d+)?/);
    const u = s.replace(/-?\d+(\.\d+)?/g, " ").replace(/[()]/g, " ").trim().split(/\s+/)[0] || "";
    return {n:m ? parseFloat(m[0]) : null, u:UNIT_ALIAS[u] || u};
  }
  function cmpQty(a, b) {
    const x = qtyParts(a), y = qtyParts(b);
    if (x.n === null || y.n === null)
      return {same:String(a).trim() === String(b).trim(), unit:true};
    return {same:x.n === y.n && x.u === y.u, unit:x.n !== y.n};   // unit:false = เลขตรง หน่วยไม่ตรง
  }

  function checksOf(p) {
    const miss = missing(p), out = [];
    const add = (ok, lv, t, who, tag) => out.push({ok:ok, lv:lv, t:t, who:who || "", tag:tag || ""});

    // รายการซื้อเงินสดไม่มี PO ใน B1 ตามนิยาม — ใช้เกณฑ์คนละชุด ไม่งั้นปิดบัญชีไม่ได้ตลอดไป
    if (p.entry === "CASH")
      add(!!String(p.cashWhy || "").trim(), "block",
          p.cashWhy ? "รายการเงินสด — บันทึกเหตุผลที่ไม่เปิด PO ไว้แล้ว" :
                      "รายการเงินสดแต่ไม่มีเหตุผลที่ไม่เปิด PO", "SR");
    else
      add(!!p.sap, "block",
          p.sap ? "ผูกกับ PO ใน B1 แล้ว (DocNum " + p.sap + ")" : "ยังไม่ได้ผูกกับ PO ใน B1", "SR");
    add(!miss.length, "block",
        miss.length ? "ขาดเอกสาร " + miss.length + " ใบ — " + miss.map(d => d.n).join(", ") : "เอกสารบังคับครบทุกใบ",
        miss.length ? miss[0].o : "");
    add(!p.claim, "block", p.claim ? "มีใบเคลมที่ยังไม่ได้รับใบลดหนี้" : "ไม่มีใบเคลมค้าง", "QC");

    // ข้อค้างท้ายใบตรวจ — ใบผ่านแล้วแต่ยังคุยกับผู้ขายไม่จบ ต้องไม่หลุดไปปิดบัญชี
    const qLeft = qcOpenLeft(p);
    if ((p.qcOpen || []).length)
      add(!qLeft.length, qcPayHold(p).length ? "block" : "warn",
          qLeft.length ? "ข้อค้างจากใบตรวจยังไม่สรุป " + qLeft.length + " ข้อ — " + esc(qLeft[0].t)
                       : "ข้อค้างจากใบตรวจสรุปครบแล้วทุกข้อ", "SR");

    // เลข PO ที่พิมพ์บนใบตรวจกับเลขในระบบ — ใบตรวจฝั่งเครื่องจักรใช้เลขรับของ (RC) คนละชุดกับเลข PO
    const pref = p.hand.qcPoRef;
    if (pref && (p.sap || p.no)) {
      const hit = String(pref).indexOf(p.sap || "@@") >= 0 || String(pref).indexOf(p.no) >= 0;
      add(hit, "warn",
          hit ? "PO Ref บนใบตรวจตรงกับรายการนี้ (" + esc(pref) + ")"
              : "PO Ref บนใบตรวจคือ " + esc(pref) + " แต่รายการนี้คือ " +
                esc(p.sap ? "PO " + p.sap : p.no) + " — ยืนยันว่าเป็นล็อตเดียวกันก่อนตั้งหนี้", "QC");
    }

    if (money()) {
      // เงื่อนไขชำระที่ SAP ส่งมาว่าง — ยังตั้งเบิกได้ แต่ต้องมีคนยืนยันก่อน ไม่ใช่เดาเอง
      if (/^UNKNOWN$/i.test(String(p.term || "")))
        add(false, "warn", "เงื่อนไขชำระจาก SAP ว่าง (UNKNOWN) — ให้จัดซื้อยืนยันก่อนขออนุมัติจ่าย", "SR");
      // ยอดเป็นศูนย์มักเป็นตัวอย่างสินค้าที่ผู้ขายไม่คิดเงิน แต่ต้องมีคนดูก่อนตั้งเบิกเสมอ
      const zero = p.payments.filter(x => x.amount === 0 && x.status !== "CANCELLED").length;
      if (zero)
        add(false, "warn", "มีงวดยอดเป็นศูนย์ " + zero + " งวด — ตรวจก่อนตั้งเบิกว่าถูกต้อง", "AC");

      const sum = p.payments.reduce((s, x) => s + x.amount, 0);
      add(!p.payments.length || sum === p.amt, "block",
          sum === p.amt ? "ผลรวมงวดจ่ายเท่ากับมูลค่า PO" : "งวดจ่ายรวม " + baht(sum) + " ไม่เท่ากับมูลค่า PO " + baht(p.amt), "AC");

      // ตรวจ 3 ทางต้องเทียบกับ "จำนวนที่ QC รับได้" ไม่ใช่จำนวนที่ส่งมา
      const qOk = p.hand.qtyOk, qIn = p.hand.qtyIn;
      if (qOk && qIn) {
        const c = cmpQty(qOk, qIn);
        add(c.same, c.unit ? "block" : "warn",
            c.same ? "จำนวนที่ QC รับได้ตรงกับที่คลังรับเข้า (" + esc(String(qOk).trim()) + ")"
              : !c.unit
                ? "จำนวนเท่ากันแต่หน่วยไม่ตรง — QC เขียน " + esc(String(qOk).trim()) +
                  " คลังเขียน " + esc(String(qIn).trim()) + " ให้ใช้หน่วยเดียวกัน"
                : "QC รับได้ " + esc(String(qOk).trim()) + " แต่คลังรับเข้า " + esc(String(qIn).trim()) +
                  " — ต้องตรงกันก่อนตั้งหนี้",
            "WH");
        // ใบตรวจเทียบจำนวนตามใบแจ้งหนี้กับที่นับได้จริงมาแล้ว — ยกผลมาให้บัญชีเห็นด้วย
        if (p.hand.invQty) {
          const ci = cmpQty(p.hand.invQty, qOk);
          add(ci.same, "warn",
              ci.same ? "จำนวนตามใบแจ้งหนี้ตรงกับที่ QC นับได้ (" + esc(String(qOk).trim()) + ")"
                      : "ใบแจ้งหนี้แจ้ง " + esc(String(p.hand.invQty).trim()) + " แต่ QC นับได้ " +
                        esc(String(qOk).trim()) + " — ตั้งหนี้ตามจำนวนที่นับได้", "AC");
        }
      }
      else if (p.qcBypass)
        add(true, "block", "ล็อตนี้ข้าม QC ตามที่อนุมัติไว้ (" + esc(p.qcBypassBy || "—") +
            ") — เทียบกับจำนวนที่คลังรับเข้าแทน", "");
      else if (p.stage >= 12)
        add(false, "warn", "ยังไม่มีจำนวนที่ QC รับได้หรือจำนวนที่คลังรับเข้า — เทียบ 3 ทางไม่ได้",
            !qOk ? "QC" : "WH");

      const invAmt = p.hand.invAmt != null ? p.hand.invAmt : p.inv;
      if (invAmt != null) {
        const diff = Math.abs(invAmt - p.amt), pct = p.amt ? diff / p.amt * 100 : 0;
        if (pct > 5) add(false, "block", "ยอดใบแจ้งหนี้ต่างจาก PO " + baht(diff) + " (" + pct.toFixed(1) + "%) เกินเกณฑ์ 5%", "SR");
        else if (pct > 2) add(false, "warn", "ยอดใบแจ้งหนี้ต่างจาก PO " + baht(diff) + " (" + pct.toFixed(1) + "%) — ต้องระบุเหตุผล", "AC");
        else add(true, "block", "ยอดใบแจ้งหนี้ตรงกับ PO (" + baht(invAmt) + ")", "");
      } else add(false, "warn", "ยังไม่ได้รับใบแจ้งหนี้", "AC");

      const nLC = p.payments.filter(isLC).length;
      add(unpaid(p).length === 0, "block",
          unpaid(p).length ? "ยังจ่ายไม่ครบ " + unpaid(p).length + " งวด"
            : "จ่ายครบทุกงวดและมีสลิปครบ" +
              (nLC ? " (" + nLC + " งวดชำระผ่าน LC ธนาคารจ่ายตามเอกสาร)" : ""),
          "AC", "paid");
    }
    return out;
  }
  const blockedBy = p => checksOf(p).filter(c => !c.ok && c.lv === "block");

  function checksCard(p) {
    const cs = checksOf(p), bl = cs.filter(c => !c.ok && c.lv === "block"), wn = cs.filter(c => !c.ok && c.lv === "warn");
    let h = '<div class="card"><h3>ตรวจสอบก่อนบันทึก<span class="c">' +
      (bl.length ? "ติด " + bl.length + " ข้อ" : wn.length ? "ผ่าน · มีข้อควรระวัง " + wn.length : "ผ่านทั้งหมด") + "</span></h3>";
    cs.forEach(c => {
      h += '<div class="chk ' + (c.ok ? "pass" : c.lv) + '"><span class="m">' +
        (c.ok ? "✓" : c.lv === "block" ? "✕" : "!") + "</span><span>" + esc(c.t) + "</span>" +
        '<span class="who">' + (c.ok || !c.who ? "" : "แก้ที่ " + esc(ROLES[c.who] ? ROLES[c.who].name : c.who)) + "</span></div>";
    });
    h += '<div class="note ' + (bl.length ? "bad" : "good") + '"><span>' +
      (bl.length ? "<b>ยังปิด PO ไม่ได้</b> — ระบบแสดงทุกข้อที่ติดพร้อมกัน ไม่ใช่ทีละข้อ และบอกเสมอว่าใครต้องเป็นคนแก้"
                 : "<b>พร้อมบันทึกบัญชี</b> — ตรวจ 3 ทางเทียบกับ<b>จำนวนที่ QC รับ</b> ไม่ใช่จำนวนที่ส่งมา") +
      "</span></div></div>";
    return h;
  }

      '<div class="fld"><span class="lbl">เหตุผล (เมื่อยอดไม่ตรงกับที่คำนวณ)</span>' +

      "</div></details>" +

      '<div class="errbox" id="py_err"></div>' +

    payTouched = {amt:false, wht:false};

  }

  function payCalc() {
    const t = payTarget(); if (!t) return;
    const x = t.x, p = t.p;
    const wr = WHT[valOf("py_whttype")] || WHT.GOODS;

    if (!payTouched.wht) {
      const e = document.getElementById("py_wht");
      if (e) e.value = (x.amount * wr.r / 100).toFixed(2);
    }
    const wht = numOf("py_wht"), fee = numOf("py_fee"), feeBy = valOf("py_feeby");
    const expect = x.amount - wht + (feeBy === "OUR" ? fee : 0);
    const net    = x.amount - wht - (feeBy === "SUPPLIER" ? fee : 0);
    if (!payTouched.amt) {
      const e = document.getElementById("py_amt");
      if (e) e.value = expect.toFixed(2);
    }
    const amt = numOf("py_amt"), diff = amt - expect;

    const cb = document.getElementById("py_calc");
    if (cb) cb.innerHTML =
      '<div class="cl"><span>ยอดตามงวด</span><span>' + baht(x.amount) + "</span></div>" +
      '<div class="cl"><span>− ภาษีหัก ณ ที่จ่าย (' + wr.r + "%)</span><span>" + baht(wht) + "</span></div>" +
      '<div class="cl"><span>' + (feeBy === "OUR" ? "+" : "−") + " ค่าธรรมเนียมโอน (" +
        (feeBy === "OUR" ? "บริษัทรับภาระ" : "ผู้ขายรับภาระ") + ")</span><span>" + baht(fee) + "</span></div>" +
      '<div class="cl tot"><span>ยอดที่ควรตัดจากบัญชี</span><span>' + baht(expect) + "</span></div>" +
      '<div class="cl"><span>ผู้ขายได้รับ</span><span>' + baht(net) + "</span></div>";

    // กฎตรวจสอบ P1–P11
    const errs = [], warns = [];
    const d = valOf("py_date"), vd = valOf("py_value"), ref = valOf("py_ref").trim();
    const today = todayISO();

    if (!d) errs.push("ต้องระบุวันที่จ่าย");
    else if (dayDiff(d, today) > 0) errs.push("P1 · วันที่จ่ายเป็นวันข้างหน้า — บันทึกได้เมื่อจ่ายจริงแล้ว");
    if (vd && d && dayDiff(vd, d) < 0) errs.push("P2 · วันที่ธนาคารตัดเงินต้องไม่ก่อนวันที่จ่าย");
    if (amt <= 0) errs.push("P3 · จำนวนเงินต้องมากกว่า 0");
    if (wr.r > 15) errs.push("P4 · อัตราหัก ณ ที่จ่ายผิดปกติ");
    if (!document.getElementById("py_slip") || !document.getElementById("py_slip").checked)
      errs.push("P5 · ต้องแนบสลิปหรือ Swift ก่อนบันทึก");
    if (!ref) errs.push("P6 · ต้องใส่เลขอ้างอิงเพื่อกระทบยอดกับ statement");

    if (Math.abs(diff) > 1) {
      if (!valOf("py_reason").trim())
        errs.push("P7 · ยอดต่างจากที่คำนวณ " + baht(Math.abs(diff)) + " — ต้องระบุเหตุผล");
      else warns.push("P7 · ยอดต่าง " + baht(Math.abs(diff)) + " · เหตุผลถูกบันทึกและขึ้นในรายงานหัวหน้าบัญชี");
    }
    const already = p.payments.filter(y => y.status === "PAID" && y.seq !== x.seq)
      .reduce((s, y) => s + y.amount, 0);
    if (already + x.amount > p.amt + 1) errs.push("P8 · จ่ายรวมเกินมูลค่า PO");
    if (d && dayDiff(today, d) > 7) warns.push("P9 · จ่ายย้อนหลัง " + dayDiff(today, d) + " วัน — ต้องให้หัวหน้าบัญชีอนุมัติเพิ่ม");
    if (ref && POS.some(q => q.payments.some(y => y.ref === ref && !(q.no === p.no && y.seq === x.seq))))
      errs.push("P11 · เลขอ้างอิงนี้ถูกใช้แล้วในรายการจ่ายอื่น — กันการจ่ายซ้ำ");
    if (x.apvBy && x.apvBy === ROLES[role].person)
      errs.push("P13 · คุณเป็นผู้อนุมัติงวดนี้เอง — ผู้บันทึกจ่ายต้องเป็นคนละคนกับผู้อนุมัติ");
    if (d && x.due && dayDiff(d, thToISO(x.due)) > 0)
      warns.push("จ่ายช้ากว่ากำหนด " + dayDiff(d, thToISO(x.due)) + " วัน — บันทึกไว้ในตัวชี้วัดการจ่ายตรงเวลา");

    const eb = document.getElementById("py_err");
    if (eb) eb.innerHTML = errs.map(e => '<div class="e1">' + esc(e) + "</div>").join("") +
      warns.map(w => '<div class="w1">' + esc(w) + "</div>").join("");
    return errs;
  }

    if (!quoteOpen) return;

  function upCalc() {
    const p = upTarget(); if (!p) return [];
    const d = upOpen.doc ? DOCS.filter(x => x.c === upOpen.doc)[0] : null;
    const code = d ? d.c : "STEP_" + upOpen.step;
    const file = valOf("up_file").trim(), note = valOf("up_note").trim();

      '<div class="cl tot"><span>' + (by ? "ข้าม QC — บันทึกเหตุผลถาวร" : "ผ่าน QC ตามปกติ") +

    const errs = [];
    if (!valOf("cs_sup").trim()) errs.push("ต้องระบุผู้ขาย/ร้าน");
    if (!valOf("cs_item").trim()) errs.push("ต้องระบุสินค้า");
    if (!valOf("cs_qty").trim()) errs.push("ต้องระบุจำนวน");
    if (amt <= 0) errs.push("ยอดเงินต้องมากกว่า 0");

    const cd = valOf("cs_date");
    if (!cd) errs.push("ต้องระบุวันที่จ่ายเงิน");

  // ผูกการลากหลังจากวาดป๊อปอัปแล้ว — ข้ามไปเงียบ ๆ ถ้าอยู่ในชุดทดสอบที่ไม่มี DOM จริง
  function wirePrDrag() {
    const box = document.getElementById("pr_stampbox");
    const page = document.getElementById("pr_page");
    if (!box || !page || !box.addEventListener || !page.getBoundingClientRect) return;
    const snap = v => [0, 50, 100].reduce((a, s) => Math.abs(v - s) < 4 ? s : a, v);
    box.addEventListener("pointerdown", ev => {
      const pr = page.getBoundingClientRect(), br = box.getBoundingClientRect();
      // พื้นที่ว่าง = ขนาดหน้ากระดาษลบขนาดกล่อง · ถ้ากล่องเต็มหน้าก็ลากไม่ได้
      prDrag = {px:ev.clientX, py:ev.clientY, x:prPosNow().x, y:prPosNow().y,
                fw:Math.max(1, pr.width - br.width), fh:Math.max(1, pr.height - br.height)};
      box.classList.add("grab");
      if (box.setPointerCapture) box.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
    box.addEventListener("pointermove", ev => {
      if (!prDrag) return;
      const cl = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
      const nx = snap(cl(prDrag.x + (ev.clientX - prDrag.px) / prDrag.fw * 100, 0, 100));
      const ny = snap(cl(prDrag.y + (ev.clientY - prDrag.py) / prDrag.fh * 100, 0, 100));
      prPos = {x:nx, y:ny};
      box.style.left = nx + "%"; box.style.top = ny + "%";
      box.style.transform = "translate(" + (-nx) + "%," + (-ny) + "%)";
      const pn = document.getElementById("pr_posn");
      if (pn) pn.textContent = Math.round(nx) + " / " + Math.round(ny);
      // ลากเองแล้ว = ไม่ตรงกับตัวเลือกสำเร็จรูปอีกต่อไป
      const sel = document.getElementById("pr_pos");
      if (sel && !Object.keys(PR_PRESET).some(k => PR_PRESET[k].x === nx && PR_PRESET[k].y === ny))
        sel.value = "FREE";
    });
    // วางแล้วให้แถบบนหัวตัวอย่างอัปเดตตาม (จาก "มุมขวาล่าง" เป็น "ตำแหน่งที่ลากวางเอง")
    const drop = () => { if (!prDrag) return; prDrag = null; box.classList.remove("grab"); prCalc(); };
    box.addEventListener("pointerup", drop);
    box.addEventListener("pointercancel", drop);
  }

  function prCalc() {
    const t = prTarget(); if (!t || !t.x) return [];
    const p = t.p;
    const stamp = !!(document.getElementById("pr_stamp") || {}).checked;
    const amt = numOf("pr_amt"), eff = valOf("pr_eff");

    // ข้อความตัวอย่างเดินตามยอด/วันที่ จนกว่าผู้ใช้จะพิมพ์ทับ
    const ta = document.getElementById("pr_text");
    if (ta && !prTouched) ta.value = prText();

    const pv = document.getElementById("pr_prev");
    if (pv && pv.classList) { if (stamp) pv.classList.remove("off"); else pv.classList.add("off"); }

    // เลือกตำแหน่งสำเร็จรูป = ย้ายบล็อกไปที่นั่น · ลากเองแล้วช่องจะเป็น "กำหนดเอง" และไม่ย้ายทับ
    const pk = valOf("pr_pos");
    if (PR_PRESET[pk]) prPos = PR_PRESET[pk];
    const sbox = document.getElementById("pr_stampbox");
    if (sbox && sbox.style) {
      const q = prPosNow();
      sbox.style.left = q.x + "%"; sbox.style.top = q.y + "%";
      sbox.style.transform = "translate(" + (-q.x) + "%," + (-q.y) + "%)";
      sbox.style.fontSize = (PR_SIZE[valOf("pr_size") || "13"] || 7.5) + "px";
      sbox.style.color = PR_INK[valOf("pr_color") || "แดง"] || PR_INK["แดง"];
      const pn = document.getElementById("pr_posn");
      if (pn) pn.textContent = Math.round(q.x) + " / " + Math.round(q.y);
    }
    const stx = document.getElementById("pr_stamptext");
    if (stx) stx.textContent = valOf("pr_text") || prText();

    // หน้ากระดาษเดินตามช่องที่กรอก — เปลี่ยนประเภท/เลขที่/ยอด แล้วเห็นผลทันที
    const setTx = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
    const bk = valOf("pr_bkind") || billKind(t.x);
    if (BILLDOC[bk]) setTx("pr_pgtitle", BILLDOC[bk].n.split(" /")[0].toUpperCase());
    setTx("pr_pgno", valOf("pr_bno") || "—");
    setTx("pr_pgdue", eff ? isoToTH(eff) : (t.x.due || "—"));
    setTx("pr_pgtot", baht(numOf("pr_bamt") || t.x.amount));
    const l = document.getElementById("pr_ptl"), r = document.getElementById("pr_ptr");
    const POSN = {TR:"มุมขวาบน", TL:"มุมซ้ายบน", BR:"มุมขวาล่าง", CT:"กลางหน้า (ลายน้ำ)",
      FREE:"ตำแหน่งที่ลากวางเอง"};
    const bfile = valOf("pr_bfile").trim();
    const bn = document.getElementById("pr_bnamed");
    if (bn) bn.textContent = DRIVE.fileName(p, payDocCode(t.x), bfile || "invoice.pdf");
    const dc = valOf("pr_doc") === payDocCode(t.x)
      ? {n:BILLDOC[valOf("pr_bkind") || billKind(t.x)].n}
      : DOCS.filter(y => y.c === valOf("pr_doc"))[0];
    if (l) l.textContent = stamp ? "จะพิมพ์ลง " + (dc ? dc.n : "เอกสารที่เลือก") : "ไม่ประทับลงเอกสาร";
    if (r) r.textContent = stamp
      ? (POSN[valOf("pr_pos")] || POSN.FREE) + " · " + (valOf("pr_size") || "13") + "pt · " +
        (valOf("pr_color") || "แดง")
      : "แนบข้อความเป็นหมายเหตุแทน";

    const errs = [];
    if (amt <= 0) errs.push("S1 · ต้องระบุยอดเงินที่ต้องจ่าย");
    if (amt > prRemain(p) + 1)
      errs.push("S2 · ยอดที่ขอ " + baht(amt) + " เกินยอดคงเหลือของ PO (" + baht(prRemain(p)) + ")");
    if (!eff) errs.push("S3 · ต้องระบุ Effective date");
    else if (dayDiff(eff, todayISO()) < 0)
      errs.push("S4 · Effective date เป็นวันย้อนหลัง — บัญชีจะทำจ่ายตามวันนี้ไม่ได้");
    if (p.claim) errs.push("S5 · PO นี้มีใบเคลมค้าง — ขอจ่ายไม่ได้จนกว่าจะได้ใบลดหนี้");
    if (missing(p).length)
      errs.push("S6 · ยังขาดเอกสาร " + missing(p).map(d => d.n).join(" · ") + " — หัวหน้าจะตีกลับ");
    if (stamp && !valOf("pr_text").trim()) errs.push("S7 · ติ๊กประทับข้อความแล้วแต่ข้อความว่าง");

    // เอกสารเรียกเก็บของงวดนี้ — บังคับทุกงวด ไม่ใช่แนบครั้งเดียวทั้ง PO
    const bno = valOf("pr_bno").trim(), bamt = numOf("pr_bamt");
    const bkind = valOf("pr_bkind") || billKind(t.x);
    if (!bno) errs.push("S8 · ต้องระบุเลขที่เอกสารเรียกเก็บของงวดนี้ — ผู้อนุมัติต้องรู้ว่าจ่ายตามใบไหน");
    if (!bfile) errs.push("S9 · ต้องแนบไฟล์เอกสารเรียกเก็บของงวดนี้ — คำขอที่ไม่มีใบเรียกเก็บไม่ควรมีใครกดอนุมัติ");
    if (bamt <= 0) errs.push("S10 · ต้องระบุยอดตามเอกสารเรียกเก็บ");
    else if (amt > bamt + 1)
      errs.push("S11 · ขอจ่าย " + baht(amt) + " เกินยอดในเอกสารเรียกเก็บ (" + baht(bamt) + ")");
    if (bno && bamt > 0) {
      const dup = sameBill(p, t.x, bno);
      if (dup.length) {
        const tot = dup.reduce((s2, y) => s2 + y.amount, 0) + amt;
        if (tot > bamt + 1)
          errs.push("S12 · ใบ " + bno + " ถูกใช้ขอจ่ายงวดที่ " + dup.map(y => y.seq).join(", ") +
            " ไปแล้ว รวมกับงวดนี้เป็น " + baht(tot) + " เกินยอดในใบ (" + baht(bamt) + ") — จ่ายซ้ำ");
      }
    }
    if (bkind === "INVOICE" && p.stage < 12 && !p.hand.invNo)
      errs.push("S13 · เลือกใบแจ้งหนี้ตัวจริงแต่ยังไม่ถึงขั้นรับใบแจ้งหนี้ — ถ้าเป็นงวดมัดจำให้เลือก PI");

    const eb = document.getElementById("pr_err");
    if (eb) eb.innerHTML = errs.map(e => '<div class="e1">' + esc(e) + "</div>").join("") +
      (errs.length ? "" : '<div class="w1">ส่งแล้วจะไปที่ ' +
        esc(ROLES[PAY_APPROVER].name) + " (" + esc(person(PAY_APPROVER)) +
        ") — ทุกยอดต้องผ่านผู้จัดการ ไม่มียอดไหนข้ามได้ · ระบบแจ้งเตือนให้เอง</div>");
    return errs;
  }

  /* เปิดใบเคลมจากผลตรวจที่ QC เพิ่งบันทึก — ไม่ใช่ตัวเลขตายตัว */
  function openClaimFor(p) {
    p.claim = true;
    p.payments.forEach(x => {
      if (["PENDING","REQUESTED","APPROVED"].indexOf(x.status) >= 0) x.status = "BLOCKED";
    });
    // เลขใบเคลมต้องรูปแบบเดียวกับของเดิม (CL-26-0004) ไม่ใช่ CL-26-006
    const nums = CLAIMS.map(c => parseInt(String(c.id).split("-")[2], 10)).filter(n => !isNaN(n));
    const cid = "CL-26-" + String((nums.length ? Math.max.apply(null, nums) : 0) + 1).padStart(4, "0");
    const bad = p.hand.qtyBad && String(p.hand.qtyBad).trim() !== "—"
      ? String(p.hand.qtyBad).trim() : (p.hand.qtyOk ? "ดูรายละเอียดในผลตรวจ" : p.qty);
    const tempTxt = p.hand.temp !== undefined && p.hand.temp !== ""
      ? " · อุณหภูมิที่วัดได้ " + p.hand.temp + "°C" : "";
    CLAIMS.unshift({id:cid, src:"INCOMING", date:"วันนี้", cust:"—", pi:"", dn:"",
      item:p.item, lot:"LOT-" + p.no.slice(-4), qty:bad,
      desc:"ตรวจรับไม่ผ่านที่ห้องเย็นต้นทาง" + tempTxt +
        (p.spec ? " · เกณฑ์ที่ตกลงไว้: " + p.spec : ""),
      qcResult:"FAIL", supplier:p.sup, po:p.no, cn:"", photos:0});
    p.tl.push(["วันนี้", ROLES[role].person, "ตรวจรับไม่ผ่าน — ตีกลับ " + bad + tempTxt]);
    p.tl.push(["วันนี้","ระบบ","เปิดใบเคลม " + cid + " + ล็อกงวดจ่าย + แจ้งจัดซื้อและบัญชี"]);
    openClaim = cid; page = "req"; subtab = "CLAIM";
    toast("เปิดใบเคลม " + cid + " (" + bad + ") และล็อกการจ่ายเงินให้แล้ว");
  }

  /* ตีกลับคำขอจ่าย — บังคับเหตุผล เพราะผู้ขอต้องรู้ว่าต้องแก้อะไรถึงจะขอใหม่ได้ */
  const REJ_WHY = ["ยอดไม่ตรงกับใบแจ้งหนี้", "เอกสารไม่ครบ", "ของยังรับไม่ครบ",
                   "วันที่มีผลจ่ายเร็วเกินไป", "ต้องต่อรองเงื่อนไขกับผู้ขายก่อน"];
  function rejModal() {
    const el = $("#modal");
    if (!rejOpen) { el.innerHTML = ""; return; }
    const p = POS.filter(x => x.no === rejOpen.po)[0];
    const x = p ? p.payments.filter(y => y.seq === rejOpen.seq)[0] : null;
    if (!x) { rejOpen = null; el.innerHTML = ""; return; }
    el.innerHTML = '<div class="bugwrap" data-rej="close"></div>' +
      '<div class="bugpanel" role="dialog" aria-label="ตีกลับคำขอจ่าย">' +
      "<h3>ตีกลับ " + esc(x.reqNo || "คำขอจ่าย") +
        '<button data-rej="close" aria-label="ปิด">✕</button></h3>' +
      '<div class="bugbody">' +
      '<div class="ctxbox">' + esc(p.no) + " · " + esc(p.sup) + "<br>ผู้ขอ <b>" + esc(x.reqBy || "—") +
        "</b> · ยอด <b>" + baht(x.amount) + "</b><br>" +
        "เหตุผลที่กรอกจะขึ้นบนหน้าจอของผู้ขอทันที และเก็บไว้ในประวัติถาวร</div>" +
      '<div class="fld"><span class="lbl">เหตุผลที่ตีกลับ <span class="req">*</span></span>' +
      '<select id="rj_why"><option value="">— เลือกเหตุผล —</option>' +
      REJ_WHY.map(w => '<option value="' + esc(w) + '">' + esc(w) + "</option>").join("") +
      '<option value="อื่น ๆ">อื่น ๆ (พิมพ์เอง)</option></select></div>' +
      '<div class="fld"><span class="lbl">รายละเอียดที่ผู้ขอต้องแก้</span>' +
      '<textarea id="rj_note" rows="3" placeholder="เช่น ใบแจ้งหนี้ 122,500 แต่ของรับจริง 340 KG ให้เช็คกับคลังก่อน"></textarea></div>' +
      '<div class="errbox" id="rj_err"></div>' +
      '<div class="fl2"><button class="btn" data-rej="close">ยกเลิก</button>' +
      '<button class="btn bad" data-rej="send">ตีกลับพร้อมเหตุผล</button></div></div></div>';
  }

  /* ป๊อปอัปทั้งหมดใช้ช่อง #modal ร่วมกัน — ตัวจ่ายงานตัวเดียว กันไม่ให้ล้างของกันเอง */
  function modals() {
    if (rejOpen) { rejModal(); return; }
    if (payOpen) { payModal(); return; }
    if (quoteOpen) { quoteModal(); return; }
    if (upOpen) { uploadModal(); return; }
    if (cashOpen) { cashModal(); return; }
    if (payReqOpen) { payReqModal(); return; }
    $("#modal").innerHTML = "";
  }
