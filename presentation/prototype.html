<title>MGS Document Hub — ตัวอย่างระบบ (Prototype)</title>

<style>
  :root{
    --paper:#fff; --surface:#f4f6f8; --surface-2:#e8edf1; --sidebar:#16202b;
    --ink:#16202b; --ink-2:#47576a; --ink-3:#7a8895; --line:#dbe3e9; --line-2:#c2ced7;
    --gold:#8f6d1c; --gold-bg:#f9f2df; --cold:#24607d; --cold-bg:#e4eff5;
    --go:#2c6e49; --go-bg:#e6f1ea; --warn:#a4501d; --warn-bg:#fbefe4; --stop:#9c2a26; --stop-bg:#fceae9;
    --sr:#8f6d1c; --qc:#1a6a5c; --ls:#43539c; --wh:#4e5f6c; --ac:#7d3660; --gm:#47576a;
    --sans:"Leelawadee UI","Noto Sans Thai","Sarabun","IBM Plex Sans Thai","Thonburi",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0f161d; --surface:#151e26; --surface-2:#1e2a35; --sidebar:#0a1017;
    --ink:#e9eff4; --ink-2:#a9bac7; --ink-3:#7c8b98; --line:#28353f; --line-2:#3a4a56;
    --gold:#d7ae53; --gold-bg:#291f10; --cold:#6cb3d4; --cold-bg:#102734;
    --go:#63bb8b; --go-bg:#132a1f; --warn:#e0925c; --warn-bg:#2c1f14; --stop:#e8827d; --stop-bg:#2e1717;
    --sr:#d7ae53; --qc:#46b39f; --ls:#909cdc; --wh:#93a6b4; --ac:#cd82ad; --gm:#a9bac7;
  }}
  :root[data-theme="dark"]{
    --paper:#0f161d; --surface:#151e26; --surface-2:#1e2a35; --sidebar:#0a1017;
    --ink:#e9eff4; --ink-2:#a9bac7; --ink-3:#7c8b98; --line:#28353f; --line-2:#3a4a56;
    --gold:#d7ae53; --gold-bg:#291f10; --cold:#6cb3d4; --cold-bg:#102734;
    --go:#63bb8b; --go-bg:#132a1f; --warn:#e0925c; --warn-bg:#2c1f14; --stop:#e8827d; --stop-bg:#2e1717;
    --sr:#d7ae53; --qc:#46b39f; --ls:#909cdc; --wh:#93a6b4; --ac:#cd82ad; --gm:#a9bac7;
  }
  :root[data-theme="light"]{
    --paper:#fff; --surface:#f4f6f8; --surface-2:#e8edf1; --sidebar:#16202b;
    --ink:#16202b; --ink-2:#47576a; --ink-3:#7a8895; --line:#dbe3e9; --line-2:#c2ced7;
    --gold:#8f6d1c; --gold-bg:#f9f2df; --cold:#24607d; --cold-bg:#e4eff5;
    --go:#2c6e49; --go-bg:#e6f1ea; --warn:#a4501d; --warn-bg:#fbefe4; --stop:#9c2a26; --stop-bg:#fceae9;
    --sr:#8f6d1c; --qc:#1a6a5c; --ls:#43539c; --wh:#4e5f6c; --ac:#7d3660; --gm:#47576a;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  .demo{background:var(--gold-bg);color:var(--ink-2);padding:7px 16px;font-size:12.5px;text-align:center;border-bottom:1px solid var(--line)}
  .demo b{color:var(--gold)}

  /* ---------- ERP shell ---------- */
  .shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
  @media (max-width:820px){.shell{grid-template-columns:1fr}}

  aside{background:var(--sidebar);color:#c9d6e0;display:flex;flex-direction:column}
  @media (max-width:820px){aside{position:sticky;top:0;z-index:30}}
  .logo{padding:16px 18px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
  .logo b{color:#fff;font-size:16px;letter-spacing:-.01em;display:block}
  .logo span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#7d8fa0}
  nav.side{padding:10px 0;display:flex;flex-direction:column}
  @media (max-width:820px){nav.side{flex-direction:row;overflow-x:auto;padding:0}}
  nav.side button{background:none;border:0;text-align:left;padding:10px 18px;color:#b3c3d0;
    display:flex;align-items:center;gap:10px;font-size:14px;border-left:3px solid transparent;white-space:nowrap}
  nav.side button:hover{color:#fff;background:rgba(255,255,255,.05)}
  nav.side button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.08);border-left-color:var(--gold);font-weight:700}
  @media (max-width:820px){nav.side button{border-left:0;border-bottom:3px solid transparent;padding:12px 14px}
    nav.side button[aria-current="page"]{border-left:0;border-bottom-color:var(--gold)}}
  nav.side .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:9px}
  @media (max-width:820px){nav.side .cnt{margin-left:6px}}
  .sidefoot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:11.5px;color:#7d8fa0}
  @media (max-width:820px){.sidefoot{display:none}}

  .mainwrap{display:flex;flex-direction:column;min-width:0}
  .topbar{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 20px;
    display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;position:sticky;top:0;z-index:20}
  .rolepick{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .rolepick .lb{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em}
  .rolepick button{background:var(--paper);border:1px solid var(--line-2);padding:4px 9px;font-size:12.5px;display:flex;align-items:center;gap:6px}
  .rolepick button i{width:8px;height:8px;background:var(--rc);display:block}
  .rolepick button[aria-pressed="true"]{border-color:var(--rc);color:var(--rc);font-weight:700;box-shadow:inset 0 0 0 1px var(--rc)}
  .topbar .sp{flex:1}
  .user{display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap}
  .user .av{width:26px;height:26px;background:var(--rc);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:700}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .user .av{color:#0f161d}}
  :root[data-theme="dark"] .user .av{color:#0f161d}

  main{padding:18px 20px 60px;min-width:0}
  .ph{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:14px}
  .ph h1{margin:0;font-size:20px;font-weight:750}
  .ph .d{color:var(--ink-3);font-size:13px}

  /* status tabs */
  .stabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
  .stabs button{background:none;border:0;padding:9px 16px;color:var(--ink-2);border-bottom:2px solid transparent;font-size:14px;white-space:nowrap}
  .stabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--cold);font-weight:700}
  .stabs .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:5px}

  /* cards / kpis */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:18px}
  .kpi{background:var(--paper);padding:12px 14px}
  .kpi .n{font-family:var(--mono);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
  .kpi .k{font-size:12px;color:var(--ink-2)}
  .kpi.a .n{color:var(--gold)} .kpi.r .n{color:var(--stop)} .kpi.g .n{color:var(--go)} .kpi.b .n{color:var(--cold)}

  .card{border:1px solid var(--line);background:var(--paper);margin-bottom:16px}
  .card>h3{margin:0;padding:10px 16px;font-size:13px;font-weight:700;background:var(--surface);
    border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
  .card>h3 .c{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-weight:500}

  /* toolbar / search */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:var(--paper);border:1px solid var(--line);margin-bottom:14px;align-items:center}
  .toolbar input[type=search],.toolbar select{border:1px solid var(--line-2);background:var(--paper);padding:7px 10px;font-size:14px;min-width:0}
  .toolbar input[type=search]{flex:1;min-width:180px}
  .toolbar label{font-size:12.5px;color:var(--ink-3)}

  /* table */
  .tw{overflow-x:auto;border:1px solid var(--line);background:var(--paper)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px}
  th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  thead th{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
    font-weight:600;background:var(--surface);white-space:nowrap;position:sticky;top:0}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover{background:var(--surface)}
  td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .pono{font-family:var(--mono);font-weight:700;color:var(--cold);white-space:nowrap}
  .sub{font-size:11.5px;color:var(--ink-3)}

  .pill{display:inline-block;font-size:11.5px;padding:2px 8px;border:1px solid currentColor;white-space:nowrap;font-family:var(--mono)}
  .pill.ok{color:var(--go);background:var(--go-bg)} .pill.wait{color:var(--ink-3)}
  .pill.late{color:var(--stop);background:var(--stop-bg);font-weight:700}
  .pill.due{color:var(--warn);background:var(--warn-bg)} .pill.info{color:var(--cold);background:var(--cold-bg)}
  .dept{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 6px;border:1px solid currentColor;white-space:nowrap}

  /* phase bar — ยุบ 17 ขั้นเหลือ 4 เฟส */
  .phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 16px}
  @media (max-width:620px){.phases{grid-template-columns:repeat(2,1fr)}}
  .pz{border:1px solid var(--line);padding:9px 11px;background:var(--surface)}
  .pz .t{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .pz .m{font-size:11.5px;color:var(--ink-3);margin-top:3px}
  .pz .tr{height:4px;background:var(--surface-2);margin-top:7px}
  .pz .fl{height:4px;background:var(--line-2)}
  .pz.done{background:var(--go-bg);border-color:var(--go)} .pz.done .fl{background:var(--go)} .pz.done .t{color:var(--go)}
  .pz.now{background:var(--cold-bg);border-color:var(--cold)} .pz.now .fl{background:var(--cold)} .pz.now .t{color:var(--cold)}

  /* detail header */
  .dh{border:1px solid var(--line);background:var(--paper);margin-bottom:16px}
  .dh .top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;padding:14px 16px 10px}
  .dh .top .n{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--cold)}
  .dh .top .t{font-size:16px;font-weight:700}
  .dh .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
  .dh .f{background:var(--paper);padding:9px 16px}
  .dh .f .k{font-size:11px;color:var(--ink-3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
  .dh .f .v{font-size:14px;font-weight:600;margin-top:1px}

  .rowline{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
  .rowline:last-of-type{border-bottom:0}
  .rowline .nm{flex:1;min-width:0}
  .rowline.miss{background:var(--warn-bg)}

  .note{display:flex;gap:10px;padding:11px 16px;font-size:13px;border-top:1px solid var(--line)}
  .note.warn{background:var(--warn-bg);color:var(--warn)} .note.bad{background:var(--stop-bg);color:var(--stop)}
  .note.good{background:var(--go-bg);color:var(--go)} .note.info{background:var(--cold-bg);color:var(--cold)}
  .note .ic{font-family:var(--mono);font-weight:700}

  .actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);align-items:center}
  .actions .hint{font-size:12.5px;color:var(--ink-3)}
  .btn{border:1px solid var(--line-2);background:var(--paper);padding:6px 13px;font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--ink-3)}
  .btn.pri{background:var(--cold);border-color:var(--cold);color:#fff}
  .btn.ok{background:var(--go);border-color:var(--go);color:#fff}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri,:root:not([data-theme="light"]) .btn.ok{color:#0f161d}}
  :root[data-theme="dark"] .btn.pri,:root[data-theme="dark"] .btn.ok{color:#0f161d}
  .btn.bad{color:var(--stop);border-color:var(--stop)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .back{background:none;border:0;padding:0 0 10px;color:var(--cold);font-size:13.5px}

  .tl{padding:8px 16px;max-height:300px;overflow-y:auto}
  .tl .e{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line);font-size:13px}
  .tl .e:last-child{border-bottom:0}
  .tl .e time{font-family:var(--mono);font-size:11px;color:var(--ink-3)}

  .steps{padding:8px 16px}
  .step{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--line);font-size:13.5px}
  .step:last-child{border-bottom:0}
  .step .i{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right}
  .step.done .nm{color:var(--ink-2)} .step.done .i{color:var(--go)}
  .step.now{font-weight:700;color:var(--cold)}
  .step.skip{color:var(--ink-3);text-decoration:line-through}

  .bars{padding:6px 16px 14px}
  .bar{display:grid;grid-template-columns:150px 1fr 84px;gap:10px;align-items:center;padding:7px 0;font-size:13px}
  @media (max-width:640px){.bar{grid-template-columns:104px 1fr 66px;font-size:12px}}
  .bar .tr{height:14px;background:var(--surface-2)} .bar .fl{height:14px;background:var(--cold)}
  .bar.r .fl{background:var(--stop)}
  .bar .v{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--ink-2)}

  .empty{padding:28px 16px;color:var(--ink-3);text-align:center;font-size:13.5px}

  /* topbar icon buttons */
  .iconbtn{background:var(--paper);border:1px solid var(--line-2);padding:5px 10px;font-size:12.5px;
    display:flex;align-items:center;gap:6px;white-space:nowrap}
  .iconbtn:hover{border-color:var(--ink-3)}
  .iconbtn .bdg{font-family:var(--mono);font-size:10.5px;font-weight:700;background:var(--stop);color:#fff;padding:0 5px;border-radius:9px}
  .iconbtn.on{border-color:var(--cold);color:var(--cold)}

  /* notification list */
  .nlist .n1{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:11px 16px;
    border-bottom:1px solid var(--line);align-items:start;font-size:13.5px;cursor:pointer}
  .nlist .n1:last-child{border-bottom:0}
  .nlist .n1:hover{background:var(--surface)}
  .nlist .n1.unread{background:var(--cold-bg)}
  .nlist .n1 .ic{font-family:var(--mono);font-weight:700;text-align:center}
  .nlist .n1 .b{color:var(--ink-2);font-size:12.5px;margin-top:1px}
  .nlist .n1 time{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
  .nlist .n1.act .ic{color:var(--gold)} .nlist .n1.warn .ic{color:var(--stop)} .nlist .n1.info .ic{color:var(--cold)}

  /* validation checks */
  .chk{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:8px 16px;
    border-bottom:1px dotted var(--line);font-size:13.5px;align-items:center}
  .chk:last-child{border-bottom:0}
  .chk .m{font-family:var(--mono);font-weight:700;text-align:center}
  .chk.pass .m{color:var(--go)} .chk.warn .m{color:var(--warn)} .chk.block .m{color:var(--stop)}
  .chk.block{background:var(--stop-bg)} .chk.warn{background:var(--warn-bg)}
  .chk .who{font-size:11.5px;color:var(--ink-3);white-space:nowrap}

  /* bug panel */
  .bugwrap{position:fixed;inset:0;background:rgba(10,16,23,.4);z-index:55}
  .bugpanel{position:fixed;right:14px;bottom:14px;width:min(400px,calc(100vw - 28px));max-height:calc(100vh - 28px);
    overflow-y:auto;background:var(--paper);border:1px solid var(--line-2);box-shadow:0 10px 34px rgba(0,0,0,.24);z-index:56}
  @media (max-width:520px){.bugpanel{left:14px;right:14px;width:auto}}
  .bugpanel h3{margin:0;padding:11px 16px;font-size:13.5px;background:var(--surface);border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center}
  .bugpanel h3 button{background:none;border:0;color:var(--ink-3);font-size:17px;line-height:1;padding:0 2px}
  .bugbody{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
  .ctxbox{background:var(--surface);border:1px solid var(--line);padding:9px 11px;font-size:11.5px;
    font-family:var(--mono);color:var(--ink-2);line-height:1.7}
  .ctxbox b{color:var(--ink)}
  .sev{display:flex;flex-direction:column;gap:5px}
  .sev label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line-2);padding:7px 10px;font-size:13px;cursor:pointer}
  .sev label:has(input:checked){border-color:var(--cold);background:var(--cold-bg)}
  .sev label .s{font-size:11.5px;color:var(--ink-3);display:block}
  .bugbody textarea{border:1px solid var(--line-2);background:var(--paper);padding:8px 10px;font:inherit;
    font-size:13.5px;min-height:74px;resize:vertical;width:100%}
  .bugbody .fl2{display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .lbl{font-size:11.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}

  /* payment form */
  .bugpanel.wide{width:min(560px,calc(100vw - 28px))}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:460px){.grid2{grid-template-columns:1fr}}
  .fld{display:flex;flex-direction:column;gap:3px;min-width:0}
  .fld input,.fld select{border:1px solid var(--line-2);background:var(--paper);padding:7px 9px;font:inherit;font-size:13.5px;width:100%}
  .fld input:focus-visible,.fld select:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .fld input[readonly]{background:var(--surface);color:var(--ink-2)}
  .fld .req{color:var(--stop)}
  .calcbox{background:var(--surface);border:1px solid var(--line);padding:10px 12px;font-size:13px}
  .calcbox .cl{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font-variant-numeric:tabular-nums}
  .calcbox .cl.tot{border-top:1px solid var(--line-2);margin-top:5px;padding-top:6px;font-weight:700}
  .calcbox .cl span:last-child{font-family:var(--mono)}
  .errbox{font-size:12.5px;display:flex;flex-direction:column;gap:3px}
  .errbox .e1{color:var(--stop);background:var(--stop-bg);border:1px solid var(--stop);padding:5px 9px}
  .errbox .w1{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn);padding:5px 9px}
  .chkline{display:flex;gap:8px;align-items:center;font-size:13.5px}

  /* กล่อง "ตอนนี้ต้องทำอะไร" — อยู่บนสุดเสมอ */
  .todo{border:2px solid var(--cold);background:var(--paper);margin-bottom:16px}
  .todo>h3{margin:0;padding:9px 16px;font-size:13px;font-weight:700;background:var(--cold);color:#fff;
    display:flex;justify-content:space-between;gap:10px;align-items:center}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .todo>h3{color:#0f161d}}
  :root[data-theme="dark"] .todo>h3{color:#0f161d}
  .todo.calm{border-color:var(--line-2)}
  .todo.calm>h3{background:var(--surface);color:var(--ink-2);border-bottom:1px solid var(--line)}
  .todo .big{padding:13px 16px;font-size:15px;font-weight:600}
  .todo .then{padding:0 16px 12px;font-size:12.5px;color:var(--ink-3)}

  /* บล็อกที่พับเก็บได้ */
  details.blk{border:1px solid var(--line);background:var(--paper);margin-bottom:16px}

    const s = st(p);

    return '<span class="pill info">กำลังดำเนินการ</span>';
  }
  function phaseOf(p){ for(const ph of PHASES) if(p.stage<=ph.to) return ph; return PHASES[3]; }
  function docState(p, d) {
    if (p.skip.indexOf(d.at) >= 0) return "na";
    if (p.stage > d.at) return "ok";
    if (p.stage === d.at) return "wait";
    return "pend";
  }
  const missing = p => DOCS.filter(d => d.req && docState(p,d) === "wait");

  /* ================= หน้าหลัก ================= */
  // PO ที่กำลังจะถึงคิวของฉันใน 2 ขั้นถัดไป — ให้เตรียมตัวได้ ไม่ใช่รอให้เด้งมาแล้วค่อยรู้
  function comingToMe(p) {
    if (ownerOf(p) === role) return false;
    let n = p.stage + 1, hop = 0;
    while (n < STAGES.length && hop < 3) {
      if (p.skip.indexOf(n) < 0) { hop++; if (STAGES[n].o === role) return true; }
      n++;
    }
    return false;
  }

  function pageHome() {
    const act = POS.filter(isActive);
    const mine = act.filter(p => ownerOf(p) === role);
    const mineLate = mine.filter(p => st(p) && p.age > st(p).sla);
    const soon = act.filter(comingToMe);
    const others = act.filter(p => ownerOf(p) !== role && !comingToMe(p));
    const duePay = act.reduce((n, p) => n + unpaid(p).length, 0);

    let h = '<div class="ph"><h1>สวัสดี ' + esc(ROLES[role].person) + '</h1><span class="d">' +

      '<div class="kpi r"><div class="n">' + mineLate.length + '</div><div class="k">เลยกำหนดของคุณ</div></div>' +
      '<div class="kpi b"><div class="n">' + soon.length + '</div><div class="k">กำลังจะถึงคิวคุณ</div></div>' +

      "</div>";

    if (!mine.length)
      h += '<div class="note good" style="border:1px solid var(--go);margin-bottom:16px">' +
        '<span class="ic">✓</span><span><b>ตอนนี้ไม่มีอะไรที่คุณต้องทำ</b> — ' +

    h += poTable("① ต้องทำวันนี้", mine, "ไม่มีงานค้างที่คุณ");

  function searchPanel() {
    let h = '<div class="toolbar">' +
      '<input type="search" id="q" placeholder="เลข PO · เลข B1 · ผู้ขาย · สินค้า · เลข Lot · เลขใบเคลม" value="' + esc(q) + '">' +

    if (!q && !fDept) {
      h += '<div class="note info"><span class="ic">▸</span><span>พิมพ์อย่างน้อย 2 ตัวอักษร — ค้นได้ทั้งเลข PO, เลข B1, ชื่อผู้ขาย, ชื่อสินค้า, เลข Lot และเลขใบเคลม ' +
        "และค้นได้ทั้ง PO ที่ปิดแล้ว</span></div>";
      return h;
    }
    const needle = q.toLowerCase();
    const claimPo = {};
    CLAIMS.forEach(c => { if (c.po) claimPo[c.po] = c.id; });
    const res = POS.filter(p => {
      if (fDept && (!isActive(p) || ownerOf(p) !== fDept)) return false;
      if (!needle) return true;
      return [p.no, p.sap, p.sup, p.item, claimPo[p.no] || ""].join(" ").toLowerCase().indexOf(needle) >= 0;
    });
    h += poTable("ผลการค้นหา", res, "ไม่พบรายการที่ตรงกับ “" + q + "”", true);
    return h;
  }

  function poTable(title, list, emptyText, showStatus) {
    let h = '<div class="card"><h3>' + esc(title) + '<span class="c">' + list.length + " รายการ</span></h3>";
    if (!list.length) return h + '<div class="empty">' + esc(emptyText) + "</div></div>";
    h += '<div class="tw"><table><thead><tr><th>เลข PO</th><th>ผู้ขาย / สินค้า</th>' +
      (money() ? '<th class="num">มูลค่า</th><th>การจ่าย</th>' : "") +
      "<th>เฟส</th><th>ค้างที่</th><th>สถานะ</th></tr></thead><tbody>";
    list.forEach(p => {
      const s = st(p), ph = phaseOf(p);
      const paid = p.payments.filter(x => x.status === "PAID").length;
      h += '<tr class="click" data-po="' + esc(p.no) + '">' +
        '<td><span class="pono">' + esc(p.no) + '</span><div class="sub mono">' + esc(p.sap || "รอผูกกับ B1") + "</div></td>" +

        (money() ? '<td class="num">' + baht(p.amt) + "</td>" +
          "<td>" + (p.payments.length
            ? '<span class="mono" style="font-size:12px">' + paid + "/" + p.payments.length + " งวด</span>" +
              (p.payments.length > 1 ? '<div class="sub">' + esc(p.term) + "</div>" : "")
            : "—") + "</td>" : "") +
        '<td>' + esc(ph.name) + (isActive(p) && s ? '<div class="sub">' + esc(s.n) + "</div>" : "") + "</td>" +
        "<td>" + (isActive(p) && s ? dept(s.o) + '<div class="sub">' + ageTxt(p.age) + "</div>" : "—") + "</td>" +
        "<td>" + statusPill(p) + "</td></tr>";
    });
    return h + "</tbody></table></div></div>";
  }

  /* ================= PO detail ================= */
  // ขั้นถัดไปหลังจากขั้นปัจจุบัน (ข้ามขั้นที่ไม่ต้องทำ) — ใช้บอกล่วงหน้าว่างานจะไปหาใคร
  function nextStage(p) {
    let n = p.stage + 1;
    while (n < STAGES.length && p.skip.indexOf(n) >= 0) n++;
    return STAGES[n] || null;
  }
  const person = k => ROLES[k] ? ROLES[k].person : "";

  // กล่องบนสุด: ตอบคำถามเดียว — "ตอนนี้ฉันต้องทำอะไร"
  function todoCard(p) {
    const s = st(p), nx = nextStage(p);
    const mine = isActive(p) && s && s.o === role;
    const then = nx ? '<div class="then">กดแล้วงานจะไปที่ <b>' + esc(ROLES[nx.o].name) + " (" + esc(person(nx.o)) +
      ")</b> และระบบแจ้งเตือนให้เอง — ไม่ต้องบอกในไลน์</div>"
      : '<div class="then">กดแล้ว PO นี้จะปิดและย้ายไปแท็บเสร็จสิ้น</div>';

    if (!isActive(p))
      return '<div class="todo calm"><h3>สถานะ</h3><div class="big">PO นี้' +
        (p.status === "COMPLETED" ? "ปิดเรียบร้อยแล้ว" : "ถูกยกเลิก") + " — เปิดดูย้อนหลังได้อย่างเดียว</div></div>";

    if (!mine) {
      const o = ownerOf(p);
      return '<div class="todo calm"><h3>ตอนนี้ไม่มีอะไรที่คุณต้องทำ</h3>' +
        '<div class="big">รออยู่ที่ <b>' + esc(ROLES[o] ? ROLES[o].name : "-") + " (" + esc(person(o)) + ")</b> — " +
        esc(s ? s.n : "") + " · ค้างมาแล้ว " + ageTxt(p.age) + "</div>" +
        '<div class="actions"><button class="btn" data-act="nudge">เตือนให้ทำ</button>' +
        '<span class="hint">ระบบเตือนอัตโนมัติอยู่แล้วเมื่อเลยกำหนด ปุ่มนี้ใช้เมื่อด่วนจริง</span></div></div>';
    }

    let btns = "";
    if (s.c === "INTERNAL_APPROVAL")
      btns = '<button class="btn ok" data-act="approve">อนุมัติ</button>' +
             '<button class="btn bad" data-act="reject">ไม่อนุมัติ</button>';
    else if (s.c === "QC_INCOMING")
      btns = '<button class="btn ok" data-act="qcpass">ตรวจรับผ่าน</button>' +
             '<button class="btn bad" data-act="qcfail">ไม่ผ่าน → เปิดใบเคลม</button>';
    else if (s.c === "ITEM_CODE")
      btns = '<button class="btn pri" data-act="goic">ไปที่ใบขอเปิดรหัสสินค้า</button>';
    else if (s.c === "PO_CREATED")
      btns = '<button class="btn pri" data-act="sappull">ดึงข้อมูล PO จาก SAP B1</button>';
    else
      btns = '<button class="btn pri" data-act="done">ทำ “' + esc(s.n) + '” เสร็จ</button>';

    const over = p.age > s.sla;
    return '<div class="todo"><h3>งานนี้อยู่ที่คุณ<span>' +
      (over ? "เลยกำหนดแล้ว " + ageTxt(p.age - s.sla) : "เหลือเวลา " + ageTxt(Math.max(0, s.sla - p.age))) + "</span></h3>" +
      '<div class="big">' + esc(s.n) + "</div>" +
      '<div class="actions">' + btns + "</div>" + then + "</div>";
  }

  function pageDetail() {
    const p = POS.filter(x => x.no === openPo)[0];
    if (!p) return "<p>ไม่พบ PO</p>";
    const s = st(p), miss = missing(p);
    const bl = blockedBy(p);

    let h = '<button class="back" data-back="1">← กลับไปรายการ PO</button>';

    // 1) หัวเอกสาร — ซ่อนช่องเงินไปเลยสำหรับบทบาทที่ไม่มีสิทธิ์ (ดีกว่าโชว์ว่า "ดูไม่ได้")
    h += '<div class="dh"><div class="top"><span class="n">' + esc(p.no) + "</span>" +
      '<span class="t">' + esc(p.item) + "</span>" + statusPill(p) + "</div>" +
      '<div class="fields">' +
      fld("เลข PO ใน B1", p.sap || "ยังไม่ได้ดึงจาก B1", p.sap ? "B1" : "") +
      fld("ผู้ขาย", p.sup, p.sap ? "B1" : "") +
      fld("จำนวน", p.qty, p.sap ? "B1" : "") +
      (money() ? fld("มูลค่า", baht(p.amt), p.sap ? "B1" : "") : "") +
      fld("เงื่อนไขจ่าย", p.term, p.sap ? "B1" : "") +
      fld("ผู้ดูแล", p.owner) + fld("วันที่เปิด", p.date) +
      "</div></div>";

    // 2) ตอนนี้ต้องทำอะไร — อยู่บนสุดเสมอ ไม่ต้องเลื่อนหา
    h += todoCard(p);

    // 3) ความคืบหน้า
    h += '<div class="card"><h3>ความคืบหน้า<span class="c">' +
      (isActive(p) ? "ขั้นที่ " + (p.stage+1) + " จาก 17" : "จบแล้ว") + '</span></h3><div class="phases">';
    PHASES.forEach(ph => {
      const done = p.stage > ph.to || !isActive(p) && p.status === "COMPLETED";
      const now = isActive(p) && p.stage >= ph.from && p.stage <= ph.to;
      const total = ph.to - ph.from + 1;
      const prog = done ? 100 : now ? Math.round(((p.stage - ph.from + 1) / total) * 100) : 0;
      h += '<div class="pz ' + (done ? "done" : now ? "now" : "") + '">' +
        '<div class="t"><span>' + esc(ph.name) + "</span><span>" + (done ? "✓" : now ? prog + "%" : "") + "</span></div>" +
        '<div class="m">' + (now && s ? esc(s.n) : done ? "เสร็จแล้ว" : "ยังไม่ถึง") + "</div>" +
        '<div class="tr"><div class="fl" style="width:' + prog + '%"></div></div></div>';
    });
    h += "</div></div>";

    // 4) เอกสาร
    h += '<div class="card"><h3>เอกสาร<span class="c">' + (miss.length ? "ขาด " + miss.length + " ใบ" : "ครบ") + "</span></h3>";
    DOCS.forEach(d => {
      const stt = docState(p, d);
      if (stt === "na") return;
      const mine = d.o === role;
      const badge = stt === "ok" ? '<span class="pill ok">มีแล้ว</span>'
        : stt === "wait" ? '<span class="pill ' + (mine ? "due" : "wait") + '">' +
            (mine ? "รอคุณอัพโหลด" : "รอ " + esc(ROLES[d.o] ? ROLES[d.o].name : d.o)) + "</span>"
        : '<span class="pill wait">ยังไม่ถึงคิว</span>';
      h += '<div class="rowline' + (stt === "wait" && d.req && mine ? " miss" : "") + '">' + dept(d.o) +
        '<span class="nm">' + esc(d.n) + "</span>" + badge +
        (stt === "wait" && mine && isActive(p) ? ' <button class="btn" data-up="' + esc(d.c) + '">อัพโหลด</button>' : "") + "</div>";
    });
    h += '<div class="note info"><span class="ic">📁</span><span>ไฟล์เก็บใน Google Drive ให้เอง — ' +
      "อัพจากหน้านี้ ไม่ต้องเปิด Drive ไม่ต้องตั้งชื่อไฟล์เอง</span></div></div>";

    // 5) การจ่ายเงิน
    if (money()) h += paymentCard(p);

    // 6) ตรวจสอบก่อนบันทึก — แสดงเต็มเฉพาะช่วงตั้งหนี้/จ่าย หรือเมื่อมีข้อติดจริง
    const nearClose = p.stage >= PHASES[2].from || !isActive(p);
    if (nearClose || bl.length) h += checksCard(p);
    else h += '<div class="note info" style="border:1px solid var(--line);margin-bottom:16px">' +
      '<span class="ic">▸</span><span>ยังอยู่ช่วง' + esc(phaseOf(p).name) +
      " — ระบบจะตรวจครบทุกข้อให้อัตโนมัติเมื่อถึงขั้นตั้งหนี้ ตอนนี้ยังไม่ต้องสนใจ</span></div>";

    // 7-8) รายละเอียดที่เปิดดูเมื่อต้องการ
    h += '<details class="blk"><summary>17 ขั้นตอนโดยละเอียด<span class="c">เปิดเมื่ออยากดูทั้งกระบวนการ</span></summary><div class="steps">';
    STAGES.forEach((sg, i) => {
      const cls = p.skip.indexOf(i) >= 0 ? "skip" : i < p.stage ? "done" : i === p.stage && isActive(p) ? "now" : "";
      h += '<div class="step ' + cls + '"><span class="i">' + (i+1) + "</span>" +
        '<span class="nm">' + esc(sg.n) + "</span>" + dept(sg.o) + "</div>";
    });
    h += "</div></details>";

    h += '<details class="blk"><summary>ประวัติ<span class="c">' + p.tl.length + ' รายการ</span></summary><div class="tl">' +
      p.tl.slice().reverse().map(e => '<div class="e"><time>' + esc(e[0]) + "</time><div><b>" +
        esc(e[1]) + "</b> " + esc(e[2]) + "</div></div>").join("") + "</div></details>";
    return h;
  }
  function fld(k, v, src) {
    return '<div class="f"><div class="k">' + esc(k) +
      (src ? '<span class="src">' + esc(src) + "</span>" : "") +
      '</div><div class="v">' + esc(v) + "</div></div>";
  }

  function payButtons(p, x) {
    if (!isActive(p) && x.status !== "PAID") return "";
    const b = (act, cls, t) => '<button class="btn ' + cls + '" data-payact="' + act + '" data-seq="' + x.seq + '">' + t + "</button>";
    if (role === "AC") {
      if (x.status === "PENDING")  return b("req", "pri", "ตั้งเรื่องขอจ่าย");
      if (x.status === "APPROVED") return b("form", "ok", "บันทึกการจ่าย");
      if (x.status === "FAILED")   return b("form", "ok", "ทำจ่ายใหม่");
      if (x.status === "PAID")     return b("void", "bad", "กลับรายการ");
    }
    // ผู้อนุมัติต้องไม่ใช่ผู้ตั้งเรื่อง — ในตัวอย่างนี้บัญชีตั้งเรื่อง ผู้บริหารอนุมัติ
    if (role === "GM" && x.status === "REQUESTED")
      return b("apv", "ok", "อนุมัติจ่าย") + " " + b("rej", "bad", "ตีกลับ");
    return "";
  }

  function paymentCard(p) {
    if (!p.payments.length) return "";
    const paidRows = p.payments.filter(x => x.status === "PAID");
    const paid = paidRows.reduce((s, x) => s + x.amount, 0);
    const late = unpaid(p).filter(x => x.status !== "BLOCKED").length;

    let h = '<div class="card"><h3>การจ่ายเงิน<span class="c">' + esc(p.term) +
      " · จ่ายแล้ว " + baht(paid) + " จาก " + baht(p.amt) + "</span></h3>" +
      '<div class="tw"><table><thead><tr><th>งวด</th><th>ประเภท</th>' +
      '<th class="num">จำนวนเงิน</th><th>ครบกำหนด</th><th>วันที่จ่าย</th>' +
      "<th>อ้างอิงธนาคาร</th><th>สถานะ</th><th></th></tr></thead><tbody>";

    p.payments.forEach(x => {
      const s = PAY_ST[x.status] || PAY_ST.PENDING;
      const dueCell = '<span class="mono">' + esc(x.due) + "</span>" +
        (x.lateDays > 0 ? '<div class="sub" style="color:var(--stop)">จ่ายช้า ' + x.lateDays + " วัน</div>" : "");
      const payCell = x.paidAt
        ? '<span class="mono">' + esc(x.paidAt) + "</span>" +
          (x.valueDate && x.valueDate !== x.paidAt ? '<div class="sub">ตัดเงิน ' + esc(x.valueDate) + "</div>" : "")
        : '<span class="sub">—</span>';
      const refCell = x.ref
        ? '<span class="mono" style="font-size:12px">' + esc(x.ref) + "</span>" +
          '<div class="sub">' + esc(x.bank ? x.bank.split(" ")[0] : "") + (x.slip ? " · มีสลิป" : "") + "</div>"
        : '<span class="sub">—</span>';

      h += '<tr><td class="mono">' + x.seq + "</td>" +
        "<td>" + esc(x.type) + '<div class="sub">' + x.pct + "%</div></td>" +
        '<td class="num">' + baht(x.amount) +
          (x.wht ? '<div class="sub">หัก ณ ที่จ่าย ' + baht(x.wht) + "</div>" : "") + "</td>" +
        "<td>" + dueCell + "</td><td>" + payCell + "</td><td>" + refCell + "</td>" +
        '<td><span class="pill ' + s.cls + '">' + esc(s.t) + "</span>" +
          (x.status === "REQUESTED" && x.amount > APV_LIMIT
            ? '<div class="sub">เกิน ' + baht(APV_LIMIT) + " · ผู้บริหาร</div>" : "") + "</td>" +
        "<td>" + payButtons(p, x) + "</td></tr>";
    });
    h += "</tbody></table></div>";

    if (p.payments.some(x => x.status === "BLOCKED"))
      h += '<div class="note bad"><span class="ic">!</span><span>งวดนี้ถูกล็อกเพราะมีใบเคลมค้าง — ' +
        "ตั้งเรื่องขอจ่ายไม่ได้จนกว่าจะบันทึกใบลดหนี้ในหน้าใบคำร้อง</span></div>";
    else if (late)
      h += '<div class="note warn"><span class="ic">▸</span><span>ยังเหลือ ' + late +
        " งวด — ระบบเตือนบัญชีตามวันครบกำหนดของแต่ละงวด และแจ้งผู้ขายให้เองเมื่อจ่ายแล้ว " +
        "ไม่ต้องให้จัดซื้อส่งสลิปต่อ</span></div>";
    else
      h += '<div class="note good"><span class="ic">✓</span><span>จ่ายครบทุกงวดแล้ว</span></div>';

    h += '<div class="note info"><span class="ic">▸</span><span>ลำดับ: ' +
      "<b>ตั้งเรื่องขอจ่าย → อนุมัติ → บันทึกการจ่าย</b> · " +
      "ผู้ตั้งเรื่องกับผู้อนุมัติต้องเป็นคนละคน และไม่มีปุ่มลบ จ่ายผิดต้องกลับรายการ</span></div>";
    return h + "</div>";
  }

  /* ========= ใบคำร้อง — ยุบเมนู "เคลม" + "รหัสสินค้า" เข้าด้วยกัน ========= */
  function pageReq() {
    let h = '<div class="ph"><h1>ใบคำร้อง</h1><span class="d">' +
      'ใบขอที่มีสายอนุมัติของตัวเอง ไม่ใช่ PO — เพิ่มประเภทใหม่ในอนาคตคือเพิ่มแท็บ ไม่ใช่เพิ่มเมนู</span></div>';
    h += '<div class="stabs">' +
      tabBtn("CLAIM", "เคลม / ร้องเรียน", CLAIMS.length) +
      tabBtn("ITEM", "ขอเปิดรหัสสินค้า", ITEMREQS.length) + "</div>";
    return h + (subtab === "ITEM" ? pageItems() : pageClaims());
  }

  /* ================= เคลม ================= */
  function pageClaims() {
    // เปิดรายละเอียดแล้วให้เต็มหน้า เหมือนหน้า PO — กันการพลาดว่ารายละเอียดอยู่ใต้ตาราง
    if (openClaim && CLAIMS.some(c => c.id === openClaim)) return claimDetail();
    let h = '<div class="note info"><span class="ic">▸</span><span>รวมลูกค้าร้องเรียน (ฟอร์ม QC-F006) ' +
      "และตรวจรับไม่ผ่าน — ปลายทางเดียวกันคือใบลดหนี้ · <b>กดที่แถวเพื่อเปิดใบเคลม</b></span></div>";
    h += '<div class="card"><h3>รายการ<span class="c">' + CLAIMS.length + " ใบ</span></h3>" +
      '<div class="tw"><table><thead><tr><th>เลขที่</th><th>ที่มา</th><th>สินค้า / Lot</th>' +
      "<th>อ้างอิง</th><th>จำนวน</th><th>ใบลดหนี้</th></tr></thead><tbody>";
    CLAIMS.forEach(c => {
      h += '<tr class="click" data-claim="' + esc(c.id) + '">' +
        '<td><span class="pono">' + esc(c.id) + "</span></td>" +
        "<td>" + (c.src === "CUSTOMER" ? '<span class="pill" style="color:var(--ac)">ลูกค้าร้องเรียน</span>'
                                       : '<span class="pill" style="color:var(--qc)">ตรวจรับไม่ผ่าน</span>') + "</td>" +
        "<td>" + esc(c.item) + '<div class="sub mono">' + esc(c.lot) + "</div></td>" +
        '<td class="mono" style="font-size:12px">' + esc(c.src === "CUSTOMER" ? "PI " + c.pi : c.po) + "</td>" +
        "<td>" + esc(c.qty) + "</td>" +
        "<td>" + (c.cn ? '<span class="pill ok">' + esc(c.cn) + "</span>" : '<span class="pill due">รอ</span>') + "</td></tr>";
    });
    h += "</tbody></table></div></div>";

    return h;
  }

  function claimDetail() {
    const c = CLAIMS.filter(x => x.id === openClaim)[0];
    let h = '<button class="back" data-back="req">← กลับไปรายการเคลม</button>';
    h += '<div class="card"><h3>' + esc(c.id) + ' — ตามฟอร์ม QC-F006-V00</h3>';
    h += '<div class="note good"><span class="ic">1</span><span><b>ส่วนที่ 1 การร้องเรียน</b> — ' +
      (c.src === "CUSTOMER" ? "Sales Coordinator กรอก" : "ระบบสร้างจากผลตรวจรับของ QC") + "</span></div>";
    if (c.src === "CUSTOMER") {
      h += row("ลูกค้า", c.cust) + row("เลขที่ PI / DN", c.pi + " / " + c.dn);
    } else {
      h += row("PO ที่เกี่ยวข้อง", c.po) + row("ผู้ขาย", c.supplier);
    }
    h += row("สินค้า / Lot", c.item + " · " + c.lot) + row("จำนวนที่พบปัญหา", c.qty) +
      row("ลักษณะปัญหา", c.desc);
    h += '<div class="note good"><span class="ic">2</span><span><b>ส่วนที่ 2 ผลการตรวจ</b> — QC กรอกครั้งเดียว ระบบสร้าง Inspection Report ให้</span></div>';
    h += row("ผลการตรวจ", c.qcResult === "FAIL" ? "ไม่ผ่าน → ดำเนินการส่วนที่ 3" : "ผ่าน") +
      row("รูปหลักฐาน", c.photos + " รูป");
    h += '<div class="note bad"><span class="ic">3</span><span><b>ส่วนที่ 3 เคลมกับผู้ขาย</b> — ปลายทางคือใบลดหนี้ ซึ่งจะปลดล็อกการจ่ายเงินให้เอง</span></div>';
    h += row("ผู้ขายที่เคลม", c.supplier) + row("ใบลดหนี้", c.cn || "ยังไม่ได้รับ") +
      row("ผลต่อการจ่ายเงิน", c.po ? "ล็อกงวดจ่ายของ " + c.po : "ไม่กระทบฝั่งซื้อ");
    h += '<div class="actions">';
    if (role === "QC") h += '<button class="btn pri" data-cl="report">สร้าง Inspection Report</button>';
    if (role === "SR") h += '<button class="btn pri" data-cl="send">ส่งใบเคลมให้ผู้ขาย</button>';
    if (role === "AC" && !c.cn) h += '<button class="btn ok" data-cl="cn">บันทึกใบลดหนี้ที่ได้รับ</button>';
    h += '<span class="hint">ลายเซ็น 5 ตำแหน่งตามฟอร์มเดิม เก็บเป็นหลักฐานในระบบ</span></div></div>';
    return h;
  }
  function row(k,v){return '<div class="rowline"><span class="nm" style="flex:0 0 38%;color:var(--ink-3)">' +
    esc(k) + '</span><span class="nm"><b>' + esc(v||"—") + "</b></span></div>";}

  /* ================= รหัสสินค้า ================= */
  function pageItems() {
    if (openIC && ITEMREQS.some(r => r.id === openIC)) return itemDetail();

    let h = '<div class="note info"><span class="ic">▸</span><span>เดิมเป็นใบกระดาษที่ต้องเดินไปให้ LS คีย์เข้า B1 · ' +
      "<b>กดที่แถวเพื่อเปิดใบขอ</b></span></div>";
    h += '<div class="card"><h3>ใบขอ<span class="c">' + ITEMREQS.length + " ใบ</span></h3>" +
      '<div class="tw"><table><thead><tr><th>เลขที่</th><th>สินค้า</th><th>ผู้ขาย</th><th>PO</th>' +
      "<th>สถานะ</th><th>รหัสใน B1</th><th></th></tr></thead><tbody>";
    ITEMREQS.forEach(r => {

  /* ================= รายงาน ================= */
  function pageReport() {
    const act = POS.filter(isActive);
    const agg = {};
    act.forEach(p => {
      const s = st(p); if (!s) return;
      (agg[s.c] = agg[s.c] || {n:s.n, o:s.o, cnt:0, sum:0, late:0, sla:s.sla});
      agg[s.c].cnt++; agg[s.c].sum += p.age;
      if (p.age > s.sla) agg[s.c].late++;
    });
    const rows = Object.keys(agg).map(k => {
      const a = agg[k]; a.avg = Math.round(a.sum / a.cnt); a.score = a.cnt * a.avg; return a;
    }).sort((x,y) => y.score - x.score);
    const max = rows.length ? rows[0].score : 1;

    let h = '<div class="ph"><h1>รายงาน</h1><span class="d">งานค้างอยู่ที่ขั้นตอนไหน — ข้อมูลที่ตอนนี้ยังไม่มีใครรู้</span></div>';
    h += '<div class="card"><h3>อันดับคอขวด</h3><div class="bars">';
    rows.forEach(a => {
      h += '<div class="bar' + (a.late ? " r" : "") + '"><div>' + esc(a.n) + " " + dept(a.o) + "</div>" +
        '<div class="tr"><div class="fl" style="width:' + Math.round(a.score/max*100) + '%"></div></div>' +
        '<div class="v">' + a.cnt + " PO · " + a.avg + " ชม.</div></div>";
    });
    h += "</div></div>";

    if (money()) {
      const all = [];
      POS.forEach(p => p.payments.forEach(x => all.push({p:p, x:x})));
      const paid = all.filter(r => r.x.status === "PAID");
      const onTime = paid.filter(r => r.x.lateDays <= 0).length;
      const owed = all.filter(r => DONE_PAY.indexOf(r.x.status) < 0 && isActive(r.p));
      const owedSum = owed.reduce((s, r) => s + r.x.amount, 0);
      const blocked = owed.filter(r => r.x.status === "BLOCKED");

      h += '<div class="card"><h3>การจ่ายเงิน<span class="c">ได้มาจากวันที่ที่บันทึกไว้ ไม่ต้องกรอกเพิ่ม</span></h3>' +
        '<div class="kpis" style="margin:0;border:0">' +
        '<div class="kpi g"><div class="n">' + (paid.length ? Math.round(onTime / paid.length * 100) : 0) +
          '%</div><div class="k">จ่ายตรงเวลา (' + onTime + "/" + paid.length + " งวด)</div></div>" +
        '<div class="kpi a"><div class="n">' + owed.length + '</div><div class="k">งวดที่ยังไม่จ่าย</div></div>' +
        '<div class="kpi b"><div class="n">' + baht(owedSum).replace("฿","") + '</div><div class="k">ยอดค้างจ่าย</div></div>' +
        '<div class="kpi r"><div class="n">' + blocked.length + '</div><div class="k">ถูกล็อกจากเคลม</div></div>' +
        '<div class="kpi"><div class="n">' + waitApv.length + '</div><div class="k">รออนุมัติจ่าย</div></div></div>';
      if (blocked.length)
        h += '<div class="note bad"><span class="ic">!</span><span>ถูกล็อกจากเคลม ' +
          baht(blocked.reduce((s, r) => s + r.x.amount, 0)) + " — ปิดเคลมที่กระทบเงินมากสุดก่อน</span></div>";
      h += "</div>";

    const done = POS.filter(p => p.status === "COMPLETED");

      '<div class="kpi b"><div class="n">' + act.length + '</div><div class="k">กำลังดำเนินการ</div></div>' +

      (money() ? '<div class="kpi a"><div class="n">' + baht(act.reduce((s,p)=>s+p.amt,0)).replace("฿","") +
        '</div><div class="k">มูลค่า PO ที่ยังไม่ปิด</div></div>' : "") + "</div>";
    return h;
  }

  /* ================= ตรวจสอบก่อนบันทึก ================= */
  function checksOf(p) {
    const miss = missing(p), out = [];
    const add = (ok, lv, t, who) => out.push({ok:ok, lv:lv, t:t, who:who || ""});

    add(!!p.sap, "block",
        p.sap ? "ผูกกับ PO ใน B1 แล้ว (DocNum " + p.sap + ")" : "ยังไม่ได้ผูกกับ PO ใน B1", "SR");
    add(!miss.length, "block",
        miss.length ? "ขาดเอกสาร " + miss.length + " ใบ — " + miss.map(d => d.n).join(", ") : "เอกสารบังคับครบทุกใบ",
        miss.length ? miss[0].o : "");
    add(!p.claim, "block", p.claim ? "มีใบเคลมที่ยังไม่ได้รับใบลดหนี้" : "ไม่มีใบเคลมค้าง", "QC");

    if (money()) {
      const sum = p.payments.reduce((s, x) => s + x.amount, 0);
      add(!p.payments.length || sum === p.amt, "block",
          sum === p.amt ? "ผลรวมงวดจ่ายเท่ากับมูลค่า PO" : "งวดจ่ายรวม " + baht(sum) + " ไม่เท่ากับมูลค่า PO " + baht(p.amt), "AC");

      if (p.inv != null) {
        const diff = Math.abs(p.inv - p.amt), pct = p.amt ? diff / p.amt * 100 : 0;
        if (pct > 5) add(false, "block", "ยอดใบแจ้งหนี้ต่างจาก PO " + baht(diff) + " (" + pct.toFixed(1) + "%) เกินเกณฑ์ 5%", "SR");
        else if (pct > 2) add(false, "warn", "ยอดใบแจ้งหนี้ต่างจาก PO " + baht(diff) + " (" + pct.toFixed(1) + "%) — ต้องระบุเหตุผล", "AC");
        else add(true, "block", "ยอดใบแจ้งหนี้ตรงกับ PO (" + baht(p.inv) + ")", "");
      } else add(false, "warn", "ยังไม่ได้รับใบแจ้งหนี้", "AC");

      add(unpaid(p).length === 0, "block",
          unpaid(p).length ? "ยังจ่ายไม่ครบ " + unpaid(p).length + " งวด" : "จ่ายครบทุกงวดและมีสลิปครบ", "AC");
    }
    return out;
  }

  /* ================= ฟอร์มบันทึกการจ่าย ================= */
  const pad2 = n => (n < 10 ? "0" : "") + n;
  function todayISO() { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
  function isoToTH(s) { const a = String(s).split("-"); return a.length === 3 ? a[2] + "/" + a[1] + "/" + a[0] : s; }
  function thToISO(s) { const a = String(s).split("/"); return a.length === 3 ? a[2] + "-" + a[1] + "-" + a[0] : ""; }
  const dayDiff = (a, b) => Math.round((Date.parse(a) - Date.parse(b)) / 86400000);
  const numOf = id => { const e = document.getElementById(id); return e ? (parseFloat(e.value) || 0) : 0; };
  const valOf = id => { const e = document.getElementById(id); return e ? e.value : ""; };

  function payTarget() {
    if (!payOpen) return null;
    const p = POS.filter(x => x.no === payOpen.po)[0];
    if (!p) return null;
    const x = p.payments.filter(y => y.seq === payOpen.seq)[0];
    return x ? {p:p, x:x} : null;
  }

    payTouched = {amt:false, wht:false};

  function payCalc() {
    const t = payTarget(); if (!t) return;
    const x = t.x, p = t.p;
    const wr = WHT[valOf("py_whttype")] || WHT.GOODS;

    if (!payTouched.wht) {
      const e = document.getElementById("py_wht");
      if (e) e.value = (x.amount * wr.r / 100).toFixed(2);
    }
    const wht = numOf("py_wht"), fee = numOf("py_fee"), feeBy = valOf("py_feeby");
    const expect = x.amount - wht + (feeBy === "OUR" ? fee : 0);
    const net    = x.amount - wht - (feeBy === "SUPPLIER" ? fee : 0);
    if (!payTouched.amt) {
      const e = document.getElementById("py_amt");
      if (e) e.value = expect.toFixed(2);
    }
    const amt = numOf("py_amt"), diff = amt - expect;

    const cb = document.getElementById("py_calc");
    if (cb) cb.innerHTML =
      '<div class="cl"><span>ยอดตามงวด</span><span>' + baht(x.amount) + "</span></div>" +
      '<div class="cl"><span>− ภาษีหัก ณ ที่จ่าย (' + wr.r + "%)</span><span>" + baht(wht) + "</span></div>" +
      '<div class="cl"><span>' + (feeBy === "OUR" ? "+" : "−") + " ค่าธรรมเนียมโอน (" +
        (feeBy === "OUR" ? "บริษัทรับภาระ" : "ผู้ขายรับภาระ") + ")</span><span>" + baht(fee) + "</span></div>" +
      '<div class="cl tot"><span>ยอดที่ควรตัดจากบัญชี</span><span>' + baht(expect) + "</span></div>" +
      '<div class="cl"><span>ผู้ขายได้รับ</span><span>' + baht(net) + "</span></div>";

    // กฎตรวจสอบ P1–P11
    const errs = [], warns = [];
    const d = valOf("py_date"), vd = valOf("py_value"), ref = valOf("py_ref").trim();
    const today = todayISO();

    if (!d) errs.push("ต้องระบุวันที่จ่าย");
    else if (dayDiff(d, today) > 0) errs.push("P1 · วันที่จ่ายเป็นวันข้างหน้า — บันทึกได้เมื่อจ่ายจริงแล้ว");
    if (vd && d && dayDiff(vd, d) < 0) errs.push("P2 · วันที่ธนาคารตัดเงินต้องไม่ก่อนวันที่จ่าย");
    if (amt <= 0) errs.push("P3 · จำนวนเงินต้องมากกว่า 0");
    if (wr.r > 15) errs.push("P4 · อัตราหัก ณ ที่จ่ายผิดปกติ");
    if (!document.getElementById("py_slip") || !document.getElementById("py_slip").checked)
      errs.push("P5 · ต้องแนบสลิปหรือ Swift ก่อนบันทึก");
    if (!ref) errs.push("P6 · ต้องใส่เลขอ้างอิงเพื่อกระทบยอดกับ statement");

    if (Math.abs(diff) > 1) {
      if (!valOf("py_reason").trim())
        errs.push("P7 · ยอดต่างจากที่คำนวณ " + baht(Math.abs(diff)) + " — ต้องระบุเหตุผล");
      else warns.push("P7 · ยอดต่าง " + baht(Math.abs(diff)) + " · เหตุผลถูกบันทึกและขึ้นในรายงานหัวหน้าบัญชี");
    }
    const already = p.payments.filter(y => y.status === "PAID" && y.seq !== x.seq)
      .reduce((s, y) => s + y.amount, 0);
    if (already + x.amount > p.amt + 1) errs.push("P8 · จ่ายรวมเกินมูลค่า PO");
    if (d && dayDiff(today, d) > 7) warns.push("P9 · จ่ายย้อนหลัง " + dayDiff(today, d) + " วัน — ต้องให้หัวหน้าบัญชีอนุมัติเพิ่ม");
    if (ref && POS.some(q => q.payments.some(y => y.ref === ref && !(q.no === p.no && y.seq === x.seq))))
      errs.push("P11 · เลขอ้างอิงนี้ถูกใช้แล้วในรายการจ่ายอื่น — กันการจ่ายซ้ำ");
    if (d && x.due && dayDiff(d, thToISO(x.due)) > 0)
      warns.push("จ่ายช้ากว่ากำหนด " + dayDiff(d, thToISO(x.due)) + " วัน — บันทึกไว้ในตัวชี้วัดการจ่ายตรงเวลา");

    const eb = document.getElementById("py_err");
    if (eb) eb.innerHTML = errs.map(e => '<div class="e1">' + esc(e) + "</div>").join("") +
      warns.map(w => '<div class="w1">' + esc(w) + "</div>").join("");
    return errs;
  }

    reject: {t:"ไม่อนุมัติ PO นี้",
      d:"งานจะถูกตีกลับไปที่จัดซื้อพร้อมเหตุผล และบันทึกไว้ในประวัติถาวร", ok:"ยืนยัน ไม่อนุมัติ"},
    void:   {t:"กลับรายการจ่ายที่บันทึกไปแล้ว",
      d:"รายการเดิม<b>ไม่ถูกลบ</b> — จะถูกปิดเป็น “กลับรายการ” และเปิดงวดใหม่ให้ตั้งเรื่องขอจ่ายอีกครั้ง · " +
        "ใช้เมื่อจ่ายผิดจริงเท่านั้น เพราะขึ้นในรายงานของหัวหน้าบัญชี", ok:"ยืนยัน กลับรายการ"}
  };

  function confirmPanel() {
    const el = $("#confirm");
    if (!pendingAct) { el.innerHTML = ""; return; }
    const c = CONFIRM[pendingAct.act];
    el.innerHTML = '<div class="bugwrap" data-cf="no"></div>' +
      '<div class="bugpanel" role="alertdialog" aria-label="ยืนยัน">' +
      "<h3>ยืนยันก่อนทำ<button data-cf=\"no\" aria-label=\"ปิด\">✕</button></h3>" +
      '<div class="bugbody"><div class="big" style="font-size:15px;font-weight:700">' + esc(c.t) + "</div>" +
      '<div style="font-size:13.5px;color:var(--ink-2)">' + c.d + "</div>" +
      '<div class="fl2"><button class="btn" data-cf="no">ยกเลิก</button>' +
      '<button class="btn bad" data-cf="yes">' + esc(c.ok) + "</button></div></div></div>";
  }

  /* ================= การกระทำ ================= */
  function advance(p, note) {
    p.tl.push(["วันนี้", ROLES[role].person, note]);
    let n = p.stage + 1;
    while (n < STAGES.length && p.skip.indexOf(n) >= 0) n++;
    p.stage = n; p.age = 0;
    if (p.stage >= STAGES.length) {
      p.stage = STAGES.length; p.status = "COMPLETED";
      p.tl.push(["วันนี้","ระบบ","ปิดรายการ — ย้ายไปแท็บเสร็จสิ้น"]);
      toast(p.no + " ปิดรายการแล้ว — ย้ายออกจากรายการที่กำลังดำเนินการ");
    } else {
      toast("ส่งต่อให้ " + ROLES[STAGES[p.stage].o].name + " แล้ว — ระบบแจ้งเตือนให้เอง");
    }
  }

  let confirmedOnce = null;
  function runAct(act, seq) {
    confirmedOnce = act;
    onClick({ target: { closest(sel) {
      if (sel === "[data-payact]" && act === "void") return {dataset:{payact:"void", seq:seq}};
      if (sel === "[data-act]" && act !== "void") return {dataset:{act:act}};
      return null;
    } } });
    confirmedOnce = null;
  }

  document.addEventListener("click", onClick);
  function onClick(ev) {
    const rb = ev.target.closest("[data-role]");
    if (rb) { role = rb.dataset.role; render(); return; }
    const nb = ev.target.closest("[data-page]");
    if (nb) { page = nb.dataset.page; openPo = null; openClaim = null; openIC = null;
      subtab = SUB0[page] || "ACTIVE"; render(); return; }

    const bg = ev.target.closest("[data-bug]");
    if (bg) {
      const a = bg.dataset.bug;
      if (a === "open")  { bugOpen = true;  bugPanel(); return; }
      if (a === "close") { bugOpen = false; bugPanel(); return; }
      if (a === "send") {
        const ta = document.getElementById("bugtext");
        const txt = ta ? ta.value.trim() : "";
        if (!txt) { toast("กรุณาเล่าสั้น ๆ ว่าเกิดอะไรขึ้น"); if (ta) ta.focus(); return; }
        const sv = document.querySelector('input[name="bugsev"]:checked');
        bugSev = sv ? sv.value : "WRONG";
        const id = "BUG-26-00" + (32 + ISSUES.length - 3);
        ISSUES.unshift({id:id, sev:bugSev, t:txt.slice(0, 70),
          page:PAGENAME[page] || page, ref:(page === "detail" ? openPo : openClaim) || "—",
          by:ROLES[role].person, role:role, tm:"เมื่อสักครู่", status:"NEW", n:1, note:""});
        bugOpen = false;
        toast(bugSev === "BLOCKER" ? id + " ส่งแล้ว — แจ้งกลุ่ม Lark ของ IT ทันที"
                                   : id + " ส่งแล้ว — ติดตามสถานะได้ที่ ตั้งค่าระบบ");
        bugPanel(); render(); return;
      }
      return;
    }

    const cf = ev.target.closest("[data-cf]");
    if (cf) {
      if (cf.dataset.cf === "no") { pendingAct = null; confirmPanel(); return; }
      const a = pendingAct; pendingAct = null; confirmPanel();
      if (a) runAct(a.act, a.seq, true);
      return;
    }

    const sn = ev.target.closest("[data-act]");
    if (sn && sn.dataset.act === "sapnow") {
      SAP.at = "เมื่อสักครู่"; SAP.ok = true;
      SAP.objs.forEach(o => { o.st = "OK"; o.last = "เมื่อสักครู่"; });
      toast("ดึงข้อมูลจาก B1 ใหม่แล้ว — ปกติทำอัตโนมัติทุก 30 นาที ไม่ต้องกดเอง");
      render(); return;
    }

    const nt = ev.target.closest("[data-notif]");
    if (nt) {
      const n = NOTIFS.filter(x => String(x.id) === nt.dataset.notif)[0];
      if (n) {
        n.read = true;
        if (n.ref && POS.some(p => p.no === n.ref)) { openPo = n.ref; page = "detail"; }
        else if (n.ref) { page = "req"; subtab = "CLAIM"; openClaim = n.ref; }
      }
      render(); return;
    }
    const sb = ev.target.closest("[data-sub]");
    if (sb) { subtab = sb.dataset.sub; openClaim = null; openIC = null; render(); return; }
    const bk = ev.target.closest("[data-back]");
    if (bk) {
      if (bk.dataset.back === "req") { openClaim = null; openIC = null; page = "req"; }
      else { openPo = null; page = "po"; subtab = "ACTIVE"; }
      render(); return;
    }
    if (ev.target.closest("[data-clear]")) { q = ""; fDept = ""; render(); return; }

    const pr = ev.target.closest("[data-po]");
    if (pr) { openPo = pr.dataset.po; page = "detail"; render(); return; }
    const cr = ev.target.closest("[data-claim]");
    if (cr) { openClaim = cr.dataset.claim; page = "req"; subtab = "CLAIM"; render(); return; }

    const ic = ev.target.closest("[data-ic]");
    if (ic) {
      const r = ITEMREQS.filter(x => x.id === ic.dataset.id)[0]; if (!r) return;
      if (ic.dataset.ic === "approve") { r.status = "WAIT_LS"; toast("อนุมัติแล้ว — เข้าคิว LS อัตโนมัติ ไม่ต้องเดินเอกสาร"); }
      if (ic.dataset.ic === "sap") {
        r.status = "DONE"; r.sap = "FG-" + Math.floor(1000 + Math.random()*8999);
        const p = POS.filter(x => x.no === r.po)[0];
        if (p && p.stage === 5) { p.stage = 6; p.tl.push(["วันนี้","ระบบ","ได้รหัส " + r.sap + " — PO เดินต่อได้"]); }
        toast("บันทึกรหัส " + r.sap + " แล้ว — " + (r.po || "") + " เดินต่อได้");
      }
      render(); return;
    }

    // ต้องอยู่หลัง [data-ic] เพราะปุ่มอนุมัติอยู่ในแถวที่กดเปิดได้
    const io = ev.target.closest("[data-icopen]");
    if (io) { openIC = io.dataset.icopen; page = "req"; subtab = "ITEM"; render(); return; }

    const cl = ev.target.closest("[data-cl]");
    if (cl) {
      const c = CLAIMS.filter(x => x.id === openClaim)[0]; if (!c) return;
      if (cl.dataset.cl === "report") toast("สร้าง Inspection Report จากข้อมูลในระบบแล้ว — ไม่ต้องพิมพ์ซ้ำ");
      if (cl.dataset.cl === "send") toast("ส่งใบเคลมพร้อมรูปหลักฐานให้ผู้ขายแล้ว");
      if (cl.dataset.cl === "cn") {
        c.cn = "CN-26-00" + (CLAIMS.indexOf(c) + 1);
        const p = POS.filter(x => x.no === c.po)[0];
        if (p) { p.claim = false; p.payments.forEach(x => { if (x.status === "BLOCKED") x.status = "PENDING"; });
                 p.tl.push(["วันนี้","ระบบ","ได้รับใบลดหนี้ " + c.cn + " — ปลดล็อกงวดจ่าย"]); }
        toast("บันทึกใบลดหนี้ " + c.cn + " — ปลดล็อกการจ่ายเงินอัตโนมัติ");
      }
      render(); return;
    }

    const p = POS.filter(x => x.no === openPo)[0];
    if (!p) return;

    const pa = ev.target.closest("[data-payact]");
    if (pa) {
      const act = pa.dataset.payact;
      if (act === "close") { payOpen = null; payModal(); return; }

      if (act === "save") {
        const t = payTarget(); if (!t) return;
        if (payCalc().length) { toast("บันทึกไม่ได้ — แก้ข้อที่ติดก่อน"); return; }
        const x = t.x, d = valOf("py_date");
        x.status = "PAID";
        x.paidAt = isoToTH(d);
        x.valueDate = isoToTH(valOf("py_value") || d);
        x.method = valOf("py_method");
        x.bank = valOf("py_bank");
        x.ref = valOf("py_ref").trim();
        x.whtType = valOf("py_whttype");
        x.whtRate = (WHT[x.whtType] || WHT.GOODS).r;
        x.wht = numOf("py_wht");
        x.fee = numOf("py_fee");
        x.feeBy = valOf("py_feeby");
        x.paidAmt = numOf("py_amt");
        x.note = valOf("py_note");
        x.slip = true;
        x.paidBy = ROLES[role].person;
        x.lateDays = x.due ? dayDiff(d, thToISO(x.due)) : 0;
        t.p.tl.push(["วันนี้", ROLES[role].person,
          "บันทึกจ่ายงวดที่ " + x.seq + " " + baht(x.paidAmt) + " · อ้างอิง " + x.ref]);
        t.p.tl.push(["วันนี้", "ระบบ", "แจ้งผู้ขายพร้อมสลิปทางอีเมล และแจ้งจัดซื้อใน Lark"]);
        payOpen = null; payModal();
        toast(unpaid(t.p).length
          ? "บันทึกแล้ว — เหลืออีก " + unpaid(t.p).length + " งวด · ส่งสลิปให้ผู้ขายอัตโนมัติ"
          : "จ่ายครบทุกงวดแล้ว · ส่งสลิปให้ผู้ขายอัตโนมัติ");
        render(); return;
      }

      if (act === "void" && confirmedOnce !== "void") {
        pendingAct = {act:"void", seq:pa.dataset.seq}; confirmPanel(); return;
      }
      const x = p.payments.filter(y => String(y.seq) === pa.dataset.seq)[0];
      if (!x) return;
      if (act === "form") { payOpen = {po:p.no, seq:x.seq}; payModal(); return; }
      if (act === "req") {
        x.status = "REQUESTED"; x.reqBy = ROLES[role].person;
        p.tl.push(["วันนี้", ROLES[role].person, "ตั้งเรื่องขอจ่ายงวดที่ " + x.seq + " " + baht(x.amount)]);
        toast(x.amount > APV_LIMIT ? "ส่งให้ผู้บริหารอนุมัติ (เกิน " + baht(APV_LIMIT) + ")"
                                   : "ส่งให้หัวหน้าบัญชีอนุมัติแล้ว");
      }
      if (act === "apv") {
        x.status = "APPROVED"; x.apvBy = ROLES[role].person;
        p.tl.push(["วันนี้", ROLES[role].person, "อนุมัติจ่ายงวดที่ " + x.seq]);
        toast("อนุมัติแล้ว — บัญชีบันทึกการจ่ายได้ (คนละคนกับผู้อนุมัติ)");
      }
      if (act === "rej") {
        x.status = "PENDING"; x.reqBy = "";
        p.tl.push(["วันนี้", ROLES[role].person, "ตีกลับคำขอจ่ายงวดที่ " + x.seq + " พร้อมเหตุผล"]);
        toast("ตีกลับให้บัญชีแล้ว");
      }
      if (act === "void") {
        // ไม่ลบ — ปิดรายการเดิมเป็น VOID แล้วเปิดงวดใหม่ให้ตั้งเรื่องอีกครั้ง
        x.status = "VOID";
        const seq = Math.max.apply(null, p.payments.map(y => y.seq)) + 1;
        p.payments.push(pay(seq, x.type + " (ทำจ่ายใหม่)", x.pct, x.amount, x.due, "PENDING", "",
          {note:"แทนงวดที่ " + x.seq + " ที่กลับรายการ"}));
        p.tl.push(["วันนี้", ROLES[role].person,
          "กลับรายการจ่ายงวดที่ " + x.seq + " — เปิดงวดที่ " + seq + " แทน (ของเดิมไม่ถูกลบ)"]);
        toast("กลับรายการแล้ว — ของเดิมยังอยู่เป็นหลักฐาน และเปิดงวดใหม่ให้ตั้งเรื่องอีกครั้ง");
      }
      render(); return;
    }
    const up = ev.target.closest("[data-up]");
    if (up) { advance(p, "อัพโหลด " + (DOCS.filter(d=>d.c===up.dataset.up)[0]||{n:""}).n); render(); return; }

    const ab = ev.target.closest("[data-act]");
    if (!ab) return;
    const a = ab.dataset.act;
    if (CONFIRM[a] && confirmedOnce !== a) { pendingAct = {act:a}; confirmPanel(); return; }
    if (a === "approve") advance(p, "อนุมัติภายใน");
    else if (a === "nudge") {
      p.tl.push(["วันนี้", ROLES[role].person, "เตือนงานไปที่ " + ROLES[ownerOf(p)].name]);
      toast("ส่งเตือนถึง " + person(ownerOf(p)) + " ทาง Lark แล้ว — บันทึกไว้ในประวัติด้วย");
    }
    else if (a === "sappull") {
      // ของจริงคือเรียกข้อมูล PO จาก B1 มาเติมให้ ไม่ให้คนพิมพ์เลขเอง
      p.sap = String(10250 + Math.floor(Math.random() * 40));   // DocNum ของ B1
      p.tl.push(["วันนี้", "ระบบ", "ดึง PO " + p.sap + " จาก B1 (OPOR/POR1) — ผู้ขาย จำนวน มูลค่า มาพร้อมกัน"]);
      p.tl.push(["วันนี้", "ระบบ", "สร้างงวดจ่ายจากเงื่อนไขชำระ (OCTG) ของ B1 อัตโนมัติ"]);
      advance(p, "ผูกกับ PO ใน B1");
    }
    else if (a === "reject") { p.tl.push(["วันนี้", ROLES[role].person, "ไม่อนุมัติ — ตีกลับพร้อมเหตุผล"]); toast("ตีกลับให้จัดซื้อแล้ว"); }
    else if (a === "qcpass") advance(p, "ตรวจรับผ่าน");
    else if (a === "goic") { page = "req"; subtab = "ITEM"; render(); return; }
    else if (a === "qcfail") {
      p.claim = true;
      p.payments.forEach(x => {
        if (["PENDING","REQUESTED","APPROVED"].indexOf(x.status) >= 0) x.status = "BLOCKED";
      });
      const cid = "CL-26-00" + (CLAIMS.length + 4);
      CLAIMS.unshift({id:cid, src:"INCOMING", date:"วันนี้", cust:"—", pi:"", dn:"",
        item:p.item, lot:"LOT-" + p.no.slice(-4), qty:"40 KG",
        desc:"ตรวจรับไม่ผ่านที่ห้องเย็นต้นทาง", qcResult:"FAIL", supplier:p.sup, po:p.no, cn:"", photos:0});
      p.tl.push(["วันนี้", ROLES[role].person, "ตรวจรับไม่ผ่าน"]);
      p.tl.push(["วันนี้","ระบบ","เปิดใบเคลม " + cid + " + ล็อกงวดจ่าย + แจ้งจัดซื้อและบัญชี"]);
      openClaim = cid; page = "req"; subtab = "CLAIM";
      toast("เปิดใบเคลม " + cid + " และล็อกการจ่ายเงินให้แล้ว");
      render(); return;
    }
    else if (a === "done") {
      // ขั้นปิดบัญชีถูกกั้นด้วยกฎตรวจสอบ — บอกทุกข้อที่ติดพร้อมกัน ไม่ใช่ทีละข้อ
      const bl = s.c === "AC_CLOSE" ? blockedBy(p) : [];
      if (bl.length) { toast("ปิดไม่ได้ — ติด " + bl.length + " ข้อ: " + bl.map(c => c.t).join(" · ")); render(); return; }
      advance(p, "ทำ " + STAGES[p.stage].n + " เสร็จ");
    }
    render();
  }

  const PAYFIELDS = ["py_date","py_value","py_method","py_bank","py_ref","py_whttype",
    "py_wht","py_fee","py_feeby","py_amt","py_slip","py_reason","py_note"];

  document.addEventListener("input", function (ev) {
    if (ev.target.id === "q") { q = ev.target.value; const el = ev.target;
      renderMain(); const nq = document.getElementById("q");
      if (nq) { nq.focus(); nq.setSelectionRange(el.value.length, el.value.length); }
      return; }
    if (PAYFIELDS.indexOf(ev.target.id) >= 0) {
      if (ev.target.id === "py_amt") payTouched.amt = true;
      if (ev.target.id === "py_wht") payTouched.wht = true;
      payCalc();
    }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "fdept") { fDept = ev.target.value; renderMain(); return; }
    if (PAYFIELDS.indexOf(ev.target.id) >= 0) {
      if (ev.target.id === "py_whttype") payTouched.wht = false;
      payCalc();
    }
  });

  function renderMain() {
    const m = $("#main");
    if (page === "detail") m.innerHTML = pageDetail();
    else if (page === "po") m.innerHTML = pagePo();
    else if (page === "req") m.innerHTML = pageReq();
    else if (page === "inbox") m.innerHTML = pageInbox();
    else if (page === "admin") m.innerHTML = pageAdmin();
    else if (page === "report") m.innerHTML = pageReport();
    else m.innerHTML = pageHome();
  }
  function render() {
    chrome(); renderMain(); bugPanel(); payModal(); confirmPanel();
    window.scrollTo({top:0, behavior:"instant"});
  }
  render();
})();
</script>
